  - type: content
    kicker: 本节导引
    title: 四道树真题的共同难点：递归中携带什么额外信息
    blocks:
      - type: table
        head: [真题, 携带的信息, 模板]
        colW: [3.8, 5.2, 2.5]
        rows:
          - [2024 判BST, 一个 prev 值（引用传递）, 模板15]
