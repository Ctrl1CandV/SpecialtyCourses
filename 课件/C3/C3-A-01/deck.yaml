slides:
  - type: cover
    kicker: 重邮802 数据结构代码课程
    title: 数据结构题型实战阶段
    subtitle: 第1节 导学＋答题四步法＋链表骨架
    meta: 阶段：题型实战 ｜ 主讲：牙膏学长 ｜ 预计35分钟 ｜ 资料答疑：伴梦研途QQ群

  - type: content
    badge: 课段导学
    kicker: 课段导学 · 位置
    title: 这个课段管 30 分算法题和 20 分阅读题
    blocks:
      - type: table
        head: [802题型, 分值, 这个课段怎么帮你拿]
        rows:
          - [算法分析题, 3题30分, 17 道真题逐道走四步法，报模板、改条件、拿评分点]
          - [程序阅读题, 约20分, 三类考法各有固定做法，读结构定义是第一步]
      - type: bullets
        items:
          - "基础阶段给了你结构定义，强化阶段给了你 15 个算法模板；这个课段只做一件事——拿到一道没见过的题，30 秒认出它考哪个模板、改哪几处"
          - "2020—2026 的 17 道算法大题全部由经典模板加条件改写而来，认模板的能力就是这 30 分的能力"
      - type: note
        text: "学法与前两个阶段不同：每道真题先按暂停自己写，再看讲评——不先自己写，看讲解时会产生'我懂了'的错觉"

  - type: content
    badge: 课段导学
    kicker: 课段导学 · 目录
    title: 题型实战阶段八节课的目录
    blocks:
      - type: table
        head: [节次, 主题, 拿走什么]
        rows:
          - [第1—2节, 骨架与识别, 15 个可背骨架、四步法、三问定模板的决策表]
          - [第3—4节, 链表真题, 2026约瑟夫环、2025倒数第k、2021三问、2023循环段倒置、2022多项式、2020双向改造]
          - [第5节, 树真题, 2024判BST与繁荣度、2025最长路径、2026建树]
          - [第6节, 图真题, 2026判拓扑、2025经过k路径、2024长度k路径、2023像素距离]
          - [第7节, 查找排序真题＋阅读题, 2021双调、2020逆序对、Top-K、程序阅读三类考法]
          - [第8节, 冲刺总结, 决策树、易错七条、17题回顾表、考场策略]

  - type: content
    badge: 课段导学
    kicker: 课段导学 · 怎么听
    title: 每道真题固定四步讲，课后重写计时
    blocks:
      - type: bullets
        items:
          - "每道真题的讲法固定：给题面按暂停自己写 → 报结构与模板 → 逐段改条件 → 补边界给三件套与评分点"
          - "听讲评时重点听两处：从模板到这道题改了哪几处、这道题最容易丢的是哪一分"
          - "课后任务固定两道：课上那道真题计时重写一遍，加一道改条件的变式题"
          - "算法原理不重讲：需要时一句'见数据结构强化阶段第几节'带过，本课段的重心是认题与改条件"
      - type: note
        text: "如果你没学过强化阶段也能跟：每道题都给完整代码，课段自洽"

  - type: content
    kicker: 答题格式
    title: 答题三件套：书写格式与分值分布
    blocks:
      - type: table
        head: [段, 写什么, 分值占比]
        colW: [2.2, 6.8, 2.5]
        rows:
          - [① 算法思想, 文字说清分几步、每步干什么, 约2—3分]
          - [② 算法代码, 伪代码：结构体定义、函数签名、边界判断必须完整, 约5—7分]
          - [③ 复杂度分析, 时间与空间各一个结论，各配一句理由, 约1—2分]
      - type: bullets
        items:
          - "三件各占分值，缺一件扣一件；思想那一件还能在代码没写完时救分——考场上代码卡住，先把思想写满"
          - "开头写一句下标与结构的声明（例如'设链表带头结点，数据从 L->next 起'），阅卷一眼看清你的约定"
      - type: note
        text: "书写排版：三段各标小标题'算法思想/算法代码/复杂度分析'，草稿纸先画结构图再写代码，不要直接在草稿上写代码"

  - type: content
    kicker: 答题四步法
    title: 四步法：认结构、选模板、改条件、补边界
    blocks:
      - type: table
        head: [步骤, 做什么, 常见失分]
        colW: [2.2, 6.3, 3.0]
        rows:
          - [① 认结构, 题目给的定义：带头结点吗、字段叫什么、下标从几起、什么存储, 抄错字段名、看漏'无头结点']
          - [② 选模板, 对照 15 张模板卡报编号，说出题面特征命中哪张卡, 认不出模板，从零硬想]
          - [③ 改条件, 把题目条件逐条翻译成模板的改动点，边写边核对, 漏改一处条件]
          - [④ 补边界, 空表、越界、复位、k 与 n 的合法性，再给复杂度, 边界分支整段没写]
      - type: note
        text: "802 的命题本质是模板加改条件，所以四步里第③步最值钱；下一页用一道最简单的题完整走一遍"

  - type: content
    kicker: 四步法 · 完整示范
    title: 示范：单链表就地逆置，四步走一遍（先按暂停自己写）
    blocks:
      - type: text
        text: "题面（题集勾画 2算17 同类）：设带头结点单链表 L，设计算法将链表就地逆置（空间 O(1)）。先按暂停，自己按四步写一遍，再看下面的对照。"
      - type: bullets
        items:
          - "① 认结构：带头结点单链表，L 指头结点，数据从 L->next 开始；'就地'意味着不许新建结点"
          - "② 选模板：要把顺序反过来——模板1 头插法，头插天然反序"
          - "③ 改条件：原地逆置的改动是先把链断成'空表+待处理串'（L->next=NULL），再逐个头插回去；循环里先存后继再摘结点"
          - "④ 补边界：空表与只有一个结点直接返回；复杂度时间 O(n) 每结点摘插一次、空间 O(1) 只用两个指针"
      - type: note
        text: "四步走完，三件套自然成形：②③是思想段，③的代码是代码段，④是复杂度段——四步法不是额外负担，就是三件套的生产流程"

  - type: content
    kicker: 骨架一 · 模板1
    title: 头插逆置：断链后逐个头插回去
    blocks:
      - type: code
        text: |
          L->next = NULL;                     // 断成空表
          while(p != NULL){
              temp = p;  p = p->next;         // 先存后继再摘
              temp->next = L->next;  L->next = temp;   // 头插
          }
      - type: bullets
        items:
          - "题面特征：逆置、重组、归并成递减表、局部区间倒置——凡是'要反序'就想到它"
          - "两处最容易错：忘先存后继（头插会改掉 temp->next）、忘断链（不断链头插会成环）"
          - "变体：局部区间逆置（2023 循环段倒置）把头插目标从 L->next 换成区间前驱的 next"
      - type: note
        text: "背到能默写；2023 年 12 分大题的核心就是它在局部区间上用"

  - type: content
    kicker: 骨架二 · 模板2
    title: 快慢指针：找中点、倒数第 k、判环
    blocks:
      - type: code
        text: |
          while(fast != NULL && fast->next != NULL){
              slow = slow->next;  fast = fast->next->next;
          }                                 // 偶数个时 slow 停在前半段最后一个
          // 倒数第k变体：q 先走 k 步，再 p、q 同步走，q 到表尾时 p 即倒数第 k
      - type: bullets
        items:
          - "题面特征：找中点、倒数第 k、判断有环——两个指针不同速度走同一条链"
          - "终止条件决定停点：fast 与 fast->next 双条件保证偶数个时 slow 停在前半段最后一个，这是重排题能交替插入的前提"
          - "倒数第 k 的对照解法是辅助栈（模板14）：全压栈弹 k 次，空间 O(n)；快慢指针空间 O(1)，要'输出倒数 k 个全部'时栈更自然"
      - type: note
        text: "2025 年真题考过倒数第 k；408-2019 重排的第一步找中点也是它"

  - type: content
    kicker: 骨架三 · 模板3
    title: 断链拼接三步走：摘、逆、插
    blocks:
      - type: bullets
        items:
          - "三个动作：把目标段从链上摘下来（断链）、对这一段做处理（常用头插逆置）、再插回指定位置（拼接）"
          - "题面特征：重排、改造链的结构——2020 双向循环改造、408-2019 重排（找中点、逆置后半、交替插入）都是它"
          - "关键动作是'记住接口'：摘下之前先记住断点两侧与段的首尾，接回时全靠它们"
          - "每一步改指针前先画改前改后两张图（C语言强化阶段练的'画图再写'），双链表一次要改四条指针，漏一条就断链"
      - type: note
        text: "这是五个骨架里唯一没有固定代码形态的——它的价值是动作顺序：先接后断、记住接口、改完查孤立结点"

  - type: content
    kicker: 骨架四 · 模板4
    title: 条件删除：前驱跟随，删完 p 重新取
    blocks:
      - type: code
        text: |
          LNode *pre = L, *p = L->next;
          while(p != NULL){
              if(条件){
                  pre->next = p->next;  free(p);
                  p = pre->next;            // pre 不动，p 重新取
              }else{ pre = p;  p = p->next; }   // 不删才一起走
          }
      - type: bullets
        items:
          - "题面特征：删除满足某条件的结点、保留满足条件的结点——2021 真题第三问（删比 x 大的正偶数）就是它"
          - "核心一句：删除后 pre 停在原地、p 从 pre->next 重新取；如果删完还写 pre=p，会跳过下一个待检查结点"
          - "条件可以是值的范围、奇偶、与相邻元素的关系——改条件只改 if 里那一句"
      - type: note
        text: "先 free 再取 p->data 是经典错：读的是已回收内存；顺序永远是取值、改指针、再 free"

  - type: content
    kicker: 骨架五 · 模板11
    title: 循环链表模拟：建环、定位、报数摘结点
    blocks:
      - type: code
        text: |
          r->next = head;                       // 建环
          while(p->data != s){ pre = p; p = p->next; }   // 定位到第 s 个，pre 跟随
          while(p->next != p){                  // 只剩一个结点时停
              for(int i = 1; i < m; i++){ pre = p; p = p->next; }  // 报 m-1 步
              pre->next = p->next;  free(p);  p = pre->next;        // 摘除
          }
      - type: bullets
        items:
          - "题面特征：报数出列、轮转、约瑟夫环——2026 年 8 分大题就是它"
          - "三处与单链表的差别：终止条件从 p!=NULL 换成 p!=L（或 p->next!=p）、判空从 L->next==NULL 换成 L->next==L、尾巴接回头结点"
          - "定位与报数都要 pre 跟随：摘结点必须知道前驱"
      - type: note
        text: "2026 真题不带头结点（head 直接存 1 号），与课程默认约定不同——认结构那一步看清题目给的是什么"

  - type: content
    kicker: 本节小结
    title: 五个链表骨架一张表
    blocks:
      - type: table
        head: [骨架, 模板, 题面特征]
        colW: [3.0, 1.8, 6.7]
        rows:
          - [头插逆置, 模板1, 逆置、重组、归并成递减、局部倒置]
          - [快慢指针, 模板2, 找中点、倒数第k、判环]
          - [断链拼接三步走, 模板3, 重排、改造链的结构]
          - [条件删除前驱跟随, 模板4, 按条件删结点]
          - [循环链表模拟, 模板11, 报数出列、轮转、约瑟夫环]
      - type: note
        text: "下一节过树、图、查找、排序的九个骨架，收官是一张三问定模板的决策表"

  - type: content
    kicker: 课后任务
    title: 1道默写 ＋ 1道识别
    blocks:
      - type: bullets
        items:
          - "**默写题**：五个骨架合上资料各写一遍，每个骨架旁边标出它的模板编号"
          - "**识别题**：给四道题面（题集勾画 2算21 归并成递减、2算12 删区间内结点、2算6 倒数第 k、2算30 循环链表删前驱），只报模板编号与需要改动的地方，不写代码"
      - type: note
        text: "识别题是这个课段专属的练法：练的是认题，不是写题。参考答案在本PPT最后两页，课后自行对照"

  - type: content
    kicker: 参考答案 · 默写题
    title: 默写题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          头插逆置: L->next=NULL; while(p){ temp=p; p=p->next;
                    temp->next=L->next; L->next=temp; }
          快慢指针: while(fast && fast->next){ slow=slow->next;
                    fast=fast->next->next; }
          条件删除: if(条件){ pre->next=p->next; free(p); p=pre->next; }
                    else { pre=p; p=p->next; }
          循环模拟: 建环 r->next=head; 终止 p->next!=p; 摘 pre->next=p->next
      - type: note
        text: "断链拼接三步走没有固定代码形态，默写它的三个动作顺序：摘（记住接口）、逆（头插）、插（先接后断）"

  - type: content
    kicker: 参考答案 · 识别题
    title: 识别题参考答案（自行对照）
    blocks:
      - type: bullets
        items:
          - "2算21 归并成递减：模板1 头插法——改动点是归并时不用尾插用头插，天然反序"
          - "2算12 删区间内结点：模板4 条件删除——改动点是条件换成 data>mink 且 data<maxk，表有序删完可提前 break"
          - "2算6 倒数第 k：模板2 快慢指针——改动点是 q 先走 k 步再同步走，k 超表长返回失败"
          - "2算30 循环链表删前驱：模板11 循环模拟——改动点是遍历终止用 p!=L，找前驱绕环走"
      - type: note
        text: "识别题的标准：30 秒内报出模板编号与改动点，说不出来就回对应骨架页重背"

