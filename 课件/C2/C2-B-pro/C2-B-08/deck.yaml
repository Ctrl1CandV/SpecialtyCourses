- type: content
  kicker: 引题
  title: 查找的代码题少，为什么还要讲代码
  blocks:
  - type: bullets
    items:
    - 17 道算法大题中查找题较少（2021 双调序列）；综合应用题还会涉及折半判定树、BST、AVL 和散列 ASL
    - 手算题要能还原代码过程：判定树展示每次折半比较，BST/AVL画出插入与调整后的树形；ASL 完整计算留给专业课
    - 所以本节的定位：代码讲到能读懂能改写，手算只讲'它在代码里长什么样'，ASL 的完整计算训练留给专业课
  - type: note
    text: 这一节六个查找方法：顺序、折半、BST、AVL、散列、分块；前两个是线性表查找，后四个是树形与散列查找
- type: content
  kicker: 顺序查找 · 哨兵法
  title: 哨兵法：把两个判断合并成一个
  blocks:
  - type: code
    text: "int SeqSearch(int A[], int n, int key){\n    A[0]=key;                     // A[0] 作哨兵，数据在 A[1..n]\n    int i=n;\n    while(A[i]!=key)\
      \ i--;         // 哨兵保证最终命中\n    return i;                     // 0 表示未命中\n}"
    size: 11
  - type: bullets
    items: &id001
    - A[0] 放 key，数据在 A[1..n]；哨兵让向前扫描一定停止。
    - 循环只检查 A[i]!=key；返回0表示未命中，否则返回位置。
    - 只省去边界判断，时间仍为 O(n)；顺序查找不要求数据有序。
    size: 12.5
  layout: split
  leftWidth: 6.9
  columns:
  - - type: code
      text: "int SeqSearch(int A[], int n, int key){\n    A[0]=key;                     // A[0] 作哨兵，数据在 A[1..n]\n    int i=n;\n    while(A[i]!=key)\
        \ i--;         // 哨兵保证最终命中\n    return i;                     // 0 表示未命中\n}"
      size: 11
  - - type: bullets
      items: *id001
      size: 12.5
- type: content
  kicker: 折半查找
  title: 折半查找：三个边界都要讲清
  blocks:
  - type: code
    text: "int BinSearch(int A[], int low, int high, int key){\n    while(low <= high){\n        int mid = (low + high) / 2;\n     \
      \   if(key == A[mid]) return mid + 1;      // 返回位序\n        else if(key < A[mid]) high = mid - 1;\n        else low = mid + 1;\n\
      \    }\n    return 0;                                  // 查找失败\n}\n"
    size: 12
  - type: bullets
    items:
    - 边界一：low<=high 带等号，因为 low==high 时区间里还剩一个元素要查
    - 边界二：high=mid-1 与 low=mid+1 不能写成 mid，否则区间不缩小、死循环
    - 边界三：返回 mid+1 是位序，与基础阶段第2节 LocateElem 返回 i+1 是同一个约定
  - type: note
    text: 时间 O(logn)；前提是线性表有序且顺序存储——链表不能折半，因为取中间元素要 O(n)
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "int BinSearch(int A[], int low, int high, int key){\n    while(low <= high){\n        int mid = (low + high) / 2;\n   \
        \     if(key == A[mid]) return mid + 1;      // 返回位序\n        else if(key < A[mid]) high = mid - 1;\n        else low = mid\
        \ + 1;\n    }\n    return 0;                                  // 查找失败\n}\n"
      size: 11
  - - type: bullets
      items:
      - 边界一：low<=high 带等号，因为 low==high 时区间里还剩一个元素要查
      - 边界二：high=mid-1 与 low=mid+1 不能写成 mid，否则区间不缩小、死循环
      - 边界三：返回 mid+1 是位序，与基础阶段第2节 LocateElem 返回 i+1 是同一个约定
      size: 13
    - type: note
      text: 时间 O(logn)；前提是线性表有序且顺序存储——链表不能折半，因为取中间元素要 O(n)
      size: 12
- type: content
  kicker: 折半查找 · 判定树
  title: 判定树：折半查找过程的图形化
  blocks:
  - type: bullets
    items:
    - 判定树把每次折半比较画成结点；单次成功查找的比较次数等于目标结点的层数。
    - 本课练路径和单次比较次数；平均查找长度的完整计算留给专业课。
  layout: hybrid
- type: content
  kicker: BST · 查找与插入
  title: BST 的查找与插入：参数为什么是指针的引用
  blocks:
  - type: code
    text: "BSTNode *BSTSearch(BSTNode *T, int key){\n    while(T != NULL && key != T->key){\n        if(key < T->key) T = T->lchild;\
      \ else T = T->rchild;\n    }\n    return T;                              // NULL 表示没找到\n}\nint BSTInsert(BSTNode *&T, int key){\n\
      \    if(T == NULL){                         // 找到空位，新建结点\n        T = (BSTNode*)malloc(sizeof(BSTNode));\n        T->key = key;\
      \ T->lchild = T->rchild = NULL;  return 1;\n    }\n    if(key == T->key) return 0;            // 已存在，不插\n    return key<T->key\
      \ ? BSTInsert(T->lchild,key) : BSTInsert(T->rchild,key);\n}\n"
    size: 12
  - type: bullets
    items:
    - BST 性质：左子树全部小于根、右子树全部大于根，中序遍历是有序序列
    - 插入参数是 BSTNode *&T（指针的引用）：要改的是父结点的 lchild 或 rchild 字段，不是 T 自己的副本；不带 & 新建的结点接不到树上
  - type: note
    text: 查找时间 O(树高)，最坏 O(n)（单支树）；插入位置一定是叶子，找空位的过程就是查找过程
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "BSTNode *BSTSearch(BSTNode *T, int key){\n    while(T != NULL && key != T->key){\n        if(key < T->key) T = T->lchild;\
        \ else T = T->rchild;\n    }\n    return T;                              // NULL 表示没找到\n}\nint BSTInsert(BSTNode *&T, int key){\n\
        \    if(T == NULL){                         // 找到空位，新建结点\n        T = (BSTNode*)malloc(sizeof(BSTNode));\n        T->key = key;\
        \ T->lchild = T->rchild = NULL;  return 1;\n    }\n    if(key == T->key) return 0;            // 已存在，不插\n    return key<T->key\
        \ ? BSTInsert(T->lchild,key) : BSTInsert(T->rchild,key);\n}\n"
      size: 11
  - - type: bullets
      items:
      - BST 性质：左子树全部小于根、右子树全部大于根，中序遍历是有序序列
      - 插入参数是 BSTNode *&T（指针的引用）：要改的是父结点的 lchild 或 rchild 字段，不是 T 自己的副本；不带 & 新建的结点接不到树上
      size: 13
    - type: note
      text: 查找时间 O(树高)，最坏 O(n)（单支树）；插入位置一定是叶子，找空位的过程就是查找过程
      size: 12
- type: content
  kicker: BST · 删除
  title: BST 的删除：三种情况
  blocks:
  - type: code
    text: "int BSTDelete(BSTree &T, int key){\n    if(T==NULL) return 0;\n    if(key<T->key) return BSTDelete(T->lchild, key);\n   \
      \ if(key>T->key) return BSTDelete(T->rchild, key);\n    if(T->lchild==NULL){ BSTNode *s=T; T=T->rchild; free(s); return 1; }\n\
      \    if(T->rchild==NULL){ BSTNode *s=T; T=T->lchild; free(s); return 1; }\n    BSTNode *pre=T->lchild;                    // 双孩子：找中序前驱\n\
      \    while(pre->rchild) pre=pre->rchild;\n    T->key=pre->key;  return BSTDelete(T->lchild, pre->key);\n}\n"
    size: 12
  - type: bullets
    items:
    - ① 叶子：直接删，不影响其他结点；② 单孩子：把孩子接到父结点上（参数是引用，T=T->rchild 就直接改了父结点的字段）
    - ③ 双孩子：不能直接删（两棵子树会断），用中序前驱（左子树最大值）替换值，再递归删那个前驱——前驱一定没有右孩子，回到情况①或②
  - type: note
    text: 为什么用中序前驱能保持 BST 性质：前驱是中序序列里刚好小于它的值，替换后左子树全部小于它、右子树全部大于它
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "int BSTDelete(BSTree &T, int key){\n    if(T==NULL) return 0;\n    if(key<T->key) return BSTDelete(T->lchild, key);\n \
        \   if(key>T->key) return BSTDelete(T->rchild, key);\n    if(T->lchild==NULL){ BSTNode *s=T; T=T->rchild; free(s); return 1;\
        \ }\n    if(T->rchild==NULL){ BSTNode *s=T; T=T->lchild; free(s); return 1; }\n    BSTNode *pre=T->lchild;                 \
        \   // 双孩子：找中序前驱\n    while(pre->rchild) pre=pre->rchild;\n    T->key=pre->key;  return BSTDelete(T->lchild, pre->key);\n}\n"
      size: 11
  - - type: bullets
      items:
      - ① 叶子：直接删，不影响其他结点；② 单孩子：把孩子接到父结点上（参数是引用，T=T->rchild 就直接改了父结点的字段）
      - ③ 双孩子：不能直接删（两棵子树会断），用中序前驱（左子树最大值）替换值，再递归删那个前驱——前驱一定没有右孩子，回到情况①或②
      size: 13
    - type: note
      text: 为什么用中序前驱能保持 BST 性质：前驱是中序序列里刚好小于它的值，替换后左子树全部小于它、右子树全部大于它
      size: 12
- type: content
  kicker: BST 删除 · 过程页
  title: 删除双孩子结点：中序前驱替换四步（拿纸跟画）
  blocks:
  - type: image
    src: assets/diagrams/b8-bst-delete.png
    w: 8.5
    h: 2.7
    align: center
    fit: contain
  - type: bullets
    items:
    - ① 找中序前驱：待删结点左子树的最右结点（图中删 45，前驱是左子树最右的 37）
    - ② 把前驱的值 37 拷到待删结点，树的结构没变、只改了值
    - ③ 递归到左子树删 37：它没有右孩子，按情况①或②删掉
    - ④ 验证：中序序列仍然有序，BST 性质保持
  - type: note
    text: 也可以用中序后继（右子树最小值）替换，两者对称；本课统一用前驱
