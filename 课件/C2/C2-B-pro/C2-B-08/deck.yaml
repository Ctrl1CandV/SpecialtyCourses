- type: content
  kicker: 散列表
  title: 散列冲突：开放定址与链地址都给出可写代码
  blocks:
  - &id004
    type: code
    text: "// Table has 11 slots; EMPTY and DELETED are reserved\nbool InsertOpen(int H[], int key){\n    int addr=key%11, firstDeleted=-1;\n    for(int k=0;k<11;k++){\n        if(H[addr]==key) return true;\n        if(H[addr]==DELETED&&firstDeleted<0) firstDeleted=addr;\n        else if(H[addr]==EMPTY){\n            H[firstDeleted<0?addr:firstDeleted]=key; return true;\n        }\n        addr=(addr+1)%11;\n    }\n    if(firstDeleted<0) return false;\n    H[firstDeleted]=key; return true;\n}"
    size: 10
  - &id005
    type: code
    text: "// H[i] points to the head of a bucket chain\nvoid InsertChain(Node *H[], int key){\n    int h=key%11;\n    for(Node *q=H[h];q!=NULL;q=q->next)\n        if(q->key==key) return;\n    Node *p=(Node*)malloc(sizeof(Node));\n    if(p==NULL) return;\n    p->key=key; p->next=H[h]; H[h]=p;\n}"
    size: 10
  - &id006
    type: note
    text: 例子表长11，key非负且不取 EMPTY/DELETED；探测最多11格。查找遇 DELETED 继续，遇 EMPTY 或绕回一圈才失败；链地址沿桶链查找，ASL 详算留到专业课。
    size: 12
  layout: split
  leftWidth: 5.7
  columns:
  - - *id004
  - - *id005
    - *id006
- type: content
  kicker: 分块查找
  title: 分块查找：索引表加块内顺序查找
  blocks:
  - type: bullets
    items:
    - 索引表存每块的最大值与起始位置，先在索引表里找块（可以折半），再在块内顺序查找
    - 块间有序、块内无序，是顺序查找与折半查找的折中：不要求整体有序，又比纯顺序快
    - ASL 是两次查找之和：索引表查找加块内查找
  - type: note
    text: 代码不写，只给思想；分块查找是填空题的考点（题集勾画 9答28 同类）
