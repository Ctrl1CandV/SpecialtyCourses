- type: content
  kicker: 引题
  title: 递归为什么适合处理树
  blocks:
  - type: bullets
    items:
    - 二叉树的定义本身就是递归的：二叉树是空树，或者由一个根结点加上左、右两棵子树构成，子树还是二叉树
    - 每一层要做的动作完全一样：处理根、处理左子树、处理右子树，只是作用的对象越来越小
    - 先序、中序、后序遍历就是同一个递归体的三种执行顺序，数据结构基础阶段第7节已经写过
    - 想一个问题：求树的高度、求结点数，如果不用递归，循环该怎么写？
    - 结论：树的递归定义让递归写法直接；需要时也可以用栈实现非递归算法
- type: content
  kicker: 递归统计框架 · 模板5
  title: 递归函数先写清停止条件，再决定怎样合并子问题
  blocks:
  - type: code
    text: "// 递归结构示意：具体返回类型按题目定义\nResult Solve(Node *p){\n    if(p == NULL) return baseValue;\n    Result left = Solve(p->left), right\
      \ = Solve(p->right);\n    return combine(left, right, p);\n}"
    size: 11.5
  - type: bullets
    items: &id001
    - 空树时返回什么：先定基准值。
    - 对子树递归：每次都把问题缩小一层。
    - 合并左右结果和本结点信息，回答题目要求。
    - 这是结构示意；Result、baseValue、combine 要换成题目中的具体定义。
    size: 12.5
  layout: split
  leftWidth: 7.2
  columns:
  - - type: code
      text: "// 递归结构示意：具体返回类型按题目定义\nResult Solve(Node *p){\n    if(p == NULL) return baseValue;\n    Result left = Solve(p->left), right\
        \ = Solve(p->right);\n    return combine(left, right, p);\n}"
      size: 11.5
  - - type: bullets
      items: *id001
      size: 12.5
- type: content
  kicker: 递归统计框架 · 三个实例
  title: 求高度、结点数、叶子数：三行骨架只差两处
  blocks:
  - type: code
    text: "int TreeDepth(BiTree T){                        // 求高度\n    if(T == NULL) return 0;\n    return max(TreeDepth(T->lchild),\
      \ TreeDepth(T->rchild)) + 1; }\nint CountNodes(BiTree T){                       // 求结点数\n    if(T == NULL) return 0;\n    return\
      \ CountNodes(T->lchild) + CountNodes(T->rchild) + 1; }\nint CountLeaves(BiTree T){                      // 求叶子数\n    if(T == NULL)\
      \ return 0;\n    if(T->lchild == NULL && T->rchild == NULL) return 1;   // 多一个叶子判定\n    return CountLeaves(T->lchild) + CountLeaves(T->rchild);\
      \ }\n"
    size: 12
  - type: table
    head:
    - 实例
    - 终止返回
    - 合并方式
    - 多出来的判断
    rows:
    - - 求高度
      - '0'
      - max 加 1
      - 无
    - - 求结点数
      - '0'
      - 相加加 1
      - 无
    - - 求叶子数
      - '0'
      - 相加
      - 当前结点是叶子则直接返回 1
  - type: bullets
    items:
    - 三个函数只有两处不同：基准值是什么、两个子结果怎么合并
    - 写新的树统计函数三步：先定终止值，再定合并方式，最后看要不要额外判断
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "int TreeDepth(BiTree T){                        // 求高度\n    if(T == NULL) return 0;\n    return max(TreeDepth(T->lchild),\
        \ TreeDepth(T->rchild)) + 1; }\nint CountNodes(BiTree T){                       // 求结点数\n    if(T == NULL) return 0;\n    return\
        \ CountNodes(T->lchild) + CountNodes(T->rchild) + 1; }\nint CountLeaves(BiTree T){                      // 求叶子数\n    if(T ==\
        \ NULL) return 0;\n    if(T->lchild == NULL && T->rchild == NULL) return 1;   // 多一个叶子判定\n    return CountLeaves(T->lchild)\
        \ + CountLeaves(T->rchild); }\n"
      size: 11
  - - type: table
      head:
      - 实例
      - 终止返回
      - 合并方式
      - 多出来的判断
      rows:
      - - 求高度
        - '0'
        - max 加 1
        - 无
      - - 求结点数
        - '0'
        - 相加加 1
        - 无
      - - 求叶子数
        - '0'
        - 相加
        - 当前结点是叶子则直接返回 1
    - type: bullets
      items:
      - 三个函数只有两处不同：基准值是什么、两个子结果怎么合并
      - 写新的树统计函数三步：先定终止值，再定合并方式，最后看要不要额外判断
      size: 13
- type: content
  kicker: 求高度 · 递归展开
  title: 求高度：递归如何展开，再怎样收回
  blocks:
  - type: image
    src: assets/diagrams/b4-tree7.png
    w: 6.5
    h: 2.9
    align: center
    fit: contain
  - type: bullets
    items:
    - 树形：根 1，左 2 右 3；2 的左 4 右 5；3 的左 6 右 7
    - 展开：1 调左 2 调右 3；2 再调 4、5；3 再调 6、7；4、5、6、7 再往下碰到空树返回 0
    - 收回：4 返回 max(0,0)+1=1，5 同理 1；2 返回 max(1,1)+1=2；6、7 同理 1，3 返回 2
    - 1 返回 max(2,2)+1=3，整棵树高度 3
    - 先自己在纸上画出调用框的进出顺序和每个框的返回值，再对照
- type: content
  kicker: 判完全二叉树 · 思路
  title: 层序遍历加 tag：遇过缺孩子，后面必须全是叶子
  blocks:
  - type: table
    head:
    - 遇到的情况
    - 层序中的动作
    - 后续检查
    rows:
    - - 左、右孩子都在
      - 继续入队
      - 尚未发现缺孩子
    - - 只有左孩子
      - 左孩子入队，tag置1
      - 后面不能再出现孩子
    - - 没有左孩子
      - tag置1
      - 右孩子若存在则不是完全树
    - - tag已置1后又看到孩子
      - 立即判假
      - 空位之后出现了结点
    rowH: 0.44
  - type: note
    text: 按层序扫描；tag 表示“此前已经出现过空孩子位置”。
    size: 13
- type: content
  kicker: 判完全二叉树 · 代码
  title: JudgeComplete：两个分支各管一个孩子
  blocks:
  - type: code
    text: "int JudgeComplete(BiTree T){                    // 空树算完全二叉树\n    if(T == NULL) return 1;\n    SqQueue Q; InitQueue(Q); EnQueue(Q,\
      \ T);\n    int tag = 0; BiTree p;                      // tag=1 表示已经遇过缺孩子\n    while(!IsEmpty(Q)){\n        DeQueue(Q, p);\n \
      \       if(p->lchild != NULL){ if(tag) return 0; EnQueue(Q, p->lchild); }else tag = 1;\n        if(p->rchild != NULL){ if(tag)\
      \ return 0; EnQueue(Q, p->rchild); }else tag = 1;\n    }\n    return 1;\n}\n"
    size: 12
  - type: bullets
    items:
    - 分支一：孩子非空且 tag 是 1，返回 0，缺孩子之后还有非空结点
    - 分支二：孩子为空，置 tag=1，这是全函数唯一置 tag 的地方
    - 分支三：孩子非空且 tag 是 0，正常入队
    - 有右孩子没左孩子：第二个 if 里的非空孩子撞上 tag=1，照样返回 0
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "int JudgeComplete(BiTree T){                    // 空树算完全二叉树\n    if(T == NULL) return 1;\n    SqQueue Q; InitQueue(Q);\
        \ EnQueue(Q, T);\n    int tag = 0; BiTree p;                      // tag=1 表示已经遇过缺孩子\n    while(!IsEmpty(Q)){\n        DeQueue(Q,\
        \ p);\n        if(p->lchild != NULL){ if(tag) return 0; EnQueue(Q, p->lchild); }else tag = 1;\n        if(p->rchild != NULL){\
        \ if(tag) return 0; EnQueue(Q, p->rchild); }else tag = 1;\n    }\n    return 1;\n}\n"
      size: 11
  - - type: bullets
      items:
      - 分支一：孩子非空且 tag 是 1，返回 0，缺孩子之后还有非空结点
      - 分支二：孩子为空，置 tag=1，这是全函数唯一置 tag 的地方
      - 分支三：孩子非空且 tag 是 0，正常入队
      - 有右孩子没左孩子：第二个 if 里的非空孩子撞上 tag=1，照样返回 0
      size: 13
- type: content
  kicker: 判平衡二叉树 · 思路
  title: 为什么返回高度而不用 bool：一个返回值带两种信息
  blocks:
  - type: table
    head:
    - 递归返回值
    - 终止时的含义
    - 父结点怎样合并
    rows:
    - - bool
      - 子树是否平衡
      - 左右都平衡且高度差≤1
    - - height / -1
      - 平衡时返回高度；不平衡用-1
      - -1直接向上传递；否则返回较大高度+1
    rowH: 0.48
  - type: bullets
    items:
    - 需要判断并继续算高度时，单独返回 bool 不够；用高度承载结果，-1 留作失败标记。
    size: 14
- type: content
  kicker: 判平衡二叉树 · 代码
  title: JudgeAVL：-1 短路，看到 -1 直接透传
  blocks:
  - type: code
    text: "int JudgeAVL(BiTree T){                         // 返回高度；-1 表示不平衡\n    if(T == NULL) return 0;                     // 空树高度\
      \ 0，也算平衡\n    int HL = JudgeAVL(T->lchild);\n    if(HL == -1) return -1;                     // 左子树已不平衡，短路\n    int RL = JudgeAVL(T->rchild);\n\
      \    if(RL == -1) return -1;\n    if(HL - RL < -1 || HL - RL > 1) return -1;  // 本结点不平衡\n    return max(HL, RL) + 1;         \
      \            // 平衡，往上报高度\n}\n"
    size: 12
  - type: bullets
    items:
    - 两个 if(HL == -1) return -1 是短路：子树已经不平衡，另一边不用再算
    - 若不先检查 -1，后续可能把它当作高度参与计算，导致判定错误
    - 不要写成先求高度再判差值：那是两遍递归，O(n²)
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "int JudgeAVL(BiTree T){                         // 返回高度；-1 表示不平衡\n    if(T == NULL) return 0;                     // 空树高度\
        \ 0，也算平衡\n    int HL = JudgeAVL(T->lchild);\n    if(HL == -1) return -1;                     // 左子树已不平衡，短路\n    int RL = JudgeAVL(T->rchild);\n\
        \    if(RL == -1) return -1;\n    if(HL - RL < -1 || HL - RL > 1) return -1;  // 本结点不平衡\n    return max(HL, RL) + 1;       \
        \              // 平衡，往上报高度\n}\n"
      size: 11
  - - type: bullets
      items:
      - 两个 if(HL == -1) return -1 是短路：子树已经不平衡，另一边不用再算
      - 若不先检查 -1，后续可能把它当作高度参与计算，导致判定错误
      - 不要写成先求高度再判差值：那是两遍递归，O(n²)
      size: 13
- type: content
  kicker: 求镜像树
  title: mirrorTree：三行交换加两行递归
  blocks:
  - type: code
    text: "void mirrorTree(BiTree &T){\n    if(T == NULL) return;\n    BiTNode *temp = T->rchild;\n    T->rchild = T->lchild;\n    T->lchild\
      \ = temp;\n    mirrorTree(T->lchild);\n    mirrorTree(T->rchild);\n}\n"
    size: 12
  - type: bullets
    items:
    - 每个结点做一次左右指针交换，交换完递归进两个孩子，整棵树左右翻转
    - 先交换再递归、先递归再交换结果一样：交换的是两棵子树整体，选一种写到底
    - 这题只改结点内部指针，参数写成 BiTree T 值传递也能完成；要改 T 本身指向才需要引用
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "void mirrorTree(BiTree &T){\n    if(T == NULL) return;\n    BiTNode *temp = T->rchild;\n    T->rchild = T->lchild;\n  \
        \  T->lchild = temp;\n    mirrorTree(T->lchild);\n    mirrorTree(T->rchild);\n}\n"
      size: 11
  - - type: bullets
      items:
      - 每个结点做一次左右指针交换，交换完递归进两个孩子，整棵树左右翻转
      - 先交换再递归、先递归再交换结果一样：交换的是两棵子树整体，选一种写到底
      - 这题只改结点内部指针，参数写成 BiTree T 值传递也能完成；要改 T 本身指向才需要引用
      size: 13
- type: content
  kicker: 求树的度 · 复习
  title: 求树的度：孩子兄弟递归，全局变量记最大
  blocks:
  - type: code
    text: "int degree = 0;                     // 全局变量，记树的最大度\nint Post(CSNode *p){\n    if(p == NULL) return 0;\n    Post(p->firstchild);\n\
      \    int d = 1 + Post(p->nextbro);   // 兄弟链长度就是本结点的度\n    degree = max(degree, d);\n    return d;\n}\n"
    size: 12
  - type: bullets
    items:
    - 数据结构基础阶段第8节逐行讲过，这里不重复，只做两件事
    - 归入模板5的变体：返回值是兄弟链长度，全局变量存最大值
    - degree 记录遍历中出现的最大孩子数；最长路径也要在递归中保存当前路径和最优结果
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "int degree = 0;                     // 全局变量，记树的最大度\nint Post(CSNode *p){\n    if(p == NULL) return 0;\n    Post(p->firstchild);\n\
        \    int d = 1 + Post(p->nextbro);   // 兄弟链长度就是本结点的度\n    degree = max(degree, d);\n    return d;\n}\n"
      size: 11
  - - type: bullets
