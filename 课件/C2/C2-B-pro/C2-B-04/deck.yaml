      text: "int JudgeComplete(BiTree T){\n    if(T == NULL) return 1;\n    SqQueue Q; InitQueue(Q); EnQueue(Q, T);\n    int tag = 0;\
        \ BiTree p;\n    while(!IsEmpty(Q)){ DeQueue(Q, p);\n        if(p->lchild != NULL){ if(tag) return 0; EnQueue(Q, p->lchild);\
        \ }else tag = 1;\n        if(p->rchild != NULL){ if(tag) return 0; EnQueue(Q, p->rchild); }else tag = 1; }\n    return 1; }\n\
        int JudgeAVL(BiTree T){\n    if(T == NULL) return 0;\n    int HL = JudgeAVL(T->lchild);   if(HL == -1) return -1;\n    int RL\
        \ = JudgeAVL(T->rchild);   if(RL == -1) return -1;\n    if(HL - RL < -1 || HL - RL > 1) return -1;\n    return max(HL, RL) +\
        \ 1; }\n"
      size: 11
  - - type: bullets
      items:
      - 判完全唯一置 tag 的地方：孩子为空；有右无左会被第二个分支拦下
      - 判平衡两个 if 是短路；平衡返回高度，不平衡返回 -1
      size: 13
