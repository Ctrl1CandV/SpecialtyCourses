- type: content
  badge: 正课开始
  kicker: 引题 · 从结构到应用
  title: 栈和队列的几种典型用法
  blocks:
  - type: bullets
    items:
    - 基础阶段已练过栈的 Push、Pop 和队列的 EnQueue、DeQueue；本节直接使用这些操作
