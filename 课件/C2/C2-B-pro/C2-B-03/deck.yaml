- type: content
  kicker: 应用一 · 括号匹配
  title: 一个栈：遇左括号压栈，遇右括号弹栈比对
  blocks:
  - type: code
    text: "bool BracketMatch(char str[], int n){\n    SqStack S; InitStack(S);\n    for(int i = 0; i < n; i++){\n        if(str[i]=='('\
      \ || str[i]=='[' || str[i]=='{') Push(S, str[i]);\n        else if(str[i]==')' || str[i]==']' || str[i]=='}'){   // 只拦右括号，其他字符跳过\n\
      \            if(IsEmpty(S)) return false;      // ① 右括号多了\n            char top; Pop(S, top);\n            if((top=='(' && str[i]!=')')\
      \ || (top=='[' && str[i]!=']') ||\n               (top=='{' && str[i]!='}')) return false;   // ② 类型不匹配（交叉）\n        }\n    }\n\
      \    return IsEmpty(S);      // ③ 左括号多了\n}\n"
    size: 12
  - type: bullets
    items:
    - 分支必须写 else if 只拦右括号：写 else 会把字母数字运算符当右括号
    - 写 else 时 a+(b*c) 扫到 a 就弹栈误判失配
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "bool BracketMatch(char str[], int n){\n    SqStack S; InitStack(S);\n    for(int i = 0; i < n; i++){\n        if(str[i]=='('\
        \ || str[i]=='[' || str[i]=='{') Push(S, str[i]);\n        else if(str[i]==')' || str[i]==']' || str[i]=='}'){   // 只拦右括号，其他字符跳过\n\
        \            if(IsEmpty(S)) return false;      // ① 右括号多了\n            char top; Pop(S, top);\n            if((top=='(' && str[i]!=')')\
        \ || (top=='[' && str[i]!=']') ||\n               (top=='{' && str[i]!='}')) return false;   // ② 类型不匹配（交叉）\n        }\n   \
        \ }\n    return IsEmpty(S);      // ③ 左括号多了\n}\n"
      size: 11
  - - type: bullets
      items:
      - 分支必须写 else if 只拦右括号：写 else 会把字母数字运算符当右括号
      - 写 else 时 a+(b*c) 扫到 a 就弹栈误判失配
      size: 13
- type: content
  kicker: 应用一 · 失配分析
  title: 三种失配：右多了、类型交叉、左括号多了
  blocks:
  - type: table
    head:
    - 失配情况
    - 什么时候发生
    - 例子
    rows:
    - - 右括号多了
      - 扫描中遇到右括号时栈已空
      - “())” 第二个右括号无左可配
    - - 类型交叉
      - 弹出的左括号与当前右括号不是一对
      - “[(])” 弹出“(”遇“]”失配
    - - 左括号多了
      - 全部字符扫完栈仍非空
      - “(()” 剩一个左括号没配上
  - type: bullets
    items:
    - 三种情况各自 return false，全配上且栈空才 return true；最后一句 IsEmpty(S) 专管第三种
    - 先自己判两个串：“[()]”与“[(])”只差一个字符，结果一样吗？答案在讲
- type: content
  kicker: 表达式求值 · 中缀转后缀
  title: 中缀转后缀四条规则：数输出、左括号压、右括号弹到左括号
  blocks:
  - type: table
    head:
    - 扫描到
    - 处理动作
    - 要点
    rows:
    - - 操作数
      - 直接输出到后缀串
      - 不进栈
    - - 左括号
      - 压栈
      - 等右括号来配对
    - - 右括号
      - 弹栈并输出直到左括号
      - 左括号弹出但不输出
    - - 运算符
      - 弹出栈里优先级大于等于它的，再压自己
      - 大于等于就是左结合，同级先弹左边
    rowH: 0.34
  - type: bullets
    items:
    - 同级运算符按左结合处理：弹出栈顶后再压入当前运算符。
    - 右括号遇到左括号就停；扫描结束后再弹出栈里剩下的运算符。
- type: content
  kicker: 表达式求值 · 后缀求值
  title: 后缀求值：遇数压栈、遇运算符弹两个，先弹的是右操作数
  blocks:
  - &id001
    type: code
    text: "int EvalPostfix(char postfix[]){\n    SqStack S; InitStack(S);\n    for(int i = 0; postfix[i] != '\\0'; i++){\n        char\
      \ c = postfix[i];\n        if(c >= '0' && c <= '9'){ int x = c - '0'; Push(S, x); }\n        else{\n            int b, a; Pop(S,\
      \ b); Pop(S, a);   // 先弹的是右操作数\n            if(c == '+') Push(S, a + b); else if(c == '-') Push(S, a - b);\n            else if(c\
      \ == '*') Push(S, a * b); else Push(S, a / b);\n        }\n    }\n    int result; Pop(S, result); return result;\n}\n"
    size: 12
  - &id002
    type: bullets
    items:
    - 栈后进先出：后压入的是表达式右边的操作数；减法和除法若颠倒操作数，结果会错
    - 扫完全部字符栈里只剩一个数就是结果；每个字符处理一次，时间 O(n)
  - &id003
    type: note
    text: 本例使用单个数字字符；多位数表达式需按操作数分词后再入栈。
    size: 12
  layout: split
  leftWidth: 8
  columns:
  - - *id001
  - - *id002
    - *id003
- type: content
  kicker: 表达式求值 · 动画推演
  title: 表达式 (3+4)*2：转后缀 34+2*，再求值
  blocks:
  - type: bullets
    items:
    - 扫描中缀式：输出数字；左括号压栈；右括号弹到左括号；结束时弹出剩余运算符。
    - 得到 34+2*；按后缀表达式从左到右求值，结果为 14。
    - EvalPostfix 当前按单个数字字符读数；多位数须先分词，不能直接把“12”当一个操作数。
    size: 15
- type: content
  kicker: 应用三 · 判回文
  title: 判回文：前半压栈后半比对，一个返回值表达两种结局
  blocks:
  - type: code
    text: "bool IsPalindrome(LinkList L, int n){\n    SqStack s; InitStack(s);\n    LNode *q, *p = L->next;\n    for(int i = 1; i <=\
      \ n / 2; i++){ Push(s, p); p = p->next; }   // 前半压栈\n    if(n % 2 == 1) p = p->next;                                   // 奇数长度跳过中点\n\
      \    while(p != NULL){\n        Pop(s, q);\n        if(p->data != q->data) break;\n        else p = p->next;\n    }\n    return\
      \ IsEmpty(s);                                            // 栈空则是回文\n}\n"
    size: 12
  - type: bullets
    items:
    - 失配 break 时栈里还有没弹完的元素，栈非空；全匹配弹了 n/2 次刚好栈空，一个返回值管两种结局
    - 边界在奇数长度那句：先跳过一个中点再比对；忘跳会拿中点和后半第一个元素比
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "bool IsPalindrome(LinkList L, int n){\n    SqStack s; InitStack(s);\n    LNode *q, *p = L->next;\n    for(int i = 1; i\
        \ <= n / 2; i++){ Push(s, p); p = p->next; }   // 前半压栈\n    if(n % 2 == 1) p = p->next;                                   //\
        \ 奇数长度跳过中点\n    while(p != NULL){\n        Pop(s, q);\n        if(p->data != q->data) break;\n        else p = p->next;\n  \
        \  }\n    return IsEmpty(s);                                            // 栈空则是回文\n}\n"
      size: 11
  - - type: bullets
      items:
      - 失配 break 时栈里还有没弹完的元素，栈非空；全匹配弹了 n/2 次刚好栈空，一个返回值管两种结局
      - 边界在奇数长度那句：先跳过一个中点再比对；忘跳会拿中点和后半第一个元素比
      size: 13
- type: content
  kicker: 应用四 · 双栈模拟队列
  title: 双栈模拟队列：s1 管入、s2 管出，s2 空了才倒
  blocks:
  - type: code
    text: "SqStack s1, s2;\nbool EnQueue2(int x){ return Push(s1, x); }\nbool DeQueue2(int &x){\n    if(!IsEmpty(s2)) return Pop(s2,\
      \ x);\n    while(!IsEmpty(s1)){ int t; Pop(s1, t); Push(s2, t); }   // 倒一次，顺序反一次\n    if(IsEmpty(s2)) return false;\n    return\
      \ Pop(s2, x);\n}\n"
    size: 12
  - type: bullets
    items:
    - 转入 s2 后，最早入队的元素位于栈顶，之后可按入队顺序出队
    - 只有 s2 空了才倒：s2 还有货就倒，新元素会排到旧元素前面，顺序就乱了
    - 均摊 O(1)：每个元素最多倒一次、弹一次；每次都倒退化成 O(n)
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "SqStack s1, s2;\nbool EnQueue2(int x){ return Push(s1, x); }\nbool DeQueue2(int &x){\n    if(!IsEmpty(s2)) return Pop(s2,\
        \ x);\n    while(!IsEmpty(s1)){ int t; Pop(s1, t); Push(s2, t); }   // 倒一次，顺序反一次\n    if(IsEmpty(s2)) return false;\n    return\
        \ Pop(s2, x);\n}\n"
      size: 11
  - - type: bullets
      items:
      - 转入 s2 后，最早入队的元素位于栈顶，之后可按入队顺序出队
      - 只有 s2 空了才倒：s2 还有货就倒，新元素会排到旧元素前面，顺序就乱了
      - 均摊 O(1)：每个元素最多倒一次、弹一次；每次都倒退化成 O(n)
      size: 13
- type: content
  kicker: 串匹配 · 思想
  title: 从 BF 到 KMP：主串指针 i 永不回溯
  blocks:
  - type: table
    head:
    - 对比项
    - BF
    - KMP
    rows:
    - - 失配后谁动
      - 主串 i 回到本轮起点加一
      - 主串 i 不动，模式串 j 退到 next[j]
    - - 依据
      - 换个起点逐个重试，怕漏
      - 已匹配的前缀与主串对齐，不用再比
    - - 最坏时间
      - O(nm)
      - O(n+m)
    rowH: 0.35
  - type: bullets
    items:
    - KMP 复用已经匹配过的信息：主串指针 i 不回退，模式串按 next 调整位置。
    - next 的定义和手算见 C2-A 第6节，本节只看它怎样减少重复比较。
  - type: note
    text: 本节不重讲 next 表手算。
