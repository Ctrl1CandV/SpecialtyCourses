- type: content
  kicker: 参考答案 · 跟练题二
  title: 跟练题二参考答案：后缀求值与表达式求值
  blocks:
  - type: code
    text: "int EvalPostfix(char postfix[]){\n    SqStack S; InitStack(S);\n    for(int i=0; postfix[i]!='\\0'; i++){\n        char c=postfix[i];\n\
      \        if(c>='0' && c<='9') Push(S, c-'0');\n        else{\n            int b,a; Pop(S,b); Pop(S,a);  // 先弹的是右操作数\n        \
      \    if(c=='+') Push(S,a+b); else if(c=='-') Push(S,a-b);\n            else if(c=='*') Push(S,a*b); else Push(S,a/b);\n      \
      \  }\n    }\n    int result; Pop(S,result); return result;\n}"
    size: 11
  - type: bullets
    items:
    - 后缀式34+2*：先算3+4=7，再算7×2=14。
    - 本函数按单个数字字符求值；多位数要先切分成 token。
    size: 15
