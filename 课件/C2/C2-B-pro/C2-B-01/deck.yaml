- type: content
  kicker: 倒数第k · 方法二
  title: 辅助栈：全部压栈再弹 k 次，两法对比
  blocks:
  - type: code
    text: "int findK(LinkList &L, int k){\n    SqStack S; InitStack(S);\n    LNode *p = L->next;\n    while(p != NULL){ Push(S,\
      \ p); p = p->next; }   // 全部进栈\n    int i = 0;\n    while(!IsEmpty(S) && i < k){ Pop(S, p); i++; } // 弹 k 次\n    if(i\
      \ == k){ printf(\"%d\", p->data); return 1; }\n    else return 0;\n}\n"
    size: 12
