- type: content
  badge: 真题·2021
  kicker: 条件删除 · 模板4
  title: 条件删除：pre 跟着 p 走，删完 p 从 pre 后面重新取
  blocks:
  - type: code
    text: "void DeleteIf(LinkList &L, int x){          // 删除所有大于 x 的结点\n    LNode *pre = L, *p = L->next, *temp;\n    while(p\
      \ != NULL){\n        if(p->data > x){\n            temp = p; pre->next = p->next;  // 先摘链\n            free(temp);\n\
      \            p = pre->next;                  // pre 不动，p 重新取\n        }else{ pre = p; p = p->next; }     // 不删才一起走\n\
      \    }\n}\n"
    size: 12
  - type: bullets
    items: &id001
    - 单链表没有前驱指针，删 p 必须记住前驱 pre；摘链顺序是先改 pre 的 next，再 free
    - 删完 pre 不动，p 从 pre 的 next 重新取：下一个待检查的结点紧跟在 pre 后面
    - 删掉后还写 pre 等于 p，就跳过了下一个待检查的结点
  layout: split
  leftWidth: 7.25
  columnLabels:
  - 代码
  - 读代码时留意
  columns:
  - - type: code
      text: "void DeleteIf(LinkList &L, int x){          // 删除所有大于 x 的结点\n    LNode *pre = L, *p = L->next, *temp;\n    while(p\
        \ != NULL){\n        if(p->data > x){\n            temp = p; pre->next = p->next;  // 先摘链\n            free(temp);\n\
        \            p = pre->next;                  // pre 不动，p 重新取\n        }else{ pre = p; p = p->next; }     // 不删才一起走\n\
