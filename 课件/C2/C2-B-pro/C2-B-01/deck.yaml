- type: content
  badge: 真题·2025
  kicker: 倒数第k · 方法一
  title: 快慢指针：q 先走 k 步，再两个人一起走
  blocks:
  - type: code
    text: "int findK(LinkList &L, int k){\n    if(k <= 0) return 0;\n    LNode *p = L, *q = L;\n    while(k != 0 && q != NULL){\
      \ q = q->next; k--; }   // q 先走 k 步\n    if(q == NULL) return 0;                            // k 超过表长\n    while(q !=\
      \ NULL){ q = q->next; p = p->next; }      // 两个一起走\n    printf(\"%d\", p->data);\n    return 1;\n}\n"
    size: 12
  - type: bullets
    items:
    - 思想：q 先走 k 步，然后 p 与 q 同步走，q 到表尾时 p 恰好落后 k 个结点
    - p 与 q 都从头结点 L 出发：头结点算一个位置正好抵消，p 指的才是倒数第 k 个数据结点
    - 一趟 O(n)、空间 O(1)；k 超过表长时 q 先变成 NULL，返回 0
  layout: split
  leftWidth: 7.25
  columnLabels:
  - 代码
  - 读代码时留意
  columns:
  - - type: code
      text: "int findK(LinkList &L, int k){\n    if(k <= 0) return 0;\n    LNode *p = L, *q = L;\n    while(k != 0 && q !=\
        \ NULL){ q = q->next; k--; }   // q 先走 k 步\n    if(q == NULL) return 0;                            // k 超过表长\n   \
        \ while(q != NULL){ q = q->next; p = p->next; }      // 两个一起走\n    printf(\"%d\", p->data);\n    return 1;\n}\n"
      size: 12
  - - type: bullets
