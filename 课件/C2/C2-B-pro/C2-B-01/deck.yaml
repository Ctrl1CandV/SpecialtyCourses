- type: content
  badge: 课段导学
  kicker: 课段导学 · 怎么听
  title: 读指针代码，先认清入口、当前结点和边界
  blocks:
  - type: bullets
    size: 16
    items:
    - 本节使用带头结点的单链表：L 保留表头，L->next 才是第一个数据结点。
    - p 常指向当前正在处理的结点；pre 留在它前面；q 可以暂存还要继续走的后继。
    - 普通单链表走到 NULL 结束，循环单链表走回 L 结束。代码里的终止条件要和结构对应。
    - 写完后，从头结点顺着 next 走一遍，检查结果链是否完整。
- type: content
  badge: 正课开始
  kicker: 方法论
  title: 改链前，先确认后面还要用哪个地址
  blocks:
  - type: bullets
    size: 16
    items:
    - 逆置时，头插会覆盖当前结点的 next；所以先把原后继保存在 p，再改连接。
    - 删除时，保留前驱 pre；当前结点摘掉后，从 pre->next 取下一个待检查结点。
    - 双链表交换时，先把两端接好，再改 p、q 之间的连接；否则会丢掉旧地址。
- type: content
  kicker: 原地逆置 · 模板1
  title: 原地逆置：断成空表，逐个头插回去
  blocks:
  - type: code
    text: "void InvertedList(LinkList &L){\n    if(L == NULL || L->next == NULL) return;\n    LNode *p = L->next, *temp;\n\
      \    L->next = NULL;                       // 先断成空表\n    while(p != NULL){\n        temp = p;                      \
      \   // 摘下当前结点\n        p = p->next;                      // 先存后继，否则下一步找不到\n        temp->next = L->next; L->next = temp;\
      \   // 两句头插\n    }\n}\n"
    size: 12
  - type: bullets
    items:
    - 思想：把头结点后的链整个断开，成空表加一串待处理结点，逐个用头插法插回，头插天然反序
    - 循环里四行有次序：先摘下、再存后继、最后两句头插
    - 空间 O(1)：没有新开结点；时间 O(n)：每个结点摘下重接一次
  layout: split
  leftWidth: 7.25
  columnLabels:
  - 代码
  - 读代码时留意
  columns:
