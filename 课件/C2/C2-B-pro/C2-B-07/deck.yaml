          - "为什么第一次访问就是答案：BFS 逐层扩散，每扩一层距离加 1，第一次碰到的就是最近；时间 O(nm)"

  - type: content
    kicker: 多源 BFS · 骨架
    title: 入队初始化是唯一的改动点，主循环与普通 BFS 完全一样
    blocks:
      - type: code
        text: |
          void PixelDist(int g[][MaxM], int dist[][MaxM], int n, int m){
              SqQueue Q; InitQueue(Q);
              for(int i = 0; i < n; i++)
                  for(int j = 0; j < m; j++){                 // ①与普通 BFS 唯一的差别
                      if(g[i][j] == 1){ dist[i][j] = 0; EnQueue(Q, i * m + j); }
                      else dist[i][j] = -1;                   // -1 兼作 visited
                  }
              while(!IsEmpty(Q)){
                  int cur; DeQueue(Q, cur);  int x = cur / m, y = cur % m;   // 编号还原坐标
                  for(int d = 0; d < 4; d++){ /* 越界跳过；dist 为 -1 才置值入队 */ }
              }
          }
        size: 12

