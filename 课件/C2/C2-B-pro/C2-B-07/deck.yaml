  - type: content
    kicker: 最小生成树 · Prim
    title: 最小生成树是权值和最小的生成树，Prim 从一个顶点往外长
    blocks:
      - type: image
        src: assets/diagrams/b7-graph.png
        w: 4.4
        h: 2.41
        align: center
        fit: contain
      - type: bullets
        items:
          - "生成树：n-1 条边连通全部顶点且不成环；最小生成树是权值和最小的那棵"
          - "Prim 从一个顶点开始维护当前生成树；每轮选一条连接树内外且权值最小的边，把对应顶点加入树中"

  - type: content
    kicker: Prim · 三个数组
    title: 先查 weight 字段，再分清 include、dist、parent 三个数组
    blocks:
      - type: code
        text: |
          typedef struct ArcNode{
              int adjvex;                     // 该弧指向的顶点下标
              int weight;                     // 边权：带权图必带，数据结构基础阶段第9节已放出
              struct ArcNode *nextarc;
          }ArcNode;
        size: 12
      - type: bullets
        items:
          - "include[i]：顶点 i 是否已在生成树里；dist[i]：i 到生成树的最小边权——是到树，不是到起点 0"
          - "parent[i]：选中 i 时走的那条边从哪个顶点来；建好后沿 parent 回溯可还原全部树边"
          - "读代码前先核对结构定义：Prim 通过 p->weight 读取边权，因此 ArcNode 需要 weight 字段"

  - type: content
    kicker: Prim · 主循环
    title: 主循环两拍：选最小的 u 并入树，再用 u 的边刷新邻居的 dist
    blocks:
      - type: code
        text: |
          for(int i = 0; i < G.vexnum; i++){ include[i] = false; dist[i] = INF; parent[i] = -1; }   // 不能写 dist[] = {INF}
          dist[0] = 0;                                                    // 从顶点 0 开始长
          for(int k = 0; k < G.vexnum; k++){
              int u = -1, minDist = INF;
              for(int i = 0; i < G.vexnum; i++)                       // ①选出树外 dist 最小的 u
                  if(!include[i] && dist[i] < minDist){ minDist = dist[i]; u = i; }
              if(u == -1) break;                                      // 图不连通，停
              include[u] = true;                                      // ②u 并入树
              for(ArcNode *p = G.vertices[u].firstarc; p != NULL; p = p->nextarc)   // ③刷新邻居
                  if(!include[p->adjvex] && p->weight < dist[p->adjvex])
                      { dist[p->adjvex] = p->weight; parent[p->adjvex] = u; }
          }
        size: 12

