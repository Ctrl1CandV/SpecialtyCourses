  - type: content
    kicker: 最小生成树 · Kruskal
    title: "Kruskal：边按权从小到大扫，不成环就加，并查集管判环"
    blocks:
      - type: code
        text: |
          int Find(int parent[], int x){                  // 沿父结点往上找到根
              while(parent[x] != x) x = parent[x];
              return x;
          }
      - type: bullets
        items:
          - "按边权从小到大检查；若两个端点属于不同连通分量，就加入该边；选满 n-1 条边后结束"
          - "与 Prim 对着记：Prim 盯顶点往外长，Kruskal 盯边往里收；这张图扫边 2、3、5、6，和也是 16"
          - "判环靠并查集：Find 两端点的根，根相同再加就成环；基础阶段第9节留的问题在这里兑现"

  - type: content
    kicker: Kruskal · 骨架填空
    title: 骨架三行：Find 找根、根不同就合并、加够 n-1 条边停
    blocks:
      - type: code
        text: |
          void Kruskal(ALGraph G, Edge E[], int m, int vexnum){   // E 已按 w 升序
              int parent[MaxVertexNum];
              for(int i = 0; i < vexnum; i++) parent[i] = i;      // ①初始化并查集：每个顶点自成一根
              int cnt = 0;
              for(int i = 0; i < m && cnt < vexnum - 1; i++){     // ②双条件循环：边没扫完且没加够
                  int a = Find(parent, E[i].u), b = Find(parent, E[i].v);
                  if(a != b){ parent[a] = b; cnt++; }             // ③根不同才合并、计数
              }
          }
        size: 12
      - type: bullets
        items:
          - "三处填空对应三行注释：每个顶点自成一棵树；扫边循环 m 与 n-1 双条件；根不同才合并并计数"

  - type: content
    kicker: 最短路径 · Dijkstra
    title: "Dijkstra：dist、path、S 三个数组，每轮选最小的并入"
    blocks:
      - type: code
        text: |
          void Dijkstra(MGraph G, int v0, int dist[], int path[], bool S[]){
              for(int i = 0; i < G.vexnum; i++){
                  dist[i] = G.edge[v0][i]; S[i] = false;      // 初始：直接连通的距离
                  path[i] = (dist[i] < INF) ? v0 : -1;        // 初始前驱
              }
              dist[v0] = 0; S[v0] = true;
              for(int k = 1; k < G.vexnum; k++){
                  int u = 选 dist 最小且 S[u] 为 false 的顶点;
                  S[u] = true;                                // u 的最短路已确定
                  for(int i = 0; i < G.vexnum; i++)
                      if(!S[i] && dist[u] + G.edge[u][i] < dist[i]) { dist[i] = dist[u] + G.edge[u][i]; path[i] = u; }
              }
          }
        size: 12

  - type: content
    kicker: 最短路径 · 对照
