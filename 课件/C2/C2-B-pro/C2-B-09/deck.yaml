- type: content
  kicker: 折半插入
  title: 折半插入：比较与移动要分开算
  blocks:
  - type: code
    text: "void BinarySort(SqList &L){\n    for(int i = 2; i <= L.length; i++){\n        if(L.data[i] >= L.data[i-1]) continue;    \
      \  // 已就位，跳过\n        L.data[0] = L.data[i];  int low = 1, high = i-1;\n        while(low <= high){ int mid = (low+high)/2;\n\
      \            if(L.data[0] < L.data[mid]) high = mid-1; else low = mid+1; }\n        for(int j = i; j > low; j--) L.data[j] = L.data[j-1];\n\
      \        L.data[low] = L.data[0];\n    }\n}\n"
    size: 12
  - type: bullets
    items:
    - 改的只是'找插入位置'这一步：前面有序区用折半定位，每趟比较次数降到 O(logn)
    - 关键认识：比较次数降到 O(nlogn)，但移动次数仍是 O(n²)（找到位置后照样统一后移），总体时间复杂度不变
  - type: note
    text: '''比较与移动分开算''是选择题常考点：折半插入没有降低时间复杂度，只减少了比较次数；开头 continue 是已就位优化'
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "void BinarySort(SqList &L){\n    for(int i = 2; i <= L.length; i++){\n        if(L.data[i] >= L.data[i-1]) continue;  \
