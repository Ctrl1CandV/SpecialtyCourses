- type: content
  kicker: 快速排序 · Partition
  title: 快排 Partition：哨兵存枢轴，挖坑填数
  blocks:
  - type: code
    text: "int Partition(SqList &L, int low, int high){\n    L.data[0] = L.data[low];                  // 哨兵存枢轴，low 位置成坑\n    while(low\
      \ < high){\n        while(L.data[high] >= L.data[0] && low < high) high--;\n        L.data[low] = L.data[high];           // 填左坑，high\
      \ 变新坑\n        while(L.data[low] <= L.data[0] && low < high) low++;\n        L.data[high] = L.data[low];           // 填右坑，low\
      \ 变新坑\n    }\n    L.data[low] = L.data[0];  return low;     // 枢轴归位\n}\n"
    size: 12
  - type: bullets
    items:
    - 挖坑填数：枢轴挖出来存进哨兵，从右找第一个比枢轴小的填进坑，再从左找第一个比枢轴大的填过去，相遇时枢轴放进最后的坑
    - 内外两层循环条件都要带 low<high，否则越界；QuickSort 递归是 (low,p-1) 与 (p+1,high)，枢轴已归位不能再包含
  - type: note
    text: 平均 O(nlogn)，最坏（已有序）O(n²)，空间 O(logn) 递归栈；不稳定
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "int Partition(SqList &L, int low, int high){\n    L.data[0] = L.data[low];                  // 哨兵存枢轴，low 位置成坑\n    while(low\
        \ < high){\n        while(L.data[high] >= L.data[0] && low < high) high--;\n        L.data[low] = L.data[high];           //\
        \ 填左坑，high 变新坑\n        while(L.data[low] <= L.data[0] && low < high) low++;\n        L.data[high] = L.data[low];          \
        \ // 填右坑，low 变新坑\n    }\n    L.data[low] = L.data[0];  return low;     // 枢轴归位\n}\n"
      size: 11
  - - type: bullets
      items:
      - 挖坑填数：枢轴挖出来存进哨兵，从右找第一个比枢轴小的填进坑，再从左找第一个比枢轴大的填过去，相遇时枢轴放进最后的坑
      - 内外两层循环条件都要带 low<high，否则越界；QuickSort 递归是 (low,p-1) 与 (p+1,high)，枢轴已归位不能再包含
      size: 13
    - type: note
      text: 平均 O(nlogn)，最坏（已有序）O(n²)，空间 O(logn) 递归栈；不稳定
      size: 12
