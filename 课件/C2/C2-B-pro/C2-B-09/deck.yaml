- type: content
  kicker: 冒泡排序
  title: 冒泡：提前退出优化与下标说明
  blocks:
  - type: code
    text: "void BubbleSort(SqList &L){              // 材料按 0 起写：数据存 data[0..length-1]\n    for(int i = 0; i < L.length - 1; i++){\n\
      \        bool swapped = false;\n        for(int j = 0; j < L.length - 1 - i; j++)\n            if(L.data[j] > L.data[j+1]){\n\
      \                int tmp = L.data[j];\n                L.data[j] = L.data[j+1];  L.data[j+1] = tmp;\n                swapped =\
      \ true;\n            }\n        if(!swapped) break;              // 本趟没交换说明已有序\n    }\n}\n"
    size: 12
  - type: bullets
    items:
    - 每趟把最大的往后冒：相邻比较、逆序就交换，一趟下来最大的沉到末尾；swapped 标志让最好情况（已有序）降到 O(n)
    - 下标说明：这段材料按 0 起写、数据存 data[0..length-1]，与本章其他用哨兵的排序（1 起）起点不同，是伪代码的写法差异，不影响算法——做题看清题目给的起点
  - type: note
    text: 时间最坏与平均 O(n²)、最好 O(n)；空间 O(1)；稳定（相等不交换，相对次序不变）
