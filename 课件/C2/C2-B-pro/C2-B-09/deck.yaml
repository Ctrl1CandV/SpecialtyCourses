- type: content
  kicker: 平均值划分 · 勘误A2
  title: 平均值划分：保证每次递归都缩小
  blocks:
  - &id001
    type: code
    text: "void QuickSortAvg(int R[], int low, int high){\n    if(low >= high) return;\n    int sum=0; for(int i=low;i<=high;i++) sum+=R[i];\n\
      \    int avg=sum/(high-low+1), i=low, j=high;\n    while(i <= j){\n        while(i<=j && R[i]<=avg) i++;\n        while(i<=j &&\
      \ R[j]>avg) j--;\n        if(i<j){ int t=R[i]; R[i]=R[j]; R[j]=t; i++; j--; }\n    }\n    if(low<=j && j<high) QuickSortAvg(R,low,j);\
      \ // j<high 保证左区间缩小\n    if(low<i && i<=high) QuickSortAvg(R,i,high); // low<i 保证右区间缩小\n}"
    size: 11
  - &id002
    type: bullets
    items:
    - R={5,5,5}、avg=5：i 越过 high，j 停在 high。
    - 不加保护时，左区间 [0,2] 原样递归，调用不结束。
    - j<high、low<i 只放行真正缩小的子区间。
    size: 13
  layout: split
  leftWidth: 8
  columns:
  - - *id001
  - - *id002
