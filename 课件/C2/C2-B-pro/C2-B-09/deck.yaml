        \            if(L.data[0] < L.data[mid]) high = mid-1; else low = mid+1; }\n        for(int j = i; j > low; j--) L.data[j] =\
        \ L.data[j-1];\n        L.data[low] = L.data[0];\n    }\n}\n"
      size: 11
  - - type: bullets
      items:
