- type: content
  kicker: 排序 · 下标基准
  title: 两套下标基准与哨兵位的三个作用
  blocks:
  - type: bullets
    items:
    - 排序章节把 data[0] 留作哨兵，数据存在 data[1..length]，本节第一次在算法中实际用到哨兵下标
    - 哨兵的三个作用：①直接插入里存待插元素，腾出一个变量位；②免掉循环的越界判断（j 减到 0 时 data[j]>data[0] 必然为假）；③快排里存枢轴，避免反复读写 low 位置
    - 哨兵只在需要它的算法里用；冒泡不需要哨兵，材料里它从 0 开始是另一种写法，第8页专门说明
  - type: note
    text: 两套下标基准：线性表与查找章节 data[0] 起存、位序 1 起；排序章节 data[0] 是哨兵、数据 1 起。做题先看清题目用哪套
- type: content
  kicker: 直接插入
  title: 直接插入：j 减到 0 为什么一定跳出
  blocks:
  - type: code
    text: "void InsertSort(SqList &L){                   // 数据存 L.data[1..length]\n    for(int i = 2; i <= L.length; i++){\n       \
      \ L.data[0] = L.data[i];                // 哨兵存待插入元素\n        int j = i - 1;\n        while(L.data[j] > L.data[0]){         //\
      \ j=0 时必然跳出\n            L.data[j + 1] = L.data[j];  j--;\n        }\n        L.data[j + 1] = L.data[0];\n    }\n}\n"
    size: 12
  - type: bullets
    items:
    - 外层 i 从 2 开始：data[1] 一个元素天然有序，从第 2 个起逐个插入前面的有序区
    - 关键设问：j 减到 0 时循环为什么一定跳出？data[0] 存的就是待插元素自己，data[0]>data[0] 为假——这就是哨兵免掉越界判断的原理
  - type: note
    text: 时间 O(n²)，最好情况（已有序）O(n)：每趟只比较一次、不移动；稳定
  layout: split
  leftWidth: 8.0
  columns:
