      - O(n²) / O(n²)
      - 是
    - - 折半插入
      - O(n²) / O(n²)，比较次数更少
      - 是
    - - 二路插入
      - O(n²) / O(n²)，移动较少
      - 是
    - - 希尔
      - 依赖增量序列
      - 否
    - - 冒泡
      - O(n²) / O(n²)，有序时可到 O(n)
      - 是
    - - 快速排序
      - O(nlogn) / O(n²)
      - 否
    rowH: 0.4
