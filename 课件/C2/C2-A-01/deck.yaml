meta:
  id: C2-A-01
  title: 答题格式与复杂度分析
  stage: A基础
  instructor: 牙膏学长
  duration: 35min

slides:
  # ---------- 封面与课段导学 ----------
  - type: cover
    kicker: 重邮802 数据结构代码课程
    title: 数据结构基础阶段
    subtitle: 第1节 答题格式与复杂度分析
    meta: 阶段：基础 ｜ 主讲：牙膏学长 ｜ 预计35分钟 ｜ 资料答疑：伴梦研途QQ群

  - type: content
    kicker: 课段导学 · 本课段管什么
    title: 802 里哪些题要写代码
    blocks:
      - type: table
        head: [题型, 分值, 要你做什么]
        colW: [2.2, 1.8, 7.5]
        rows:
          - [算法分析题, 3题 30分, 写算法思想、写代码、给复杂度]
          - [程序阅读题, 约20分, 看懂代码，挖空补全或给片段排序]
          - [填空题, 约30分, 一部分空要照着代码的执行过程手算]
          - [综合应用题, 约70分, 手算大题，但读懂算法过程要靠代码]
      - type: text
        text: "这个阶段九节课、约六小时，学完你要能在白纸上默写出九个结构的类型定义和基本操作"
      - type: note
        text: "基础阶段只管定义和基本操作；每个结构的经典算法放到强化阶段"

  - type: content
    kicker: 课段导学 · 本课段目录
    title: 九节课怎么排
    blocks:
      - type: table
        head: [节次, 内容, 时长]
        colW: [2.0, 7.3, 2.2]
        rows:
          - [第1节（本节）, 答题格式 ＋ 复杂度分析, 35min]
          - [第2—4节, 线性表：顺序表、单链表、双链表、循环链表、静态链表, 各40min]
          - [第5节, 栈与队列：顺序栈、循环队列、判满三策略, 40min]
          - [第6节, 串、数组与广义表：以手算为主，代码只有串的匹配一小段, 35min]
          - [第7—8节, 树与二叉树：存储与遍历、线索树、树与森林, 45＋40min]
          - [第9节, 图：存储与遍历, 45min]
      - type: note
        text: "每节课只讲一个结构，讲到你能合上资料默写出来；链表、树、图占的课时最多，因为真题里它们考得最重"

  - type: content
    kicker: 课段导学 · 选课建议
    title: 这个课段适合谁
    blocks:
      - type: table
        head: [你的情况, 建议]
        colW: [6.0, 5.5]
        rows:
          - [没学过数据结构，或者是跨考的, 从第1节开始，一节不落跟到底]
          - [学过，但定义和基本操作忘得差不多了, 翻目录，挑生疏的节补]
          - [合上书能默写各结构的定义和操作, 跳过本阶段，直接进强化阶段]
      - type: note
        text: "这是代码课，不细讲理论，默认你已经有专业课基础；也默认你会用指针、结构体、动态内存和引用传参，这几样在C语言强化阶段讲过"

  - type: content
    kicker: 课段导学 · 学习要求
    title: 这个阶段怎么学
    blocks:
      - type: bullets
        items:
          - "跟练：视频里写一行定义，你跟着写一行，别只用眼睛看"
          - "手撕：课后合上资料，凭记忆把这节的类型定义和基本操作写一遍"
          - "默写：每节就是一个默写单元，考场上要能直接把模板写出来"
          - "课后题：每节一道跟练题加一道模仿题，参考答案在PPT最后两页"
      - type: text
        text: "每节课后任务页会写清这节的默写要求，比如“合上资料能写出顺序表的插入和删除”，你拿这句话当验收标准"

  # ---------- 正课：802 代码题怎么答 ----------
  - type: content
    badge: 正课开始
    kicker: 802 代码题怎么写
    title: 考场上写的是伪代码，不是能编译的程序
    blocks:
      - type: code
        text: |
          int countNegative(int a[], int n){
              int cnt = 0;
              for(int i = 0; i < n; i++)
                  if(a[i] < 0) cnt++;
              return cnt;
          }
      - type: bullets
        items:
          - "不用写 #include 和 main，直接写函数就行，这就是伪代码"
          - "802 看重思路不抠语法：思路对、边界全，语法上有小错照样给分"
          - "但结构体定义、函数签名、边界判断这三样必须写完整，它们是评分点"

  - type: content
    kicker: 答题格式
    title: 一道算法题的答案分三件
    blocks:
      - type: bullets
        items:
          - "第一件，算法思想：用文字说清你打算怎么做，分几步、每步干什么"
          - "第二件，代码：伪代码就行，结构体定义和边界判断要完整"
          - "第三件，复杂度：时间和空间各给一个结论，再各配一句理由"
      - type: note
        text: "三件缺一件就扣一件的分；很多人只写代码，思想和复杂度空着，白白丢分"

  - type: content
    kicker: 答题格式 · 样例
    title: 三件套写出来长这样
    blocks:
      - type: code
        text: |
          // 思想：先假定第一个元素最大，从第二个起逐个比，遇到更大的就换掉
          int findMax(int a[], int n){
              int max = a[0];
              for(int i = 1; i < n; i++)
                  if(a[i] > max) max = a[i];
              return max;
          }
          // 复杂度：时间 O(n) 每个元素比一次；空间 O(1) 只用了 max 一个变量
      - type: note
        text: "写代码的时候顺手把思想和复杂度补上，三件就齐了；真实的题比这难，但骨架就是这个三段式"

  # ---------- 正课：复杂度分析 ----------
  - type: content
    kicker: 复杂度分析 · 时间
    title: 时间复杂度就是数基本操作跑了几次
    blocks:
      - type: code
        text: |
          for(int i = 0; i < n; i++)
              sum = sum + a[i];      // 基本操作：这句跑了几次？
      - type: bullets
        items:
          - "基本操作通常是循环最里面那句，数它执行了多少次"
          - "数出来只保留最高阶，系数和低阶项都去掉，写成大 O"
          - "这个例子最里面那句跑了 n 次，所以是 O(n)"
          - "循环变量翻着倍走（每圈乘2到超过 n），圈数是 logn，就是 O(logn)"
      - type: note
        text: "别一看到循环就套公式，先看最里面那句到底跟着谁变"

  - type: content
    kicker: 复杂度分析 · 时间
    title: 内层次数跟着外层变，要先求和
    blocks:
      - type: code
        text: |
          for(int i = 0; i < n; i++)
              for(int j = i; j < n; j++)
                  x++;               // 数它跑了几次
      - type: bullets
        items:
          - "i=0 时内层跑 n 次，i=1 时跑 n-1 次，一直到 i=n-1 时只跑 1 次"
          - "总次数是 n+(n-1)+…+1，等差求和等于 n(n+1)/2"
          - "去掉系数和低阶，最高阶是 n²，所以是 O(n²)"
      - type: note
        text: "看到两层循环别急着写 O(n²)：要是内层只跑固定几次，结果可能是 O(n)"

  - type: content
    kicker: 复杂度分析 · 递归式
    title: 递归式怎么算：画递归树逐层累加（拿纸跟着画）
    blocks:
      - type: text
        text: "以 T(n)=2T(n/2)+O(n) 为例：处理规模 n 的问题，先做 O(n) 的活，再拆成两个 n/2 的子问题"
      - type: bullets
        items:
          - "① 第0层：1个问题，规模 n，这层做的活是 O(n)"
          - "② 第1层：拆成2个，每个规模 n/2，合起来 2 乘 O(n/2)，还是 O(n)"
          - "③ 每往下一层，问题数翻倍、规模减半，一乘一除抵消，每层都是 O(n)"
          - "④ 规模减半到1要 logn 次，所以共 logn 层；每层 O(n)，合计 O(nlogn)"
      - type: note
        text: "记住这个算法：每层代价乘层数；归并排序、快速排序的复杂度就是这么来的"

  - type: content
    kicker: 复杂度分析 · 空间
    title: 空间复杂度数额外开的辅助空间
    blocks:
      - type: bullets
        items:
          - "额外空间来自两处：你开的辅助数组，和递归调用压的栈"
          - "开了大小 n 的数组就是 O(n)；只用固定几个变量就是 O(1)"
          - "原地算法的 O(1) 是不额外占、不随 n 长，不是一点内存都不用"
          - "递归的空间最容易漏：没开数组也要算栈深度，树的递归遍历是 O(树高)"
      - type: note
        text: "答题时时间和空间都要给，各配一句理由"

  # ---------- 小结与课后任务 ----------
  - type: content
    kicker: 本节小结
    title: 小结
    blocks:
      - type: bullets
        items:
          - "802 写伪代码：省头文件和 main，但结构体定义、函数签名、边界判断要完整"
          - "答案分三件：思想、代码、复杂度，缺一件扣一件的分"
          - "时间复杂度数基本操作的次数，内层跟着外层变就先求和；递归式画递归树逐层累加"
          - "空间复杂度数额外的辅助数组和递归栈深度，递归的空间不是 O(1)"
      - type: note
        text: "这几样是后面每道算法题都要用的；至于每个结构具体怎么定义、书写上有哪些约定，讲到那个结构时再说"

  - type: content
    kicker: 课后任务
    title: 1道跟练 ＋ 1道模仿
    blocks:
      - type: bullets
        items:
          - "**跟练题**：用三件套格式作答——写一个函数统计数组里能被3整除的元素个数，给出思想、代码、复杂度"
          - "**模仿题**：算下面三段程序的时间复杂度，每段写一句理由（题集绪论章）"
      - type: code
        text: |
          for(i=0;i<n;i++) for(j=i;j<n;j++) x++;    // (1)
          int i=0,x=1; while(x<n){ x*=2; i++; }      // (2)
          void f(int n){ if(n<=1) return;            // (3)
              for(i=1;i<=3;i++) f(n/3); }
      - type: note
        text: "默写要求：合上资料能说清三件套是哪三件、复杂度怎么数；参考答案在本PPT最后两页，课后自行对照"

  # ---------- 参考答案（末尾两页，一题一页） ----------
  - type: content
    kicker: 参考答案 · 跟练题
    title: 跟练题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          // 思想：遍历数组，每个元素对3取余，余数为0就把计数加一
          int count3(int a[], int n){
              int cnt = 0;
              for(int i = 0; i < n; i++)
                  if(a[i] % 3 == 0) cnt++;
              return cnt;
          }
      - type: bullets
        items:
          - "复杂度：时间 O(n) 每个元素取余比较一次；空间 O(1) 只用了 cnt 一个变量"
          - "三件齐了才满分：只写代码、不写思想和复杂度，要扣分"

  - type: content
    kicker: 参考答案 · 模仿题
    title: 模仿题参考答案（自行对照）
    blocks:
      - type: bullets
        items:
          - "(1) O(n²)：内层 j 从 i 到 n-1 共 n-i 次，总和 n+(n-1)+…+1 = n(n+1)/2"
          - "(2) O(logn)：x 每次翻倍，到 x≥n 停，循环 logn 次"
          - "(3) O(n)：T(n)=3T(n/3)+O(1)，每层问题数乘3、规模除以3，共 logn 层，末层 n 个"
      - type: note
        text: "三段分别练嵌套求和、翻倍取对数、递归树累加；理由都要写，只给结论会扣分"
