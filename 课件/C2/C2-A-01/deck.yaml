meta:
  id: C2-A-01
  title: 伪代码约定与复杂度分析
  stage: A基础
  instructor: 牙膏学长
  duration: 35min

slides:
  # ---------- 封面与课段导学 ----------
  - type: cover
    kicker: 重邮802 数据结构代码课程
    title: 数据结构基础阶段
    subtitle: 第1节 伪代码约定与复杂度分析
    meta: 阶段：基础 ｜ 主讲：牙膏学长 ｜ 预计35分钟 ｜ 资料答疑：伴梦研途QQ群

  - type: content
    kicker: 课段导学 · 本课段的定位
    title: 802 代码题的知识地基
    blocks:
      - type: table
        head: [题型, 分值, 与本阶段的关系]
        colW: [2.2, 1.8, 7.5]
        rows:
          - [算法分析题, 3题 30分, 写得出结构定义、基本操作与算法]
          - [程序阅读题, 约20分, 看得懂代码，会挖空补全与片段排序]
          - [填空题, 约30分, 部分空要跟着代码过程手算]
          - [综合应用题, 约70分, 理解算法过程依赖代码思维]
      - type: text
        text: "本阶段目标（9节 · 约6小时）：学完能在白纸上默写九个结构单元的全部类型定义与基本操作"
      - type: note
        text: "基础阶段只讲定义与基本操作；每个结构的经典算法放到强化阶段展开"

  - type: content
    kicker: 课段导学 · 本课段目录
    title: 数据结构基础阶段目录
    blocks:
      - type: table
        head: [节次, 内容, 时长]
        colW: [2.0, 7.3, 2.2]
        rows:
          - [第1节（本节）, 六条伪代码约定 ＋ 复杂度分析, 35min]
          - [第2—4节, 线性表：顺序表、单链表、双链表、循环链表、静态链表, 各40min]
          - [第5节, 栈与队列：顺序栈、循环队列、判满三策略, 40min]
          - [第6节, 串、数组与广义表, 35min]
          - [第7—8节, 树与二叉树：存储与遍历、线索树、树与森林, 45＋40min]
          - [第9节, 图：存储与遍历, 45min]
      - type: note
        text: "每节立一个默写单元；学完本阶段进入数据结构强化阶段，讲经典算法"

  - type: content
    kicker: 课段导学 · 选课建议
    title: 按自己的情况选择
    blocks:
      - type: table
        head: [你的情况, 建议]
        colW: [6.0, 5.5]
        rows:
          - [没学过数据结构，或跨考过来, 从第1节开始完整学习]
          - [学过数据结构，定义与基本操作已生疏, 按目录选听生疏的节]
          - [能默写各结构的定义与基本操作, 跳过本阶段，直接进入强化阶段]
      - type: note
        text: "本阶段默认你已经会用指针、结构体、动态内存和引用传参；这些在C语言强化阶段讲过，没学的先补那段"

  - type: content
    kicker: 课段导学 · 学习要求
    title: 四条学习要求与默写标准
    blocks:
      - type: bullets
        items:
          - "**跟练**：视频里写一行定义，你就跟着写一行"
          - "**手撕**：课后合上资料，凭记忆把类型定义与基本操作写出来"
          - "**默写**：每节一个默写单元，考场上直接默出模板"
          - "**课后题**：每节1道跟练题＋1道模仿题，参考答案在PPT末尾两页"
      - type: text
        text: "每节课后任务页会写清默写要求，措辞是“合上资料能写出……”；写不出来就回看该节"

  # ---------- 正课：六条约定 ----------
  - type: content
    badge: 正课开始
    kicker: 全局约定
    title: 六条伪代码约定：各自解决什么问题
    blocks:
      - type: table
        head: [约定, 它解决什么问题]
        colW: [4.2, 7.3]
        rows:
          - [1 两套下标基准, 线性表与查找从0起、排序从1起，避免自相矛盾]
          - [2 链表默认带头结点, 让第一个结点的插删与其他位置统一]
          - [3 top=-1、循环队列牺牲一单元, 定死栈与队列的判空判满式子]
          - [4 栈队元素类型按需替换, 工具栈里可以放结点指针或顶点编号]
          - ["5 ={0}是简写、{INF}必须写循环", 避免只初始化第一个元素的错误]
          - [6 参数用引用 &, 让函数改得动调用处的数据]
      - type: note
        text: "这六条出自代码总结开篇，后面每一节的代码都依赖它们，尤其依赖第1条"

  - type: content
    kicker: 约定1 · 两套下标基准
    title: 同一份数据，两种存放（拿纸跟着画）
    blocks:
      - type: bullets
        items:
          - "① 左边画 data[0] 到 data[4]，依次存 10、20、30、40、50，这是线性表与查找章节的存法，下标从 0 起"
          - "② 右边画 data[0] 空着当哨兵，data[1] 到 data[5] 存同样这五个数，这是排序章节的存法，下标从 1 起"
          - "③ 线性表这套：第 i 个元素是 data[i-1]；排序那套：第 i 个元素就是 data[i]"
          - "④ 排序为什么从 1 起：堆排序要求 2i 是左孩子，从 0 起这个关系就变成 2i+1，教材统一从 1"
      - type: text
        text: "答题开头写一句“本题下标从 0 起”或“从 1 起”，阅卷不挑刺；同一道题里前后矛盾才扣分"

  - type: content
    kicker: 约定2—4
    title: 带头结点、top=-1与牺牲一单元、元素类型按需替换
    blocks:
      - type: bullets
        items:
          - "约定2 链表默认带头结点：L 指向头结点，L->next 才是第一个数据结点；头结点让空表与非空表、第一个位置与其他位置用同一套式子（它的价值在第3节展开）"
          - "约定3 顺序栈 top 初值 -1，入栈写 S.data[++S.top]；循环队列牺牲一个单元判满，条件是 (rear+1)%MaxSize == front"
          - "约定4 栈与队列当工具用时元素类型按需替换：材料里写成 int，树和图的算法里放的是结点指针或顶点编号"
      - type: note
        text: "考场上直接写 SqStack S; Push(S, p); 不必重新定义，但答题要说明一句“栈中存放结点指针”"

  - type: content
    kicker: 约定5—6
    title: 数组初始化的简写与陷阱、引用 & 的含义
    blocks:
      - type: code
        text: |
          int a[n] = {0};              // 伪代码简写：整个数组清零（802允许）
          int dist[n] = {INF};         // 错！只有 dist[0]=INF，其余全是0
          for(int i = 0; i < n; i++)   // 赋非0初值必须写循环
              dist[i] = INF;
      - type: bullets
        items:
          - "约定5：={0}是清零简写；但 {INF} 只初始化第一个元素，赋非0初值必须写循环"
          - "约定6：参数写引用 & 表示传入传出，等价于C的二级指针，让函数改得动外面的数据"
      - type: note
        text: "引用 & 在C语言强化阶段讲过，这里只说清它的作用"

  # ---------- 正课：复杂度分析 ----------
  - type: content
    kicker: 复杂度分析 · 时间
    title: 时间复杂度怎么数
    blocks:
      - type: code
        text: |
          for(int i = 0; i < n; i++)
              for(int j = i; j < n; j++)
                  x++;                 // 基本操作，数它的执行次数
      - type: bullets
        items:
          - "数基本操作的执行次数，只保留最高阶，去掉系数"
          - "内层依赖外层时先求和：i 固定内层跑 n-i 次，总和 n+(n-1)+…+1 = n(n+1)/2"
          - "n(n+1)/2 去掉系数与低阶项，就是 O(n²)"
      - type: note
        text: "三层循环不一定是 O(n³)：若最内层只执行常数次，总体可能仍是 O(n)"

  - type: content
    kicker: 复杂度分析 · 递归式
    title: 递归式怎么展开：逐层累加
    blocks:
      - type: text
        text: "以 T(n) = 2T(n/2) + O(n) 为例，一层一层把代价加起来"
      - type: bullets
        items:
          - "第0层：1个问题，规模 n，代价 O(n)"
          - "第1层：2个问题，规模各 n/2，代价合计还是 O(n)"
          - "每往下一层，问题数翻倍、规模减半，每层代价都是 O(n)"
          - "规模减半到1，共 logn 层；每层 O(n)，合计 O(nlogn)"
      - type: note
        text: "这个展开方式，强化阶段讲归并排序与快速排序时各用一次"

  - type: content
    kicker: 复杂度分析 · 空间
    title: 空间复杂度：算额外开的辅助空间
    blocks:
      - type: bullets
        items:
          - "空间复杂度数的是额外开的辅助空间：辅助数组的大小，加递归栈的最大深度"
          - "原地算法的 O(1)：只用了固定几个变量，不随 n 增长，不是指一点都不占内存"
          - "递归的空间不是 O(1)：即使没开数组，栈深度也要算，树的递归遍历是 O(树高)"
          - "单支树退化成一条链，递归遍历的空间最坏是 O(n)"
      - type: note
        text: "答题时时间与空间都要给，各配一句理由"

  - type: content
    kicker: 答题格式
    title: 答题三件套：思想、代码、复杂度
    blocks:
      - type: code
        text: |
          // ① 思想：把头结点后每个结点摘下，用头插法接回，走一遍即逆置
          void Reverse(LinkList &L){              // ② 代码
              LNode *p = L->next, *r;
              L->next = NULL;
              while(p != NULL){
                  r = p->next;                  // 先存后继
                  p->next = L->next;  L->next = p;   // 头插到 L 之后
                  p = r;
              }
          }
      - type: note
        text: "③ 复杂度：时间 O(n)，空间 O(1) 只用两个指针；单链表下一节正式讲，这里只看三件套格式"

  # ---------- 小结与课后任务 ----------
  - type: content
    kicker: 本节小结
    title: 小结
    blocks:
      - type: bullets
        items:
          - "六条约定：两套下标基准、带头结点、top=-1与牺牲一单元、元素类型按需替换、={0}简写而{INF}要循环、引用 &"
          - "这六条在后面每节课的代码里都会出现，尤其是第1条两套下标基准"
          - "复杂度答题：一句结论加一句理由，时间与空间都要给，只写结论不给理由会扣分"
      - type: note
        text: "递归的空间要算栈深度，不是 O(1)"

  - type: content
    kicker: 课后任务
    title: 1道跟练 ＋ 1道模仿
    blocks:
      - type: bullets
        items:
          - "**跟练题**：把六条约定各写一句话解释它解决什么问题；再给约定5写一个错误示例与正确写法"
          - "**模仿题**：算下面三段程序的时间复杂度，每段写一句理由（题集绪论章）"
      - type: code
        text: |
          for(i=0;i<n;i++) for(j=i;j<n;j++) x++;    // (1)
          int i=0,x=1; while(x<n){ x*=2; i++; }      // (2)
          void f(int n){ if(n<=1) return;            // (3)
              for(i=1;i<=3;i++) f(n/3); }
      - type: note
        text: "默写要求：合上资料能说清六条约定的作用，能按三件套格式作答；参考答案在本PPT最后两页，课后自行对照"

  # ---------- 参考答案（末尾两页，一题一页） ----------
  - type: content
    kicker: 参考答案 · 跟练题
    title: 跟练题参考答案（自行对照）
    blocks:
      - type: bullets
        items:
          - "约定1 两套下标基准：固定线性表与排序各自的下标写法，同题不混用"
          - "约定2 带头结点：第一个结点的插删与其他位置统一，空表判定也统一"
          - "约定3 top=-1与牺牲一单元：把栈与循环队列的判空判满式子定死"
          - "约定4 元素类型按需替换：工具栈队里可放结点指针或顶点编号"
          - "约定5 错误 int a[n]={INF} 只初始化 a[0]；正确写法 for 循环逐个赋 INF"
          - "约定6 引用 &：让函数改得动调用处的变量"

  - type: content
    kicker: 参考答案 · 模仿题
    title: 模仿题参考答案（自行对照）
    blocks:
      - type: bullets
        items:
          - "(1) 嵌套循环，内层 j 从 i 到 n-1 共 n-i 次；总和 n+(n-1)+…+1 = n(n+1)/2，即 **O(n²)**"
          - "(2) x 从1每次翻倍，到 x≥n 停，循环次数是 logn 级，即 **O(logn)**"
          - "(3) T(n)=3T(n/3)+O(1)；每层问题数乘3、规模除以3，共 logn 层，末层 n 个，即 **O(n)**"
      - type: note
        text: "三段分别练嵌套循环求和、循环变量翻倍、递归式展开；理由都要写，只给结论会扣分"
