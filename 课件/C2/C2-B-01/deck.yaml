          - "听课要求：每个算法至少拿纸推演一遍，不能只看不画"

  - type: content
    badge: 正课开始
    kicker: 方法论
    title: 改指针的三条规矩
    blocks:
      - type: bullets
        items:
          - "先接后断：新结点的指针先接好，再改前驱的指针；反过来写，后面的链就找不到了"
          - "画图再写：改之前与改之后各画一张图，照着图写代码，不对着屏幕空想"
          - "查孤立结点：改完问一句，有没有哪个结点没有人指向它了；有，就是漏了一句赋值"
          - "这一节四个算法都在改指针，每讲一个都回来对照这三条"

  - type: content
    kicker: 原地逆置 · 模板1
    title: 原地逆置：断成空表，逐个头插回去
    blocks:
      - type: code
        text: |
          void InvertedList(LinkList &L){
              if(L == NULL || L->next == NULL) return;
              LNode *p = L->next, *temp;
              L->next = NULL;                       // 先断成空表
              while(p != NULL){
                  temp = p;                         // 摘下当前结点
                  p = p->next;                      // 先存后继，否则下一步找不到
                  temp->next = L->next; L->next = temp;   // 两句头插
              }
          }
      - type: bullets
        items:
          - "思想：把头结点后的链整个断开，成空表加一串待处理结点，逐个用头插法插回，头插天然反序"
          - "循环里四行有次序：先摘下、再存后继、最后两句头插"
          - "空间 O(1)：没有新开结点；时间 O(n)：每个结点摘下重接一次"

  - type: content
    kicker: 逆置推演
    title: 逆置 A、B、C：四步看成头插怎么把链反过来（拿纸跟着画）
    blocks:
      - type: diagram
        diagram: linkedlist
        nodes: [A, B, C]
        head: true
        headLabel: "L"
        w: 8
        h: 1.3
        align: center
      - type: bullets
        items:
          - "初始 L 指向 A 指向 B 指向 C；第0步断链，L 之后置空，p 指着 A"
          - "第1次头插：摘下 A 接到 L 后，链成 L 指向 A，p 移向 B"
          - "第2次头插：摘下 B 接到 L 后，链成 L 指向 B 指向 A，p 移向 C"
          - "第3次头插：摘下 C，链成 L 指向 C 指向 B 指向 A，p 为空，循环停"
          - "先想清楚：循环里为什么先写 p 指向下一个再头插？"

  - type: content
    kicker: 原地逆置 · 循环版
    title: 循环单链表逆置：终止条件换 p 不等于 L，结尾接环
    blocks:
      - type: code
        text: |
          void InvertedList(LinkList &L){
              if(L == NULL || L->next == NULL) return;
              LNode *p = L->next, *temp, *rear = p;   // rear 记下原首元
              L->next = NULL;
              while(p != L){                          // 与普通版差①：终止条件
                  temp = p; p = p->next;
                  temp->next = L->next; L->next = temp;
              }
              rear->next = L;                         // 差②：把环接回去
          }
      - type: diagram
        diagram: linkedlist
        nodes: [A, B, C]
        head: true
        headLabel: "L"
        circular: true
        w: 8
        h: 1.1
        align: center
      - type: bullets
        items:
          - "与普通版只差两处：while 终止条件是 p 不等于 L，结束后 rear 指向 L 把环接回"
          - "rear 在断链前记下原首元结点，逆置后它变成尾结点，尾结点的 next 必须指回头结点"
          - "易错：照抄 p 不等于 NULL 会死循环，循环链表里根本没有 NULL"

  - type: content
    badge: 真题·2025
    kicker: 倒数第k · 方法一
    title: 快慢指针：q 先走 k 步，再两个人一起走
    blocks:
      - type: code
        text: |
          int findK(LinkList &L, int k){
              LNode *p = L, *q = L;
              while(k != 0 && q != NULL){ q = q->next; k--; }   // q 先走 k 步
              if(q == NULL) return 0;                            // k 超过表长
              while(q != NULL){ q = q->next; p = p->next; }      // 两个一起走
              printf("%d", p->data);
              return 1;
          }
      - type: bullets
        items:
          - "思想：q 先走 k 步，然后 p 与 q 同步走，q 到表尾时 p 恰好落后 k 个结点"
          - "p 与 q 都从头结点 L 出发：头结点算一个位置正好抵消，p 指的才是倒数第 k 个数据结点"
          - "一趟 O(n)、空间 O(1)；k 超过表长时 q 先变成 NULL，返回 0"

  - type: content
    kicker: 倒数第k · 方法二
    title: 辅助栈：全部压栈再弹 k 次，两法对比
    blocks:
      - type: code
        text: |
          int findK(LinkList &L, int k){
              SqStack S; InitStack(S);
              LNode *p = L->next;
              while(p != NULL){ Push(S, p); p = p->next; }   // 全部进栈
              int i = 0;
              while(!IsEmpty(S) && i < k){ Pop(S, p); i++; } // 弹 k 次
              if(i == k){ printf("%d", p->data); return 1; }
              else return 0;
          }
      - type: table
        head: [方法, 时间, 空间, 什么时候用]
        rows:
          - [快慢指针, O(n), O(1), 只要倒数第 k 个]
          - [辅助栈, O(n), O(n), 倒数第 k 到倒数第 1 全输出这类变体]

  - type: content
    badge: 真题·2021
    kicker: 条件删除 · 模板4
    title: 条件删除：pre 跟着 p 走，删完 p 从 pre 后面重新取
    blocks:
      - type: code
        text: |
          void DeleteIf(LinkList &L, int x){          // 删除所有大于 x 的结点
              LNode *pre = L, *p = L->next, *temp;
              while(p != NULL){
                  if(p->data > x){
                      temp = p; pre->next = p->next;  // 先摘链
                      free(temp);
                      p = pre->next;                  // pre 不动，p 重新取
                  }else{ pre = p; p = p->next; }     // 不删才一起走
              }
          }
      - type: bullets
        items:
          - "单链表没有前驱指针，删 p 必须记住前驱 pre；摘链顺序是先改 pre 的 next，再 free"
          - "删完 pre 不动，p 从 pre 的 next 重新取：下一个待检查的结点紧跟在 pre 后面"
          - "删掉后还写 pre 等于 p，就跳过了下一个待检查的结点"
          - "先自己判断：删掉一个结点之后，pre 该不该跟着动？下一页画图对答案"

  - type: content
    kicker: 条件删除推演
    title: 删 3、9、5、12、7 里大于 8 的结点：看 pre 与 p 的位置（拿纸跟着画）
    blocks:
      - type: diagram
        diagram: linkedlist
        nodes: ["3", "9", "5", "12", "7"]
        head: true
        headLabel: "L"
        w: 10
        h: 1.3
        align: center
      - type: bullets
        items:
          - "初始 pre 指头结点 L，p 指 3；3 不大于 8，两个一起后移"
          - "9 大于 8：pre 的 next 跨过 9 接到 5，free 掉 9，pre 不动、p 重新指 5，关键帧"
          - "5 不大于 8：两个一起后移；12 大于 8：同样删除，pre 仍不动、p 重新指 7"
          - "7 不大于 8：一起后移，p 为空停；结果是 L 指向 3 指向 5 指向 7"
          - "对照你的判断：删除后 pre 不动，p 从 pre 后面重新取"

  - type: content
    kicker: 交换相邻 · 双链表
    title: 交换相邻两个结点：六条赋值，⑤⑥必须最后
    blocks:
      - type: code
        text: |
          void exchange(DNode *p, DNode *q){      // 前提：q 紧跟 p，两端都有邻居
              p->prior->next = q;      // ① 先接外部
              q->next->prior = p;      // ②
              p->next = q->next;       // ③ 再改自身
              q->prior = p->prior;     // ④
              p->prior = q;            // ⑤ 最后互指
              q->next = p;             // ⑥
          }
      - type: bullets
        items:
          - "次序原则：先用旧指针把外部接好，最后才改 p 与 q 互指"
          - "⑤⑥一执行，p 的 prior 与 q 的 next 旧值就没了，①②再也写不出来"
          - "跟双链表插入的先接后断是同一条道理，还是三条规矩的第一条"
          - "前提：q 紧跟 p，且 p 有前驱、q 有后继，带头结点的双链表天然满足"

  - type: content
    kicker: 模板卡
    title: 本节四张模板卡
    blocks:
      - type: table
        head: [模板, 适用场景, 骨架, 复杂度]
        rows:
          - [模板1 头插法, 逆置、建表、归并成递减, 摘下、存后继、两句头插, O(n) 与 O(1)]
          - [模板2 快慢指针, 倒数第 k、找中点, q 先走 k 步再同步走, O(n) 与 O(1)]
          - [模板4 条件删除, 按条件删一批结点, pre 跟随，删完 p 重新取, O(n) 与 O(1)]
          - [模板14 辅助栈逆序, 倒数第 k 及输出变体, 全部压栈再弹 k 次, O(n) 与 O(n)]
      - type: note
        text: "考过哪里：模板1——2023循环段倒置、2022多项式分解、2021比x小者递减排列；模板2——2025年、408统考2019年"

  - type: content
    kicker: 小结与课后任务
    title: 四个算法一张表，两道课后题
    blocks:
      - type: table
        head: [算法, 关键动作, 最容易错的]
        rows:
          - [原地逆置, 断成空表、逐个头插, 忘了先存后继]
          - [循环逆置, 终止条件 p 不等于 L、rear 接环, 照抄 p 不等于 NULL 死循环]
          - [倒数第k, q 先走 k 步再同步, 起点不是 L 会差一位]
          - [条件删除, pre 跟随、删完 p 重取, 删完 pre 错动跳结点]
          - [交换相邻, 六条赋值、⑤⑥最后, ⑤⑥提前旧值丢失]
      - type: bullets
        items:
          - "**跟练题**：默写原地逆置（普通版）与快慢指针求倒数第 k"
          - "**变式题**：题集勾画 2算17（就地逆置）、2算6（倒数第 k）、2算12（删除区间内结点，条件删除同族）"
      - type: note
        text: "参考答案在 PPT 最后两页，课后自行对照"

  - type: content
    kicker: 参考答案 · 跟练题
    title: 跟练题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          void InvertedList(LinkList &L){
              LNode *p = L->next, *temp;  L->next = NULL;
              while(p != NULL){ temp = p;  p = p->next;
                  temp->next = L->next;  L->next = temp; }
          }
          int findK(LinkList &L, int k){
              LNode *p = L, *q = L;
              while(k != 0 && q != NULL){ q = q->next; k--; }
              if(q == NULL) return 0;
              while(q != NULL){ q = q->next; p = p->next; }
              printf("%d", p->data);  return 1;
          }
      - type: bullets
        items:
          - "逆置关键：先断成空表、先存后继再头插；空间 O(1)、时间 O(n)"
          - "快慢指针关键：p、q 都从头结点 L 出发；一趟 O(n)"

  - type: content
    kicker: 参考答案 · 变式题
    title: 变式题参考答案（自行对照）
    blocks:
      - type: bullets
        items:
          - "2算17 就地逆置：与跟练一同一算法，见前一页"
          - "2算6 倒数第 k：与跟练二同法，注意 p、q 都从头结点出发"
          - "2算12 删除区间内结点：条件删除同族，把判断改为 data 大于 mink 且小于 maxk"
      - type: code
        text: |
          void DeleteRange(LinkList &L, int mink, int maxk){
              LNode *pre = L, *p = L->next, *temp;
              while(p != NULL){
                  if(p->data > mink && p->data < maxk){
                      temp = p;  pre->next = p->next;  free(temp);
                      p = pre->next;
                  }else{ pre = p;  p = p->next; }
              }
          }
