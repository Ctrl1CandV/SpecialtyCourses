meta:
  id: C1-B-01
  title: 地址与指针入门
  stage: B强化
  instructor: 牙膏学长
  duration: 40min

slides:
  - type: cover
    kicker: 重邮802 数据结构代码课程
    title: C语言强化阶段
    subtitle: 第1节 地址与指针入门
    meta: 阶段：强化 ｜ 主讲：牙膏学长 ｜ 预计40分钟 ｜ 资料答疑：伴梦研途QQ群

  - type: content
    badge: 课段导学
    kicker: 课段导学 · 位置
    title: 指针是802代码的地基
    blocks:
      - type: table
        head: [802题型, 指针的角色]
        rows:
          - [程序阅读题约20分, 补空常考p = p->next这类指针移动]
          - [算法分析题3题30分, 链表、树、图的模板全由指针写成]
      - type: bullets
        items:
          - 基础阶段给了你零件，强化阶段教你看懂**内存里发生了什么**
          - 数据结构课的链表、树、图代码默认你会本阶段内容，不再回头补

  - type: content
    badge: 课段导学
    kicker: 课段导学 · 目录
    title: 强化阶段六节课
    blocks:
      - type: table
        head: [节次, 主题, 学完你能做什么]
        rows:
          - [第1节, 地址与指针入门, 看懂地址与指针，会画内存图]
          - [第2节, 指针运算与数组, 明白数组下标的本质，会用指针遍历]
          - [第3节, 结构体与typedef, 会定义结构体，看懂->与typedef]
          - [第4节, 动态内存, 会用malloc造内存、用free还内存]
          - [第5节, 引用与参数传递, 看懂伪代码里函数参数上的&]
          - [第6节, 递归与综合实战, 手写顺序表与单链表，为数据结构课铺路]

  - type: content
    badge: 课段导学
    kicker: 课段导学 · 适合人群
    title: 谁适合从这里开始
    blocks:
      - type: table
        head: [你的情况, 建议]
        rows:
          - [跟完了C语言基础阶段, 直接开始本节]
          - [学过C语言但生疏, 从本节开始，遇到卡壳回看基础阶段对应节]
          - [完全零基础, 先学完C语言基础阶段再回来]
      - type: note
        text: 课段之间可独立观看；回看指引格式：C语言基础阶段·第几节

  - type: content
    badge: 课段导学
    kicker: 课段导学 · 学习要求
    title: 这个课段怎么学
    blocks:
      - type: bullets
        items:
          - 每节课后手画一遍本节的内存图，比只看视频有效
          - 代码要求能**合上资料默写**，802是纸笔考试，看懂不等于写得出
          - 跟练题必须自己先做再看答案；本阶段的题开始要求写在纸上

  - type: content
    kicker: 引题
    title: 基础阶段留下的第一个为什么
    blocks:
      - type: code
        text: |
          scanf("%d", &score);   // 这个&，为什么非写不可？
      - type: bullets
        items:
          - 基础阶段你照抄了这个写法，当时说好这个阶段讲原因，现在兑现
          - 答案指向一个词：**地址**——scanf得知道数据该放进哪一格内存
          - 本节目标：搞懂地址与指针，会画内存图；这个工具拿到手，基础阶段的问题就能一个个解开

  - type: content
    kicker: 地址登场
    title: 地址：内存格子的编号，%p把它打印出来
    blocks:
      - type: code
        text: |
          int x = 10;
          printf("%p", &x);     // %p专门打印地址
      - type: bullets
        items:
          - 内存是一长排带编号的格子，变量住进去，编号就是**地址**
          - "&放在变量前，意思是取这个变量的地址，读作取地址"
          - int占4格、char占1格、double占8格，门牌号用第一格的编号

  - type: content
    kicker: 钩子兑现
    title: scanf的&：把门牌号交出去，数据才放得进去
    blocks:
      - type: code
        text: |
          scanf("%d", &score);  // 把score的地址交给scanf
          printf("%d", score);  // 读出来就行，printf不用&
      - type: bullets
        items:
          - scanf的工作是把数据放进格子，没有门牌号，它拿着数据找不到地方
          - printf只是把格子里的东西读出来看一眼，所以不用写&
          - 谁要**走进你的格子**，谁就需要门牌号；只远观的不用

  - type: content
    kicker: 指针登场
    title: 指针：专门存地址的变量
    blocks:
      - type: code
        text: |
          int x = 10;
          int *p = &x;          // p里存的是x的地址，读作：p指向x
      - type: bullets
        items:
          - "int *p：声明一个指针，它**只存地址**，存的是int变量的地址"
          - p里装的不是10，是x住哪；想看10，要用下一页的工具
          - 画内存图的习惯从本节开始：格子写名字、编号、值，指针画箭头

  - type: content
    kicker: 取值的另一条路
    title: "*p：顺着地址找到格子里的东西"
    blocks:
      - type: code
        text: |
          printf("%d", *p);     // 顺着p存的地址取值：10
          *p = 20;              // x也变成20：改的是同一格内存
      - type: bullets
        items:
          - "*读作取值：顺着地址找到那个格子，拿里面的东西；&与*互逆"
          - x和*p不是两个变量，是同一格内存的两个名字
          - 两个指针指向同一个变量时，谁改都一起变——这叫**别名**

  - type: content
    kicker: 动画演示 · 内存图推演
    title: 四步推演：声明指针并顺着它改值（本页逐条动画出现）
    blocks:
      - type: bullets
        items:
          - ① 画格子x：值10，门牌号随手写如1000（不写程序骨架，只画图）
          - ② 画格子p：里面放x的门牌号1000，箭头从p指向x，这就是p指向x
          - ③ 写 *p：顺着箭头看过去，x那格里是10，所以*p是10
          - ④ 写 *p = 20：顺着箭头把格子里的10改成20，x也是20，同一格内存（*p改的是x那格，p自己的格子没动）

  - type: content
    kicker: 指针的规矩
    title: 指针有类型，p自己也有地址
    blocks:
      - type: bullets
        items:
          - "int *只存int的地址，char *只存char的地址：类型告诉编译器，指向的盒子多大"
          - p自己也是变量，也住格子：改*p改的是x那格，改p改的是它自己存的编号
          - 野指针一句话：没初始化的指针不许用*，要么指向真实变量，要么先赋NULL

  - type: content
    kicker: 方法固化
    title: 读指针代码的笨办法，但是好用
    blocks:
      - type: bullets
        items:
          - 见到&就念"取地址"，见到*就念"取值"，见到指针移动就想象箭头挪一格
          - 三个动作翻译下来，再绕的代码也能拆成一步步的格子操作
          - 程序阅读题里的指针挖空，就用这个法子一格一格走
      - type: note
        text: 遇到读不顺的代码，先画内存图再读，比盯着一行字硬想快得多

  - type: content
    kicker: 本节小结
    title: 这节就三件事
    blocks:
      - type: bullets
        items:
          - 地址是内存格子的编号，&取地址，*顺着地址取值，两者互逆
          - scanf要写&：它得拿着门牌号才能把数据放对地方
          - 指针是存地址的变量；*p和x是同一格内存的两个名字
      - type: note
        text: 下一节：指针运算与数组，把数组和指针放到一起看

  - type: content
    kicker: 课后任务
    title: 1道跟练 ＋ 1道模仿
    blocks:
      - type: bullets
        items:
          - "**跟练题**：声明int x=10和指向它的指针p，用*p把x改成25并打印，画出每一步的内存图"
          - "**模仿题**：声明int x=10、int y=20、int *p=&x，用一句p=&y让p改指向y，打印*p"
          - 要求：两道题先写在纸上再上机验证；合上资料能默写 int *p = &x; 和 *p = 25;
      - type: note
        text: 参考答案在本PPT最后两页，课后自行对照

  - type: content
    kicker: 参考答案 · 跟练题
    title: 跟练题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          // 用*p把x改成25
          int main(){
              int x = 10;
              int *p = &x;
              *p = 25;
              printf("%d\n", x);   // 25
              return 0;
          }
      - type: bullets
        items:
          - 内存图：格子x（10→25）、格子p存x的地址、箭头p→x
          - "*p = 25改的是x那一格，p自己的格子纹丝不动"
          - 推演口诀：先找p里的门牌号，再顺门牌号找格子，最后在格子里改值

  - type: content
    kicker: 参考答案 · 模仿题
    title: 模仿题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          // p改指向y
          int main(){
              int x = 10, y = 20;
              int *p = &x;
              p = &y;
              printf("%d\n", *p);  // 20
              return 0;
          }
      - type: bullets
        items:
          - p = &y只改p自己格子里的编号，x和y的值全程不动
          - 常见错法：把p = &y写成*p = &y，这是把地址往x那格里塞，类型都对不上
          - 代码省略#include <stdio.h>
