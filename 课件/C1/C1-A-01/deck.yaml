meta:
  id: C1-A-01
  title: 初识C程序
  stage: A基础
  instructor: 牙膏学长
  duration: 35min

slides:
  # ---------- 课段导学（约5分钟） ----------
  - type: cover
    kicker: 重邮802 数据结构代码课程
    title: C语言基础阶段
    subtitle: 第1节 初识C程序
    meta: 阶段：基础 ｜ 主讲：牙膏学长 ｜ 预计35分钟 ｜ 资料答疑：伴梦研途QQ群

  - type: content
    kicker: 课段导学 · 本课段的定位
    title: 802 代码题的地基
    blocks:
      - type: table
        head: [题型, 分值, 用到的C语言基础]
        rows:
          - [程序阅读题, 约20分, 看懂语法、循环、判断]
          - [算法分析题, 3题 30分, 写得出伪代码]
      - type: text
        text: 本阶段目标（5节 · 约3小时）：**读懂**最简单的C程序，**写出**顺序结构的伪代码
      - type: note
        text: 指针内容在C语言强化阶段展开；本阶段不要求看懂指针

  - type: content
    kicker: 课段导学 · 本课段目录
    title: C语言基础阶段目录
    blocks:
      - type: table
        head: [节次, 内容, 时长]
        rows:
          - [第1节（本节）, 程序骨架：main、printf、#define, 35min]
          - [第2节, 数据类型、变量、scanf/printf, 35min]
          - [第3节, 运算符：算术、关系、逻辑、%取模, 30min]
          - [第4节, 分支（if/switch）与循环（while/for）, 40min]
          - [第5节, 函数、数组、字符数组, 40min]
      - type: note
        text: 每节一个新概念；学完本阶段，进入指针与结构体强化阶段

  - type: content
    kicker: 课段导学 · 选课建议
    title: 按自己的情况选择
    blocks:
      - type: table
        head: [你的情况, 建议]
        rows:
          - [没写过代码 / 跨考, 从第1节开始完整学习]
          - [学过C，大部分遗忘, 按目录选听生疏的节]
          - [能独立写简单程序（if、循环、数组）, 跳过本阶段，直接进入强化阶段]

  - type: content
    kicker: 课段导学 · 学习要求
    title: 四条学习要求
    blocks:
      - type: bullets
        items:
          - "**跟练**：视频里写一行，跟着写一行"
          - "**手撕**：课后合上笔记，凭记忆把代码写出来"
          - "**默写**：基础模板代码要能默写"
          - "**课后题**：每节1道跟练题＋1道模仿题，答案在讲稿附录"
      - type: text
        text: 本阶段只讲**怎么用**；涉及地址、指针的原理，统一放到强化阶段讲解

  - type: transition
    kicker: 课段导学结束
    title: 第1节 初识C程序
    subtitle: 学完能看懂一个完整程序的每一行

  # ---------- 正课（约30分钟） ----------
  - type: content
    badge: 正课开始
    kicker: 先看一个东西
    title: 这两行字，是怎么跑到屏幕上的？
    blocks:
      - type: code
        text: |
          printf("你好，重邮802！\n");
          printf("我是牙膏学长\n");
      - type: text
        text: 你看得懂它在干嘛，但**说不清原理**？——很正常。这节课之后，你不但看得懂，还能自己写出来

  - type: content
    kicker: 思想先行
    title: 程序是什么？
    blocks:
      - type: table
        head: [环节, 说明]
        rows:
          - [输入, 数据（后面章节再说）]
          - [处理, 按指令一步步算（就是代码）]
          - [输出, 把结果告诉人（printf打印）]
      - type: text
        text: 计算机只认0和1，**C语言是翻译官**：你写的C代码，经编译器翻译成0和1，电脑才执行
      - type: note
        text: 802考的是伪代码——现在先学完整程序，骨架熟练后再谈简化

  - type: content
    kicker: 思想先行 · 程序怎么跑起来
    title: 从源代码到屏幕上的字
    blocks:
      - type: table
        head: [阶段, 产物, 发生了什么]
        rows:
          - [写代码, hello.c（源代码）, 你用C语言写下想法]
          - [编译, hello.exe（可执行文件）, 编译器把C代码翻译成机器能执行的指令]
          - [运行, 屏幕输出, 电脑执行可执行文件，打出两行字]
      - type: bullets
        items:
          - "**改了源代码必须重新编译**，exe不会自己跟着变"
          - 编译器很严格：**少一个分号，它就拒绝编译**，一行都跑不起来

  - type: content
    kicker: 第一个完整程序
    title: C程序的骨架：五部分
    blocks:
      - type: code
        text: |
          // 头文件：引入别人写好的工具（printf在这里）
          #include <stdio.h>
          // 宏定义：给常量起名字
          #define MaxSize 1000
          // 主函数：程序从这里开始执行
          int main(){
              // 函数体：一条条指令
              printf("你好，重邮802！\n");
              // return 0：告诉系统"正常结束"
              return 0;
          }
      - type: bullets
        items:
          - "**头文件**：借工具，printf住在stdio.h这个仓库里，不借进来编译器不认识它"
          - "**宏定义**：给1000起名叫MaxSize，后面写MaxSize就是1000"
          - "**主函数**：程序的大门，不管代码多少，都从main开始执行"
          - "**函数体**：花括号里的指令，从上往下一条条执行"
          - '**return 0**：跟系统报信，0表示正常结束'

  - type: content
    kicker: 四个关键点
    title: 初学者最容易栽的四个坑
    blocks:
      - type: table
        head: [关键点, 它是干嘛的, 弄错会怎样]
        rows:
          - [main是入口, 程序永远从main开始执行, 读陌生代码先找main，找不到就读不懂]
          - [printf原样输出, 双引号里写啥屏幕出啥, 写错别字、写空格都照打不误，电脑不纠错]
          - ["\\n是一个整体", 换行，只让光标跳到下一行, 写成/n或漏写，所有输出挤成一行]
          - [分号收尾, 每条语句末尾必须有分号, 漏一个就编译报错，报错位置还常不在漏的那行]

  - type: content
    kicker: 两个小工具
    title: "#define 与注释"
    blocks:
      - type: code
        text: |
          #define MaxSize 1000      // 给1000起个名字：MaxSize
          #define PI 3.14            // 以后写PI，就是3.14

          // 这是单行注释：解释这行在干嘛（考试写"算法思想"靠它）
          /* 这是多行注释
             可以写好几行 */
      - type: bullets
        items:
          - "**#define**：给常量起名字，改一处全变——802真题里 MaxSize 就是这样来的"
          - "**注释**：写给人看的，电脑忽略——考试要求写算法思想，就是注释的放大版"

  - type: content
    kicker: 亲眼看报错
    title: 编译器会怎么骂你
    blocks:
      - type: code
        text: |
          printf("你好")          // 少分号
          Int main()              // 大小写写混，int必须小写
          printf("你好");         // 中文引号
          int main(){             // 左花括号没配右花括号
      - type: bullets
        items:
          - 这四种错，**犯一个编译器报一个**，报错信息是英文，但翻来覆去就这四类
          - 养成习惯：**写完先扫一遍分号、引号、花括号**，再编译

  - type: board
    kicker: 板书推演
    title: 从零手写第一个程序
    task: 任务：在白纸上写出完整程序，让屏幕打印两行字（含换行、分号、return 0）。分六步：头文件 → main开头 → 第一行printf → 第二行printf → return 0 → 补右花括号

  - type: content
    kicker: 板书结论
    title: 写出来的程序长这样
    blocks:
      - type: code
        text: |
          #include <stdio.h>
          int main(){
              printf("第一行\n");
              printf("第二行\n");
              return 0;
          }
      - type: note
        text: 运行结果：
      - type: code
        text: |
          第一行
          第二行

  - type: content
    kicker: 本节总结
    title: 总结
    blocks:
      - type: bullets
        items:
          - 程序骨架：**头文件 ＋ 宏定义 ＋ main函数 ＋ 函数体 ＋ return**
          - 程序跑起来的路：**源代码 → 编译 → 运行**
          - 易错点：忘分号 / 大小写混用 / 中文引号 / 花括号不配对

  - type: content
    kicker: 课后任务
    title: 1道跟练 ＋ 1道模仿
    blocks:
      - type: bullets
        items:
          - "**跟练题**：写一个程序，分三行输出你的名字、你的本科学校、你的考研目标"
          - "**模仿题**：把课上的程序改一改，用一条printf打印三行诗（提示：\n可以放在中间）"
      - type: note
        text: 参考答案在本PPT最后两页，课后自行对照；要求：合上笔记能默写main框架

  - type: content
    kicker: 参考答案 · 跟练题
    title: 跟练题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          #include <stdio.h>
          int main(){
              printf("张三\n");
              printf("某大学\n");
              printf("重庆邮电大学\n");
              return 0;
          }
      - type: bullets
        items:
          - "三行 printf，每行末尾各带一个换行符；把内容换成你自己的姓名、学校、目标"
          - "一个 printf 管一行，分号、双引号、换行符一样都不能少"
  - type: content
    kicker: 参考答案 · 模仿题
    title: 模仿题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          #include <stdio.h>
          int main(){
              printf("第一行诗\n第二行诗\n第三行诗\n");
              return 0;
          }
      - type: bullets
        items:
          - "只用一条 printf 也能出三行：换行符放进字符串中间照样换行"
          - "换行符是反斜杠加字母 n 两字符组成的整体，别拆开、别写成斜杠"
