meta:
  id: C1-B-05
  title: 引用与参数传递
  stage: B强化
  instructor: 牙膏学长
  duration: 28min

slides:
  - type: cover
    kicker: 重邮802 数据结构代码课程
    title: C语言强化阶段
    subtitle: 第5节 引用与参数传递
    meta: 阶段：强化 ｜ 主讲：牙膏学长 ｜ 预计28分钟 ｜ 资料答疑：伴梦研途QQ群

  - type: content
    kicker: 引题
    title: 函数里明明改了，外面的变量为什么没变
    blocks:
      - type: code
        text: |
          void swap(int x, int y){
              int t = x; x = y; y = t;   // 三行交换写得没错
          }
          int a = 3, b = 5;
          swap(a, b);
          printf("%d %d", a, b);          // 还是3和5
      - type: bullets
        items:
          - 函数里x和y确实换了，函数结束格子被栈收回，a和b全程没人碰
          - 基础阶段留过这个为什么，今天用上节课的栈把它讲清
          - 讲清之后给两种真正改得动的写法：指针传参、引用传参

  - type: content
    kicker: 值传递
    title: 参数收到的是值的副本，不是变量本身
    blocks:
      - type: bullets
        items:
          - 调用那一瞬间，a把值3复印一份交给x，b把值5复印一份交给y
          - x、y是swap自己的局部变量，住栈上的新格子，和a、b的格子是四个
          - 这个机制叫值传递，是C语言传参的默认行为
          - 术语：交出去的a、b叫实参，函数头上接收的x、y叫形参
          - 值传递有正当用途：只读不改的函数用它最简单，结果用return递出来
      - type: note
        text: 副作用要显式地传地址或引用才会发生，不会默认出现

  - type: content
    kicker: 解法一
    title: 指针传参：把地址交进去，顺着地址改
    blocks:
      - type: code
        text: |
          void swap(int *px, int *py){
              int t = *px;
              *px = *py;
              *py = t;
          }
          swap(&a, &b);        // 交出去的是a和b的地址
      - type: bullets
        items:
          - px、py仍是栈上的新格子，装的是地址，箭头跨出函数框指到a、b
          - 临时变量t不能省：*px = *py之后a的原值已被覆盖，找不回来
          - 调用处漏写&能编译过，但把a的值当地址用，多半当场崩溃

  - type: content
    kicker: 解法二
    title: 引用：给变量起第二个名字
    blocks:
      - type: code
        text: |
          int x = 10;
          int &r = x;      // r是x的引用，即x的别名
          r = 20;          // x也变成20：同一格内存，没有新格子
      - type: bullets
        items:
          - 两条规矩：定义时必须初始化；绑定之后不能改绑
          - r = y是把y的值赋给x，不是让r改指向y——这点和指针相反
          - 这个&是声明别名，与取地址的&是同一符号两种含义，看位置区分
          - 引用是C++语法，纯C没有；802伪代码环境直接可用

  - type: content
    kicker: 引用传参
    title: 引用版swap：函数体和失败版一样，只多两个&
    blocks:
      - type: code
        text: |
          void swap(int &x, int &y){
              int t = x; x = y; y = t;   // 改x就是改a
          }
          swap(a, b);        // 调用处不用写&
      - type: bullets
        items:
          - 参数x是a的别名，没有新格子、没有复印，函数里改x就是改a
          - 传大结构体时这点很值钱：值传递每次调用拷一整片，引用一格都不拷
          - struct Student stu是白拷一次还改不动，struct Student &stu直接改本人

  - type: content
    kicker: 三种写法
    title: 三种传参：一张表看清楚，也知道怎么选
    blocks:
      - type: table
        head: [写法, 参数收到什么, 能改外面吗, 调用处]
        rows:
          - [值传递, 值的副本, 不能, swap(a, b)]
          - [指针传参, 地址, 能, swap(&a, &b)]
          - [引用传参, 别名, 能, swap(a, b)]
      - type: bullets
        items:
          - 读代码先看参数表再看函数体：光杆类型改不动，带*或&才改得动
          - 只认参数表不认函数名：名字叫changeX，参数是int x，照样改不动
          - 只读不改用值传递；要改外面用引用，兼容纯C环境用指针
          - 传大块数据别用值传递；数组做参数只能指针传（int a[]就是int *a）

  - type: content
    kicker: 伪代码语境
    title: 为什么伪代码的参数上常写&
    blocks:
      - type: bullets
        items:
          - 初始化、插入这类函数要直接改传进来的结构，值传递改副本等于白干
          - 参数写&，等于在函数头上写明：这个参数会改到调用者的数据
          - 读伪代码先看参数表：带&的会动数据，不带&的多半只读
          - 自己写函数先问一句：需要改传进来的东西吗，需要就加&
          - 数据要交到函数外只有两条路：堆上malloc后交地址，或用引用参数写进去
          - 函数不能返回局部变量的地址：格子出函数就收回，交出去的是悬空指针

  - type: content
    kicker: 本节小结
    title: 今天就三件事
    blocks:
      - type: bullets
        items:
          - 值传递交的是副本，形参是栈上新格子，所以改不动外面的变量
          - 要改得动就交地址：指针传参顺着*改，引用传参用别名改
          - 引用两条规矩：定义时初始化，绑定后不改绑
      - type: note
        text: 下一节：递归与综合实战，从零手写顺序表和单链表

  - type: content
    kicker: 课后任务
    title: 1道跟练 ＋ 1道模仿
    blocks:
      - type: bullets
        items:
          - "**跟练题**：分别用指针版和引用版写swap，各画一张内存图，上机验证a、b真的换了"
          - "**模仿题**：写increment(int &n)把外面的数加1，再把参数改成int n对照跑一次"
          - 要求：合上资料能默写三种传参的函数头；先纸上预测再上机对照
      - type: note
        text: 参考答案在本PPT最后两页，课后自行对照

  - type: content
    kicker: 参考答案 · 跟练题
    title: 跟练题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          // 指针版与引用版swap
          void swapPtr(int *px, int *py){
              int t = *px; *px = *py; *py = t;
          }
          void swapRef(int &x, int &y){
              int t = x; x = y; y = t;
          }
          int a = 3, b = 5;
          swapPtr(&a, &b);    // a=5 b=3
          swapRef(a, b);      // a=3 b=5
      - type: bullets
        items:
          - 指针版图：px、py的箭头跨出函数框指向a、b，*px改的就是a的格子
          - 引用版图：x直接标成a的别名，不画新格子
          - 两个版本都跑通，再把失败版也跑一次，三种行为对比着看

  - type: content
    kicker: 参考答案 · 模仿题
    title: 模仿题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          // 引用传参与值传递对照
          void increment(int &n){ n = n + 1; }
          int n = 10;
          increment(n);
          printf("%d\n", n);   // 11
      - type: bullets
        items:
          - 参数写int &n，调用处不写&，函数里改n就是改外面的n
          - 对照实验：参数改成int n（值传递），调用后n仍是10
          - 代码省略#include <stdio.h>与main骨架
