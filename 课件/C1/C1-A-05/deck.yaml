meta:
  id: C1-A-05
  title: 函数与数组
  stage: A基础
  instructor: 牙膏学长
  duration: 40min

slides:
  - type: cover
    kicker: 重邮802 数据结构代码课程
    title: C语言基础阶段
    subtitle: 第5节 函数与数组
    meta: 阶段：基础 ｜ 主讲：牙膏学长 ｜ 预计40分钟 ｜ 资料答疑：伴梦研途QQ群

  - type: content
    badge: 第5节 · 基础阶段收官
    kicker: 先看一个问题
    title: 代码越写越长，怎么管
    blocks:
      - type: bullets
        items:
          - 前四节的程序，所有代码都挤在main里，十几行还行，几百行就乱了
          - 802的算法全是**一个个函数**：InitList、ListInsert、DFS……
          - 本节目标：学完你能**定义和调用函数，用数组存一批数据**
          - 这是基础阶段最后一节，学完就进强化阶段

  - type: content
    kicker: 函数是什么
    title: 函数 = 打包好的干活步骤
    blocks:
      - type: table
        head: [做菜类比, 函数对应]
        rows:
          - [菜谱名字, 函数名]
          - [需要的食材, 参数（输入）]
          - [做出来的菜, 返回值（输出）]
          - [做菜步骤, 函数体]
      - type: bullets
        items:
          - 函数把一段干活步骤**打包起名**，要用的时候喊名字就行
          - 802里每个基本操作都是一个函数，这个结构后面天天见

  - type: content
    kicker: 定义一个函数
    title: 函数的四部分
    blocks:
      - type: code
        text: |
          int max(int a, int b){      // 返回类型 函数名(参数)
              if(a > b) return a;
              return b;
          }
      - type: bullets
        items:
          - "**返回类型**：函数干完活，交出来的东西是什么类型"
          - "**函数名**：喊它用的名字"
          - "**参数**：干活需要的原料，写在括号里"
          - "**函数体**：花括号里的干活步骤，return 交出结果"

  - type: content
    kicker: 调用函数
    title: 喊名字，交原料，收结果
    blocks:
      - type: code
        text: |
          int m = max(3, 8);          // 调用：把3和8交给max
          printf("%d", m);            // m里是8
      - type: bullets
        items:
          - 调用就是：**喊函数名，把原料放进括号，拿走返回值**
          - 程序执行到调用处，跳进函数里干活，干完带着结果回来
          - 参数和返回值的具体机制，强化阶段讲透；本节先会读会写

  - type: content
    kicker: 返回值的两个细节
    title: return 的两件事
    blocks:
      - type: code
        text: |
          int half(int n){
              if(n < 0) return -1;    // ① 提前结束：不合要求，直接走人
              return n / 2;           // ② 交出结果
          }
      - type: bullets
        items:
          - return干两件事：**交出结果**，并且**立刻结束函数**
          - 一个函数里可以有多个return，但**每次执行只会走一个**
          - 返回类型写void的函数，不交结果，只管干活（如打印、遍历）

  - type: content
    kicker: 数组登场
    title: 一批同类型的数据，放一排盒子里
    blocks:
      - type: code
        text: |
          int score[5];               // 一排5个int盒子，编号0到4
          score[0] = 85;
          score[1] = 92;
      - type: bullets
        items:
          - 要存5个分数，难道声明5个变量？数组就是**一排带编号的盒子**
          - 编号叫**下标**，从0开始：5个盒子的下标是 0、1、2、3、4
          - 802的顺序表、栈、队列，底层全是数组

  - type: content
    kicker: 本节难忘时刻
    title: int a[5]，最大下标是几？
    blocks:
      - type: code
        text: |
          int a[5];
          a[5] = 10;                  // 这一行，越界了！
      - type: bullets
        items:
          - a[5]是5个盒子，下标是 **0、1、2、3、4**，没有a[5]这个盒子
          - 最大下标是 **长度减1**，写a[5]就是伸手去拿不存在的盒子
          - 越界**不报错**，但可能踩坏别人的数据——802程序阅读题爱考这个

  - type: content
    kicker: 初始化与遍历
    title: 数组的声明、初始化、for遍历
    blocks:
      - type: code
        text: |
          int a[5] = {3, 1, 4, 1, 5};        // 声明的同时装好
          for(int i = 0; i < 5; i++){
              printf("%d ", a[i]);           // 挨个访问
          }
      - type: bullets
        items:
          - 花括号一次性装好，叫**初始化**
          - 遍历数组的标准姿势：**for循环，i从0到长度减1**
          - 上一节的for，这一节有了真正的用武之地

  - type: content
    kicker: 数组做函数参数
    title: 把数组交给函数处理
    blocks:
      - type: code
        text: |
          int sum(int a[], int n){
              int s = 0;
              for(int i = 0; i < n; i++) s += a[i];
              return s;
          }
      - type: bullets
        items:
          - 数组交给函数，要**连长度一起交**：int a[], int n
          - 函数里不知道数组多长，所以n必须单独传
          - 802算法函数的参数表，几乎全是"数组+长度"这个搭配

  - type: content
    kicker: 字符数组与字符串
    title: 字符串 = 字符数组 + 结尾标记
    blocks:
      - type: code
        text: |
          char s[] = "hello";         // 实际存了6个字符
          // h  e  l  l  o  '\0'
      - type: bullets
        items:
          - "字符串本质是**字符数组**，结尾偷偷多一个 '\\0' 作结束标记"
          - "'\\0'是空字符，标记“字符串到此为止”，strlen、打印全靠它找结尾"
          - 这个概念是后面串章节的前置，今天先建立印象

  - type: board
    kicker: 板书推演
    title: 从零写：函数求数组最大值
    task: 任务：写一个完整程序，定义函数findMax处理数组，在main里声明数组{3,9,2,7}，调用函数求最大值并打印。分六步：头文件 → 定义findMax函数 → main开头 → 声明数组 → 调用并打印 → return 0 补花括号。注意：函数写在main前面；数组传参要带长度

  - type: content
    kicker: 板书结论
    title: 程序长这样
    blocks:
      - type: code
        text: |
          #include <stdio.h>
          int findMax(int a[], int n){
              int m = a[0];
              for(int i = 1; i < n; i++)
                  if(a[i] > m) m = a[i];
              return m;
          }
          int main(){
              int a[4] = {3, 9, 2, 7};
              printf("最大值：%d\n", findMax(a, 4));
              return 0;
          }
      - type: note
        text: 输出：最大值：9。"打擂台"思路：先让第一个当擂主，逐个挑战

  - type: content
    kicker: 基础阶段收官总结
    title: 五节课，你拿到了什么
    blocks:
      - type: table
        head: [节次, 拿到的能力]
        rows:
          - [第1节, 看懂程序骨架：头文件、main、编译运行]
          - [第2节, 变量与类型，数据进出程序]
          - [第3节, 五类运算符，让程序会算]
          - [第4节, 分支与循环，让程序会判断、会重复]
          - [第5节（本节）, 函数与数组，代码打包、批量存数据]
      - type: text
        text: 下一步：强化阶段讲**指针与结构体**——前面埋的悬念，全部揭晓

  - type: content
    kicker: 课后任务
    title: 1道跟练 ＋ 1道模仿
    blocks:
      - type: bullets
        items:
          - "**跟练题**：把板书的findMax程序自己从零敲一遍，别抄"
          - "**模仿题**：把findMax改成findMin，求数组最小值"
      - type: note
        text: 写完对照讲稿附录的参考答案；要求：合上笔记能默写"函数定义四部分"和"数组遍历的for"
