meta:
  id: C1-B-06
  title: 递归与综合实战
  stage: B强化
  instructor: 牙膏学长
  duration: 42min

slides:
  - type: cover
    kicker: 重邮802 数据结构代码课程
    title: C语言强化阶段
    subtitle: 第6节 递归与综合实战
    meta: 阶段：强化 ｜ 主讲：牙膏学长 ｜ 预计42分钟 ｜ 资料答疑：伴梦研途QQ群

  - type: content
    kicker: 引题
    title: 函数调用自己，允许吗
    blocks:
      - type: code
        text: |
          void countdown(int n){
              printf("%d ", n);
              countdown(n - 1);      // 函数调用自己
          }
      - type: bullets
        items:
          - 允许，这叫**递归**：函数自己调自己
          - 但这段代码有问题：它永远停不下来
          - 本节目标：学会递归的三要素，看懂调用栈，最后从零手写顺序表和单链表

  - type: content
    kicker: 递归三要素
    title: 递归三要素：终止、缩小、返回
    blocks:
      - type: code
        text: |
          int fact(int n){           // 求n的阶乘
              if (n == 0) return 1;  // ① 终止条件
              return n * fact(n - 1);// ② 缩小规模 ③ 返回结果
          }
      - type: bullets
        items:
          - 终止条件：什么时候不再调用自己，没有它就是无底洞
          - 缩小规模：每次调用都要离终止更近一步
          - 返回值：把自己这层的结果交回给上一层

  - type: content
    kicker: 调用栈
    title: 递归怎么运行：一层一层展开，再一层一层收回
    blocks:
      - type: bullets
        items:
          - fact(3)调fact(2)，fact(2)调fact(1)，一路到fact(0)触发终止
          - 每层调用都有自己的格子：参数n各是各的，互不干扰
          - 收回时逐层交结果：1、1、2、6，最后fact(3)返回6

  - type: content
    kicker: 调用栈推演
    title: fact(3)的调用栈：展开与收回（拿纸跟着画）
    blocks:
      - type: bullets
        items:
          - ① 竖着叠四层框：fact(3)、fact(2)、fact(1)、fact(0)，每层标自己的n，向下箭头是调用
          - ② 从fact(0)往上画返回箭头：逐层交回1、1、2、6，向上箭头是返回

  - type: content
    kicker: 对比
    title: 递归与迭代：一套问题，两种写法
    blocks:
      - type: code
        text: |
          // 迭代版阶乘
          int result = 1;
          for(int i = 1; i <= n; i++)
              result = result * i;
      - type: bullets
        items:
          - 迭代靠循环，一层格子从头跑到尾；递归靠调用，层数随问题展开
          - 阶乘这种问题，迭代更省；递归的优势在结构自带层次的问题上
          - 两种都要会：读代码要都认得，写代码按问题选

  - type: content
    kicker: 两个事故
    title: 递归的两大事故：无限递归与重复爆炸
    blocks:
      - type: code
        text: |
          int fib(int n){
              if(n <= 1) return n;
              return fib(n - 1) + fib(n - 2);
          }
      - type: bullets
        items:
          - 忘写终止条件：一层层调下去，栈被撑爆，程序崩溃
          - 斐波那契的写法里，同样的子问题被反复算，n稍大就慢到不能忍
          - 规矩：写递归先写终止条件；看见重复计算，知道有更聪明的记结果写法

  - type: content
    kicker: 综合实战
    title: 把四样工具装进一个能跑的程序
    blocks:
      - type: bullets
        items:
          - 目标不是学顺序表和链表：插入删除、头结点、查找那些是数据结构课的内容
          - 今天只练四样工具的组合：结构体、指针、动态内存、引用传参
          - 第一个组合：结构体里装数组，再配一个计数的成员
      - type: code
        text: |
          struct List {
              int data[10];    // 数据：结构体里装数组
              int length;      // 计数：数组自己不知道存了几个
          };
          void initList(struct List &L){ L.length = 0; }   // 引用传参改外面的表

  - type: content
    kicker: 结构体里装指针
    title: 自引用：成员是指向同类结构体的指针
    blocks:
      - type: code
        text: |
          struct Node {
              int data;              // 数据
              struct Node *next;     // 指向同类的指针
          };
      - type: bullets
        items:
          - 数组必须连成一片、大小写死；要让几块分开的内存互相认识，只能用指针
          - 自引用合法的关键在星号：成员是地址，不需要知道Node内部多大
          - 成员写struct Node next（不带星号）就不行：套下去没有尽头
          - 定义里struct不能省，此刻还没有别名

  - type: content
    kicker: 造、串、走、还
    title: malloc造结构体，箭头串起来，指针走一遍
    blocks:
      - type: code
        text: |
          struct Node *p = (struct Node *)malloc(sizeof(struct Node));
          if (p == NULL) return 1;
          p->data = 10;
          p->next = q;        // 串：前一个的next存后一个的地址
      - type: bullets
        items:
          - 住堆上：数量运行时才知道，而且要活得比函数长（上节课的选型）
          - next先置NULL：malloc不清零，垃圾地址会让遍历跑飞
          - 走一遍：while(p != NULL)，打印p->data，再p = p->next
          - 收尾三块都free再置NULL，账才平

  - type: content
    kicker: 综合内存图推演
    title: 一张图把这一阶段全画上（拿纸跟着画）
    blocks:
      - type: bullets
        items:
          - ① 画栈：一个格子标p，里面装地址（局部变量住栈上）
          - ② 画堆上三片分开的结构体格，每片两格：左data右next，填10、20、30
          - ③ next互串画箭头，最后一片next写NULL；p的箭头指到第一片
          - ④ 走一遍：p沿箭头挪三次打印，变NULL时循环停；free后格子涂掉、箭头失效

  - type: content
    kicker: 本节小结
    title: 今天就两件事
    blocks:
      - type: bullets
        items:
          - 递归三要素：终止条件、缩小规模、返回值；运行过程是调用栈的展开与收回
          - 四样工具的组合：结构体装数组也装指针、malloc造结构体、引用传参改外面、free平账
          - 一张综合内存图：栈上指针、堆上分开的结构体格、箭头、NULL
      - type: note
        text: 顺序表与链表的正式内容（插删、头结点、查找）在数据结构课讲；强化阶段到此完结

  - type: content
    kicker: 课后任务
    title: 1道跟练 ＋ 1道模仿
    blocks:
      - type: bullets
        items:
          - "**跟练题**：手写阶乘的递归版与迭代版，都跑通，再把fact(3)的调用栈画一遍"
          - "**模仿题**：malloc三个struct Node，data填1、2、3，用next串起来，遍历打印后全部free"
          - 要求：合上资料能默写fact递归版、struct Node定义、malloc＋判空＋箭头赋值＋free四步
      - type: note
        text: 参考答案在本PPT最后两页，课后自行对照

  - type: content
    kicker: 参考答案 · 跟练题
    title: 跟练题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          // 阶乘递归版（fact(5)=120）
          int fact(int n){
              if (n == 0) return 1;    // 终止条件
              return n * fact(n - 1);  // 缩小 + 返回
          }
          // 迭代版：result=1; for(i=1;i<=n;i++) result*=i;
      - type: bullets
        items:
          - fact(3)调用栈：3→2→1→0四层展开，返回1、1、2、6
          - 迭代版只用result和i两个变量，空间从头到尾不变

  - type: content
    kicker: 参考答案 · 模仿题
    title: 模仿题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          // 三结点单链表：造、串、走、还
          struct Node { int data; struct Node *next; };
          struct Node *a = (struct Node *)malloc(sizeof(struct Node));
          // b、c同样造法，判空不能省；data分别填1、2、3
          a->next = b;  b->next = c;  c->next = NULL;
          struct Node *p = a;
          while(p != NULL){ printf("%d ", p->data); p = p->next; }
          free(a); free(b); free(c);
      - type: bullets
        items:
          - 输出1 2 3；串联就是前一个的next存后一个的地址，遍历到NULL停
          - 三个结点都要free，有借有还
          - 代码省略头文件与main骨架
