meta:
  id: C3-C-01
  title: 冲刺总结课
  stage: C冲刺
  instructor: 牙膏学长
  duration: 40min

slides:
  - type: cover
    kicker: 重邮802 数据结构代码课程
    title: 数据结构题型实战阶段
    subtitle: 第8节 冲刺总结
    meta: 阶段：题型实战 ｜ 主讲：牙膏学长 ｜ 预计40分钟 ｜ 资料答疑：伴梦研途QQ群

  - type: content
    kicker: 引题
    title: 这一节不教新东西，只把学过的接成一张图
    blocks:
      - type: bullets
        items:
          - "三件事：把 15 个模板汇成一棵决策树、把七类高频错误列成清单、把考场策略说清"
          - "顺序：决策树三问 → 易错七条 → 阅读题技巧回顾 → 17 题回顾表 → 考场时间与书写格式"
          - "这一页表考前还要再看一遍：考前看决策树与回顾表，比刷新题有用"
      - type: note
        text: "决策树的目标：拿到任何一道算法题，30 秒内报出模板编号"

  - type: content
    kicker: 决策树 · 第一问
    title: 第一问：什么结构
    blocks:
      - type: table
        head: [结构, 候选模板]
        colW: [4.5, 7.0]
        rows:
          - [单链表, 1 头插、2 快慢指针、3 断链拼接、4 条件删除、14 辅助栈]
          - [双链表 / 循环链表, 3 断链拼接、11 循环模拟]
          - [二叉树, 5 递归三件套、6 层序分层、12 建树、15 中序加prev]
          - [图, 7 DFS回溯、8 BFS分层、13 入度表]
          - [数组, 9 折半改判定、10 归并加计数]
      - type: note
        text: "结构定了候选范围：15 张卡一下子缩到两三张；认结构同时把字段名、头结点、下标起点圈出来"

  - type: content
    kicker: 决策树 · 第二问
    title: 第二问：做什么操作
    blocks:
      - type: bullets
        items:
          - "走一遍并统计（求高度、宽度、计数）→ 模板 5、6、8"
          - "改结构（插入、删除、重排、逆置）→ 模板 1、3、4"
          - "找一个位置或值（中点、倒数第k、峰值）→ 模板 2、9"
          - "验证或排序序列（拓扑序列、判环）→ 模板 13"
          - "倒着处理（回文、后序）→ 模板 14；带路径约束（经过某点、长度k）→ 模板 7 加参数"
      - type: note
        text: "操作定了模板类型：统计想遍历携带、改结构想断链拼接、找位置想夹逼"

  - type: content
    kicker: 决策树 · 第三问
    title: 第三问：有什么约束
    blocks:
      - type: bullets
        items:
          - "'原地 / 空间 O(1)'→ 排除辅助数组解法，想改指针（头插、双指针）"
          - "'时间尽可能低'→ 排除 O(n²)：n 大想折半 O(logn) 或归并 O(nlogn)，网格距离想多源 BFS"
          - "'利用原结点空间'→ 不许新 malloc 数据结点，只建头结点，摘结点重新接"
          - "'经过某点 / 长度为 k'→ 模板 7 加参数：拆段或带 depth，盯住 visited 复位"
      - type: note
        text: "约束定了要改模板的哪一处——把题目条件逐条翻译成改动点，条件数完改动就齐"

  - type: content
    kicker: 决策树 · 完整版
    title: 三问走完：15 个模板全部挂上
    blocks:
      - type: table
        head: [模板, 名称, 代表真题]
        colW: [1.5, 4.5, 5.5]
        rows:
          - [1/2/3/4, 头插、快慢指针、断链拼接、条件删除, 2023倒置、2025倒数k、408重排、2021三问]
          - [5/6/12/15, 递归三件套、层序分层、建树、中序prev, 2025最长路径、2024繁荣度、2026建树、2024判BST]
          - [7/8/13, DFS回溯、BFS分层、入度表, 2025/2024路径、2023像素、2026判拓扑]
          - [9/10/11/14, 折半改判定、归并计数、循环模拟、辅助栈, 2021双调、2020逆序对、2026约瑟夫、判回文]
      - type: bullets
        items:
          - "用法：三问报出编号 → 四步法落地（认结构、选模板、改条件、补边界）→ 三件套书写"
      - type: note
        text: "15 张卡覆盖 2020—2026 全部 17 道算法大题；这张表与第2节的决策表是同一张，考前只看这一页"

  - type: content
    kicker: 易错清单 · 前四条
    title: 高频易错七条（上）：每条都出过真题
    blocks:
      - type: bullets
        items:
          - "① 下标基准写错：排序章节 data[0] 是哨兵数据 1 起、查找返回位序 mid+1——例：折半返回 mid 而不是 mid+1"
          - "② 忘判空：malloc 后不判、递归前不判、访问 p->next 前不判 p——例：非递归后序遍历缺 T==NULL 判断，空树直接崩"
          - "③ visited 忘复位：路径搜索不回溯、多次调用不清全局数组、两段搜索之间不复位——例：2025 经过k的路径，两段之间必须全部清零"
          - "④ malloc 忘 free 或 free 后不置 NULL：销毁链表只 free 头结点是泄漏、先 free 再取值是读废内存——例：DestroyList 必须先存后继再 free"
      - type: note
        text: "四条的自查方式一样：写完代码把每个指针的'生老病死'过一遍——哪里生（malloc）、哪里死（free）、死了之后有没有人还指着它"

  - type: content
    kicker: 易错清单 · 后三条
    title: 高频易错七条（下）：递归与复杂度的坑
    blocks:
      - type: bullets
        items:
          - "⑤ k 与 n 的合法性：倒数第 k 里 k 超过表长、长度 k 的路径里 k 超过 vexnum-1、约瑟夫环里 m 或 s 超范围——题目的'否则返回0'分支就是分"
          - "⑥ 递归漏终止条件或漏进度保证：无限递归、区间不缩小——例：平均值划分遇到全相等输入死递归，修正靠'区间必须真的变小'两个保护条件"
          - "⑦ 复杂度只给结论不给理由：写'O(nlogn)'三个字拿不全分——正确写法是一句结论加一句依据，如'每层合并 O(n)、共 logn 层'"
      - type: note
        text: "⑥ 的自查问句：递归每一层，规模真的变小了吗？——变小才有终止，这是所有递归的通用检查"

  - type: content
    kicker: 阅读题回顾
    title: 程序阅读题：三类考法与填空技巧
    blocks:
      - type: bullets
        items:
          - "三类考法：挖空补全（最多，四步：猜功能、标变量、按位置定候选、回代验证）、片段排序（三步：入口在前、依赖排序、输出在后）、功能与复杂度（结论加理由）"
          - "填空四类高频空：循环边界（i<n 还是 i<=n）、指针移动（next 还是 prior）、递归参数（怎么缩小）、返回条件"
          - "第一步永远是认结构：三年 9 道阅读题考的全是学过的结构代码，读懂题目给的定义，空就好填"
      - type: note
        text: "20 分 4—5 小题形式固定；考前把三年 9 道阅读题按套路再走一遍"

  - type: content
    kicker: 17题回顾表
    title: 2020—2026 全部 17 道算法大题（考前看这一页）
    blocks:
      - type: bullets
        items:
          - "**2026**（3题30分）：约瑟夫环·循环单链表·模板11·8分；先序中序建树·二叉树·模板12·10分；判拓扑序列·邻接表·模板13·12分"
          - "**2025**：倒数第k·单链表·模板2（另解14）；最长路径·二叉树·模板5变体；经过k的路径·邻接表·模板7"
          - "**2024**：判BST·二叉树·模板15；长度k的路径·邻接表·模板7；繁荣度·二叉树·模板6"
          - "**2023—2022**：循环段倒置·单链表·模板1/3·12分；像素距离图·二维数组·模板8多源；多项式分解·循环链表·模板1；最小半径生成树·图·选讲"
          - "**2021—2020**：双调序列·数组·模板9；有序链表三问·单链表·模板1/4；双向循环改造·双链表·模板3；逆序对·数组·模板10"
      - type: note
        text: "分值只标材料明确给出的（2026 三题与 2023 循环段），其余以当年真题为准；链表 6 题、图 5 题、树 4 题、查找 1 题、排序 1 题——前三章占 88%"

  - type: content
    kicker: 考场策略 · 时间
    title: 考场时间分配：30 分算法题给多少分钟
    blocks:
      - type: bullets
        items:
          - "802 专业课 150 分 180 分钟；算法分析题 30 分建议给 45—55 分钟，每题 15—18 分钟"
          - "每题 15—18 分钟的内部分配：3 分钟审题加认结构、8 分钟写代码、2 分钟补边界与复杂度、留 2—3 分钟检查"
          - "程序阅读题 20 分给 20—25 分钟；剩下的时间给填空与综合应用"
          - "卡壳策略：一道题 8 分钟写不出完整代码，先把思想段写满（能救 2—3 分），跳下一道"
      - type: note
        text: "草稿纸用法：先画结构图再写代码——改指针的题画改前改后两张图，照着图写"

  - type: content
    kicker: 考场策略 · 书写
    title: 答题书写格式：三件套的排版
    blocks:
      - type: bullets
        items:
          - "三段各标小标题：算法思想、算法代码、复杂度分析——阅卷按段给分，标题就是路标"
          - "开头写一句结构声明：'设链表带头结点，数据从 L->next 起'或'设数组下标从 1 起，data[0] 作哨兵'——把你的约定亮出来"
          - "代码写伪代码即可，但结构体定义、函数签名、边界判断必须完整；字段名抄题目给的"
          - "复杂度一句结论加一句理由；思想段把'携带什么信息、改了模板哪几处'写出来"
      - type: note
        text: "卷面就是印象分：分段清楚、声明在前、结论带理由，同样的代码多拿 1—2 分"

  - type: content
    kicker: 全课程收官
    title: 从C语言到真题：整门课程串一遍
    blocks:
      - type: bullets
        items:
          - "C语言阶段给了你语法与内存模型：指针、结构体、动态内存、引用传参——读懂与写出伪代码的工具"
          - "数据结构基础阶段给了你每个结构的定义与基本操作：线性表、栈队、串、树、图——算法的载体"
          - "数据结构强化阶段给了你 15 个经典算法与模板卡：每个算法五步讲透——考场上要默写的就是这些"
          - "题型实战阶段：前两节把模板变成可背骨架与决策表，中间五节用 17 道真题练四步法，这一节汇成一张图"
      - type: note
        text: "课程到此收官。剩下的事只有一件：把 15 张卡背到能默写、把 17 道真题每道重写一遍——考场上没有新题"

  - type: content
    kicker: 课后任务
    title: 限时训练：90 分钟三道真题
    blocks:
      - type: bullets
        items:
          - "**限时训练**：2026 年三道真题（约瑟夫环 8 分、建树 10 分、判拓扑 12 分，共 30 分）在 90 分钟内完成——正好是 802 算法分析题的分值与建议用时"
          - "按三件套格式书写：结构声明、思想、代码、复杂度带理由；写完对照答案页自评，把丢分的步骤记下来"
          - "自评三问：模板报对了吗、条件改全了吗、边界补上了吗——丢分归到哪一类，就回哪一节重看"
      - type: note
        text: "参考答案在本PPT最后两页，课后自行对照；这是全课程的最后一次作业"

  - type: content
    kicker: 参考答案 · 限时训练
    title: 2026 三题答案索引（自行对照）
    blocks:
      - type: bullets
        items:
          - "约瑟夫环（8分）：完整代码与三件套见第3节答案页；自查点——不带头结点的声明、定位到 s、O(nm) 理由"
          - "先序中序建树（10分）：完整代码与三件套见第5节答案页；自查点——下标 1 起、四个边界、'值互不相同'前提"
          - "判拓扑序列（12分）：完整代码与三件套见第6节答案页；自查点——按序模拟不真排序、O(V+E) 理由"
      - type: note
        text: "90 分钟三题的合格线：每题三件套齐全、模板选对；优秀线：边界分支完整、复杂度有理由"

  - type: content
    kicker: 参考答案 · 自评
    title: 自评三问的对照（自行对照）
    blocks:
      - type: bullets
        items:
          - "模板报错 → 回第1、2节的骨架页与决策表，把题面特征与模板重新对一遍"
          - "条件改漏 → 回第3—7节对应真题的'改条件'页，数题目条件与代码改动是否一一对应"
          - "边界没补 → 对照易错七条，逐条过：下标、判空、复位、free、k 合法性、递归进度、复杂度理由"
      - type: note
        text: "把三次限时训练的丢分记在同一张纸上——考前就看这张纸，不看别的"
