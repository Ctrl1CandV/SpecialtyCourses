meta:
  id: C0
  title: 代码班总先导
  stage: 先导
  instructor: 牙膏学长
  duration: 10min

slides:
  - type: cover
    kicker: 重邮802 数据结构代码课程
    title: 代码班总先导
    subtitle: 10分钟看懂：代码题考什么 · 怎么学 · 课程怎么排
    meta: 主讲：牙膏学长 ｜ 面向全体学员 ｜ 资料答疑：伴梦研途QQ群

  - type: content
    kicker: 先认识一下
    title: 牙膏学长
    blocks:
      - type: table
        head: [项目, 内容]
        rows:
          - [考研, 26考研上岸]
          - [专业, 计算机科学与技术（学硕）]
          - [初试专业课, 125分]
          - [复试专业代码笔试, 87分 · 专业第三]
          - [总分排名, 专业第九]

  - type: content
    badge: 真题 · 2025
    kicker: 在开始之前，先看我们要攻克的目标
    title: 2025 算法分析题原题
    blocks:
      - type: text
        text: 设线性表 L 采用带头结点的单链表存储。给定整数 k，设计一个算法找到**倒数第 k 个元素**：找到则打印该元素的值并返回 1，否则返回 0。
      - type: note
        text: 要求：写出算法思想 ＋ 伪代码 ＋ 时间、空间复杂度分析
      - type: text
        text: 你现在看不懂这道题？**完全正常**——它就是我们这门课最后要攻克的目标。请记住它：单链表 · 倒数第k个 · 带头结点

  - type: content
    kicker: 第一件事：代码题值多少钱
    title: 802 试卷结构（150分）
    blocks:
      - type: table
        head: [题型, 数量与分值, 与代码的关系]
        rows:
          - [程序阅读题, 约4—5题 ≈ 20分, 代码挖空补全、功能分析]
          - [填空题, 约10空 ≈ 30分, 手算小题（KMP、哈夫曼、地址计算等）]
          - [综合应用题, 约6—7题 ≈ 70分, 手算大题，依赖代码思维]
          - [算法分析题, 3题 = 30分, 核心目标：思想＋伪代码＋复杂度]
      - type: text
        text: 算法分析题 **30分**，全卷单题分值最高的部分；加上程序阅读题约20分，**代码能力实际影响超50分**

  - type: content
    kicker: 第二件事：代码题怎么考
    title: 考的是伪代码：重思路 · 轻语法
    blocks:
      - type: note
        text: 阅卷看的是思路和框架，不会揪着少个分号扣分
      - type: bullets
        items:
          - "**① 算法思想**：文字把思路说清楚"
          - "**② 伪代码**：完整结构体定义与边界判断"
          - "**③ 复杂度**：时间 ＋ 空间"
      - type: text
        text: "**三件套缺一不可，缺一样扣分。**课程按三件套讲，考试按三件套答"

  - type: content
    kicker: 伪代码到底长什么样
    title: 2025真题的一种解法（快慢指针）
    blocks:
      - type: code
        text: |
          int findK(LinkList &L, int k){
              LNode *p = L, *q = L;
              while(k != 0 && q != NULL){ q = q->next; k--; }
              if(q == NULL) return 0;
              while(q != NULL){ q = q->next; p = p->next; }
              printf("%d", p->data);
              return 1;
          }
      - type: bullets
        items:
          - 没有 include、没有 main，一段干净的函数
          - 结构体、边界判断、循环边界，一样不少
          - 语法只有最基础的 if / while / 指针
          - "**基础语法学扎实，就能写出这样的代码**"

  - type: content
    kicker: 第三件事：代码怎么学
    title: 学代码是一条五级楼梯
    blocks:
      - type: table
        head: [层级, 内容, 对应课程]
        rows:
          - [1 语法, if/while、数组/指针, C语言基础与强化]
          - [2 结构, 顺序表/链表/树/图 怎么定义, 数据结构基础]
          - [3 操作, 增/删/改/查, 数据结构基础]
          - [4 算法, 链表倒置/快排/DFS, 数据结构强化]
          - [5 变式, 真题改条件，仍认得模板, 真题变式与题型课]
      - type: bullets
        items:
          - 没写过代码 → 从基础篇开始
          - 写过C但指针发怵 → 从结构基础开始
          - 一轮已复习 → 直接强化 / 题型冲刺

  - type: content
    kicker: 第四件事：课程怎么排
    title: 代码班全景：三门课，一条主线
    blocks:
      - type: table
        head: [课程, 定位, 节数]
        rows:
          - [C语言, 工具课 · 打地基, 约9节（基础5＋强化4）]
          - [数据结构, 核心课 · 结构与算法, 约15节（基础·强化·举一反三）]
          - [题型课, 实战课 · 套模板解真题, 约7节（基础·强化·举一反三）]
      - type: text
        text: 合计约 **31节**，每节约30—40分钟，**总时长约17.5小时**
      - type: note
        text: 节数与时长均为规划，以最终发布版为准

  - type: content
    kicker: 怎么选课：按自己的楼层进
    title: 阶段是分层，不是流程
    blocks:
      - type: table
        head: [学生水平, 推荐路线]
        rows:
          - [零基础 / 跨考，不会写代码, 语言基础 → 语言强化 → 结构基础 → 结构强化 → 题型课]
          - [学过C但生疏, 语言强化（补看指针节）→ 结构基础 → 结构强化 → 题型课]
          - [有基础，一轮已复习, 结构强化 → 真题变式 → 题型课]
          - [基础扎实，冲刺阶段, 真题变式 ＋ 题型强化/冲刺，按需查漏]
      - type: text
        text: "**不必把每一层都爬完**——找到自己的入口，直接进"

  - type: content
    kicker: 怎么学：四条要求
    title: 学习方法
    blocks:
      - type: bullets
        items:
          - "**① 跟练**：上课我写一行，你跟着写一行"
          - "**② 手撕**：课后合上笔记，凭记忆写出来"
          - "**③ 默写**：基础阶段的模板代码，必须能默写"
          - "**④ 必做**：每节1道跟练题＋1道变式题，答案在讲稿附录"
      - type: text
        text: 代码是手艺活，看一百遍，不如自己写一遍

  - type: content
    kicker: 什么时候学什么
    title: 从现在到考前
    blocks:
      - type: table
        head: [时间, 内容]
        rows:
          - [8—9月, C语言、数据结构基础]
          - [9—10月, 结构强化、经典算法]
          - [10—11月, 真题变式、题型课]
          - [11—12月, 回顾错题、考前冲刺]
      - type: text
        text: 总量不大——**约17.5小时**，按你的楼层、缺什么补什么，跟到考前正好

  - type: content
    kicker: 记住这三句话
    title: 总结
    blocks:
      - type: bullets
        items:
          - 代码题30分＋程序阅读20分，**实际影响超50分，值得投入**
          - 802考思路，**三件套：思想＋代码＋复杂度**
          - 课程是楼梯，**找到你的楼层直接进**

  - type: transition
    kicker: 第一站
    title: C语言基础 · 导学课
    subtitle: 完全零基础的同学，现在就可以出发
