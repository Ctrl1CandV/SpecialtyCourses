meta:
  id: C2-A-05
  title: 栈与队列
  stage: A基础
  instructor: 牙膏学长
  duration: 40min

slides:
  - type: cover
    kicker: 重邮802 数据结构代码课程
    title: 数据结构基础阶段
    subtitle: 第5节 栈与队列
    meta: 阶段：基础 ｜ 主讲：牙膏学长 ｜ 预计40分钟 ｜ 资料答疑：伴梦研途QQ群

  - type: content
    kicker: 引题
    title: 为什么要限制只能在一端操作
    blocks:
      - type: bullets
        items:
          - "顺序表、链表哪个位置都能插删，很灵活；但很多问题只在一端操作，灵活反而用不上"
          - "栈：只在一端（栈顶）进出，后进先出，比如函数调用、括号匹配、表达式求值、递归"
          - "队列：一端进、另一端出，先进先出，比如排队、层序遍历、广度优先搜索"
      - type: note
        text: "栈和队列本身不难，考点全在两处：top 的约定、循环队列的判满；这一节把这两处讲透"

  - type: content
    kicker: 顺序栈 · 定义 · 约定3
    title: 顺序栈与 top=-1 约定
    blocks:
      - type: code
        text: |
          #define MaxSize 100
          typedef struct{ int data[MaxSize]; int top; }SqStack;
          bool InitStack(SqStack &S){ S.top = -1; return true; }
      - type: bullets
        items:
          - "栈就是一个数组 data 加一个 top，top 记栈顶元素的下标"
          - "本课程约定 top=-1 表示栈空，也就是 top 指向栈顶元素本身；这是约定3，本节就地定下"
          - "还有另一种约定 top=0（top 指向栈顶的下一个空位），式子全不同，P6 专门对比"

  - type: content
    kicker: 顺序栈 · 入栈出栈
    title: Push 与 Pop：自增自减的位置由约定决定
    blocks:
      - type: code
        text: |
          bool Push(SqStack &S, int elem){
              if(S.top == MaxSize - 1) return false;   // 判满
              S.data[++S.top] = elem;                   // 先移 top 再放
              return true;
          }
          bool Pop(SqStack &S, int &elem){
              if(S.top == -1) return false;             // 判空
              elem = S.data[S.top--];                   // 先取再移 top
              return true;
          }
      - type: note
        text: "top=-1 表示空，所以入栈先 ++top 再放（前缀自增）、出栈先取再 top--（后缀自减）；次序是约定决定的，不能随便写"

  - type: content
    kicker: 顺序栈 · 其余操作
    title: GetTop、判空判满、求长度
    blocks:
      - type: code
        text: |
          bool GetTop(SqStack S, int &elem){ if(S.top==-1) return false; elem=S.data[S.top]; return true; }
          bool IsEmpty(SqStack S){ return S.top == -1; }
          bool IsFull (SqStack S){ return S.top == MaxSize - 1; }
          int  GetLength(SqStack S){ return S.top + 1; }
      - type: bullets
        items:
          - "GetTop 只读栈顶、不移 top，这是它和 Pop 的区别"
          - "top=-1 约定下：判空 top==-1、判满 top==MaxSize-1、长度 top+1；三个式子都由 top=-1 推出来"

  - type: content
    kicker: 约定对比 · 检查页
    title: 若约定 top=0，五个式子怎么变？（先自己推）
    blocks:
      - type: text
        text: "另一种约定是 top=0，top 指向栈顶元素的下一个空位、栈空时 top=0。先自己推：判空、判满、入栈、出栈、求长度这五个式子分别怎么写？推完再看答案。"
      - type: bullets
        items:
          - "判空 top==0；判满 top==MaxSize；长度就是 top"
          - "入栈 data[top++] = elem（先放再移）；出栈 elem = data[--top]（先移再取）"
          - "两套约定不能混用：top 的初值和这五个式子必须配套，混了就全错"

  - type: content
    kicker: 队列 · 定义
    title: 循环队列与假溢出
    blocks:
      - type: code
        text: |
          typedef struct{ int data[MaxSize]; int rear, front; }SqQueue;
          bool InitQueue(SqQueue &Q){ Q.front = 0; Q.rear = 0; return true; }
      - type: bullets
        items:
          - "队列一端进（rear）一端出（front）；用数组存时，front 往后走会腾出前面的空间"
          - "假溢出：rear 走到数组末尾就以为满了，可前面出队腾出的格子还空着，用不上"
          - "解决办法是让下标绕回去，rear 到末尾就回到 0，这就是循环队列，靠取模 % MaxSize 实现"

  - type: content
    kicker: 循环队列 · 判满三策略
    title: 判满三策略：rear==front 既是空又是满，怎么分
    blocks:
      - type: table
        head: [策略, 判空, 判满, 代价]
        colW: [2.8, 2.8, 3.5, 2.4]
        rows:
          - [牺牲一单元, rear==front, (rear+1)%MaxSize==front, 少存一个]
          - [加 size 字段, size==0, size==MaxSize, 入出队都维护 size]
          - [加 tag 字段, front==rear 且 tag==0, front==rear 且 tag==1, 入队追上时 tag 置1]
      - type: note
        text: "根源是 rear==front 分不清空还是满；本课程统一用牺牲一单元，最简单、不加字段"

  - type: content
    kicker: 循环队列 · 过程页
    title: MaxSize=5 的循环队列走一圈（拿纸跟着画）
    blocks:
      - type: diagram
        diagram: array
        cells: ["", "", c, d, e]
        indices: true
        highlight: [4]
        pointers:
          - label: front=2
            index: 2
            position: above
          - label: rear=0
            index: 0
            position: below
        w: 8
        h: 1.5
        align: center
      - type: bullets
        items:
          - "① 初始 front=rear=0，队空"
          - "② 入队 a、b、c、d，rear 移到 4，元素占下标 0到3；(rear+1)%5=0==front 判满，下标4那格空着也不能用，这就是牺牲的一单元"
          - "③ 出队 a、b，front 移到 2，队里剩 c、d；(rear+1)%5=0≠front=2，不再满，又能入队"
          - "④ 再入队 e，放进 data[4]，rear=(4+1)%5=0 绕回开头；现在 front=2、rear=0，队里是 c、d、e"
      - type: note
        text: "你亲眼看到三件事：rear 从 4 绕回 0；(rear+1)%5==front 时还空一格却判满（牺牲的那格）；front 追上 rear 就是空"

  - type: content
    kicker: 循环队列 · 入队出队
    title: EnQueue 与 DeQueue：先判满、再操作、取模移动
    blocks:
      - type: code
        text: |
          bool EnQueue(SqQueue &Q, int elem){
              if((Q.rear+1)%MaxSize == Q.front) return false;         // 判满
              Q.data[Q.rear]=elem;  Q.rear=(Q.rear+1)%MaxSize;  return true;  // 先放再移 rear
          }
          bool DeQueue(SqQueue &Q, int &elem){
              if(Q.rear == Q.front) return false;                     // 判空
              elem=Q.data[Q.front];  Q.front=(Q.front+1)%MaxSize;  return true;  // 先取再移 front
          }
      - type: note
        text: "入队 rear 指的是下一个空位，所以先放再移；出队 front 指的是队头元素，所以先取再移；移动都要 % MaxSize 才能绕回"

  - type: content
    kicker: 链栈与链队
    title: 链栈、链队：用链表实现
    blocks:
      - type: bullets
        items:
          - "链栈用单链表，栈顶就是表头：入栈等于头插，出栈等于删第一个结点"
          - "链栈不需要判满（内存够就能压），只需判空 L->next==NULL；这是它和顺序栈的一个区别"
          - "链队要 front 和 rear 两个指针：入队在 rear 后接，出队从 front 删；只有一个指针的话入队要走到尾"
      - type: note
        text: "链栈链队 802 考得少，理解'栈顶在表头、入栈即头插'即可；链队不带头结点时队空是 front==NULL"

  - type: content
    kicker: 栈与递归
    title: 栈和递归的关系
    blocks:
      - type: bullets
        items:
          - "C 语言强化阶段画过 fact(3) 的调用栈，一层层展开再一层层收回，那就是系统在帮你用栈"
          - "这一节讲的是你自己用一个栈；后面二叉树的非递归遍历，就是把递归的栈搬到代码里显式管理"
          - "所以栈是强化阶段大量算法的工具：括号匹配、表达式求值、非递归遍历都靠它"
      - type: note
        text: "队列是另一类工具：层序遍历、广度优先搜索、拓扑排序都要用队列排队"

  - type: content
    kicker: 本节小结
    title: 栈与队列小结
    blocks:
      - type: bullets
        items:
          - "顺序栈：top=-1 约定下，入栈 data[++top]、出栈 data[top--]、判空 top==-1、判满 top==MaxSize-1、长度 top+1"
          - "top=0 约定五个式子全变，两套不能混用"
          - "循环队列：牺牲一单元，判空 rear==front、判满 (rear+1)%MaxSize==front、长度 (rear-front+MaxSize)%MaxSize"
          - "判满三策略（牺牲单元、加 size、加 tag）是填空常考点"
      - type: note
        text: "栈和队列本身简单，考点全在 top 约定与循环队列判满；它们是强化阶段算法的工具"

  - type: content
    kicker: 课后任务
    title: 1道跟练 ＋ 1道模仿
    blocks:
      - type: bullets
        items:
          - "**跟练题**：默写 SqStack 与 SqQueue 的定义和全部基本操作，并写出判满三策略的三个判满条件式"
          - "**模仿题**：题集勾画 3算15 同类——循环队列牺牲一单元、MaxSize=6，已知 front=1、rear=0，问队里有几个元素、是否已满，再入队一个 front、rear 各是多少"
      - type: note
        text: "默写要求：合上资料能写出栈队定义与操作、三个判满式；参考答案在本PPT最后两页，课后自行对照"

  - type: content
    kicker: 参考答案 · 跟练题
    title: 跟练题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          typedef struct{ int data[MaxSize]; int top; }SqStack;
          Push: if(top==MaxSize-1) 满; data[++top]=elem;
          Pop : if(top==-1) 空; elem=data[top--];
          判空 top==-1; 判满 top==MaxSize-1; 长度 top+1;
          typedef struct{ int data[MaxSize]; int rear, front; }SqQueue;
          EnQueue: if((rear+1)%MaxSize==front) 满; data[rear]=elem; rear=(rear+1)%MaxSize;
          DeQueue: if(rear==front) 空; elem=data[front]; front=(front+1)%MaxSize;
      - type: note
        text: "判满三策略：牺牲一单元 (rear+1)%MaxSize==front；加 size 则 size==MaxSize；加 tag 则 front==rear 且 tag==1"

  - type: content
    kicker: 参考答案 · 模仿题
    title: 模仿题参考答案（自行对照）
    blocks:
      - type: text
        text: "循环队列牺牲一单元、MaxSize=6，front=1、rear=0。"
      - type: bullets
        items:
          - "元素个数 = (rear-front+MaxSize)%MaxSize = (0-1+6)%6 = 5，队里有5个元素"
          - "判满：(rear+1)%MaxSize = (0+1)%6 = 1 == front，成立，所以队已满（牺牲一单元，最多存5个）"
          - "已满就不能再入队，EnQueue 返回 false；front、rear 不变，仍是 front=1、rear=0"
