meta:
  id: C2-A-02
  title: 顺序表
  stage: A基础
  instructor: 牙膏学长
  duration: 40min

slides:
  - type: cover
    kicker: 重邮802 数据结构代码课程
    title: 数据结构基础阶段
    subtitle: 第2节 顺序表
    meta: 阶段：基础 ｜ 主讲：牙膏学长 ｜ 预计40分钟 ｜ 资料答疑：伴梦研途QQ群

  - type: content
    kicker: 引题
    title: 数组能存一串数，为什么还要包一层结构体
    blocks:
      - type: code
        text: |
          int data[100];        // 一个数组，最多存100个数
          // 问题是：现在到底存了几个？数组自己不说
      - type: bullets
        items:
          - "开了100格，可能只用了5格，数组不会告诉你用了几个"
          - "插入、删除、查找都要先知道当前有几个元素，这个数得自己记"
          - "把数组和这个计数打包进一个结构体，就是顺序表"
      - type: note
        text: "顺序表是第一个正式的数据结构；学一个结构就是这几步——定义、初始化、查找、插入、删除、复杂度，后面每个结构都照这个路子走"

  - type: content
    kicker: 顺序表的定义
    title: 静态顺序表：一个数组加一个计数
    blocks:
      - type: code
        text: |
          #define MaxSize 1000
          typedef struct{
              int data[MaxSize];    // 存数据的数组
              int length;           // 当前存了几个
          }SqList;
      - type: bullets
        items:
          - "data 是真正存元素的数组，MaxSize 是它最多能装多少，编译时就定死了"
          - "length 是当前实际存了几个，随插入删除变化"
          - "MaxSize 是容量、length 是个数，两个是两回事，别混"

  - type: content
    kicker: 顺序表的定义
    title: 动态顺序表：数组改成指针，容量运行时定
    blocks:
      - type: code
        text: |
          typedef struct{
              int *data;            // 指向 malloc 出来的那片内存
              int MaxSize, length;  // 容量和个数都存进结构体
          }SeqList;
      - type: bullets
        items:
          - "静态版 MaxSize 写死在宏里；动态版 MaxSize 是一个字段，运行时由初始化的参数决定"
          - "所以动态版要把 MaxSize 存进结构体，data 是指针，指向 malloc 出来的连续内存"
      - type: note
        text: "malloc 和判空在C语言强化阶段讲过；本节基本操作用静态版 SqList 写，动态版思路一样，只差 data 是指针"

  - type: content
    kicker: 基本操作 · 初始化
    title: 初始化：静态清零，动态先 malloc 再判空
    blocks:
      - type: code
        text: |
          bool InitList(SqList &L){                    // 静态版
              for(int i = 0; i < MaxSize; i++) L.data[i] = 0;
              L.length = 0;  return true;
          }
          bool InitList(SeqList &L, int InitSize){     // 动态版
              L.data = (int *)malloc(sizeof(int) * InitSize);
              if(L.data == NULL) return false;         // 申请失败要判空
              L.length = 0;  L.MaxSize = InitSize;  return true;
          }
      - type: bullets
        items:
          - "参数写成 SqList &L，这个 & 是让函数改得动外面那个表：不带 &，改的只是副本，调用处的表根本没被初始化"
          - "动态版 malloc 之后必须判空，申请失败返回 false"

  - type: content
    kicker: 基本操作 · 按值查找
    title: LocateElem：找到返回位序，找不到返回 -1
    blocks:
      - type: code
        text: |
          int LocateElem(SqList &L, int key){
              for(int i = 0; i < L.length; i++)
                  if(L.data[i] == key) return i + 1;   // 返回位序
              return -1;                                // 没找到
          }
      - type: bullets
        items:
          - "顺序表属线性表，数据从 data[0] 开始存，第 i 个元素就在 data[i-1]，下标从0起"
          - "循环里 i 是下标，从0扫到 length-1；命中返回 i+1，因为题目问的是第几个，位序从1数起"
          - "i 和 i+1 的差别是程序阅读题的常考陷阱，看代码时盯住返回的是下标还是位序"

  - type: content
    kicker: 基本操作 · 按位插入
    title: ListInsert：两个范围判断，从后往前挪
    blocks:
      - type: code
        text: |
          bool ListInsert(SqList &L, int i, int elem){
              if(i < 1 || i > L.length + 1) return false;   // 位序范围 1..length+1
              if(L.length >= MaxSize) return false;          // 容量已满
              for(int j = L.length; j >= i; j--) L.data[j] = L.data[j-1];
              L.data[i-1] = elem;  L.length++;  return true;
          }
      - type: bullets
        items:
          - "位序范围 1 到 length+1：能插在最后一个元素后面，所以上界是 length+1"
          - "挪动从后往前，从前往后会覆盖掉还没搬走的数"
          - "elem 写进 data[i-1]：位序 i 对应下标 i-1"

  - type: content
    kicker: 插入过程推演
    title: 在第3位插入25：逐格看元素怎么挪（拿纸跟着画）
    blocks:
      - type: diagram
        diagram: array
        cells: [10, 20, 30, 40, 50, ""]
        indices: true
        highlight: [2]
        pointers:
          - label: length=5
            index: 5
            position: below
        w: 8
        h: 1.3
        align: center
      - type: bullets
        items:
          - "① 画 data[0] 到 data[4] 存 10、20、30、40、50，length=5；现在要在第3位插25"
          - "② 两个判断先过：位序3在1到6之间、length=5没到容量，都通过"
          - "③ 从 j=5 往后挪：data[5]=data[4]=50，data[4]=data[3]=40，data[3]=data[2]=30，每挪一步画一次"
          - "④ 腾出 data[2] 写进25，length 变6；结果是 10、20、25、30、40、50"
      - type: note
        text: "盯着 j 从5减到3，看每一格怎么往后让位，这就是从后往前挪的过程"

  - type: content
    kicker: 基本操作 · 按位删除
    title: ListDelete：elem 用引用带出，从前往后挪
    blocks:
      - type: code
        text: |
          bool ListDelete(SqList &L, int i, int &elem){
              if(i < 1 || i > L.length) return false;   // 位序范围 1..length
              elem = L.data[i - 1];                      // 用引用把删掉的值带出去
              for(int j = i; j < L.length; j++) L.data[j-1] = L.data[j];
              L.length--;  return true;
          }
      - type: bullets
        items:
          - "位序范围 1 到 length：删的是已有元素，上界是 length 不是 length+1"
          - "elem 前面也有 &，要把删掉的值带回调用处，这是引用传出的用途"
          - "挪动从前往后，跟插入正好相反"

  - type: content
    kicker: 复杂度 · 检查页
    title: 先自己算：删一个元素挪几格
    blocks:
      - type: text
        text: "先别看下面，自己算：length=4 的表 10、20、25、30，删掉第2个，删完表是什么、elem 多少、挪了几格？"
      - type: bullets
        items:
          - "删完是 10、25、30，elem=20，挪了 2 格（25、30 各往前一格）"
          - "一般地：删除第 i 位挪 n-i 格，插入第 i 位挪 n-i+1 格"
          - "等概率平均：插入挪 n/2、删除挪 (n-1)/2，都是 O(n)；只有末尾插删是 O(1)"
      - type: note
        text: "平均移动次数是填空与综合应用常考点，要能说清 n/2 与 (n-1)/2 是怎么算出来的"

  - type: content
    kicker: 本节小结
    title: 顺序表五个函数一张表
    blocks:
      - type: table
        head: [函数, 关键动作, 范围或返回]
        colW: [2.5, 5.5, 3.5]
        rows:
          - [InitList, 静态清零、动态 malloc 判空, length 归 0]
          - [LocateElem, 从头扫，命中返回位序, 返回 i+1，找不到 -1]
          - [ListInsert, "从后往前挪，写 data[i-1]", 位序 1 到 length+1]
          - [ListDelete, 引用带出，从前往后挪, 位序 1 到 length]
          - [复杂度, 插入删除都要挪元素, 平均 O(n)]
      - type: note
        text: "合上资料能默写这五个函数，这一节就过关；后面的结构也按定义、初始化、增删查、复杂度这个路子学"

  - type: content
    kicker: 课后任务
    title: 1道跟练 ＋ 1道模仿
    blocks:
      - type: bullets
        items:
          - "**跟练题**：默写 SqList 定义、InitList（静态版）、ListInsert、ListDelete，各写一句合法范围的判断依据"
          - "**模仿题**：题集 2算15——顺序表就地逆置，用原表的存储空间把 (a1,a2,…,an) 反转成 (an,…,a2,a1)，空间要 O(1)"
      - type: note
        text: "默写要求：合上资料能写出 SqList 定义和这四个函数；参考答案在本PPT最后两页，课后自行对照"

  - type: content
    kicker: 参考答案 · 跟练题
    title: 跟练题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          #define MaxSize 1000
          typedef struct{ int data[MaxSize]; int length; }SqList;
          bool InitList(SqList &L){
              for(int i=0;i<MaxSize;i++) L.data[i]=0;  L.length=0;  return true;
          }
          bool ListInsert(SqList &L, int i, int elem){
              if(i<1 || i>L.length+1) return false;   // 位序 1..length+1
              if(L.length >= MaxSize) return false;
              for(int j=L.length;j>=i;j--) L.data[j]=L.data[j-1];
              L.data[i-1]=elem;  L.length++;  return true;
          }
      - type: note
        text: "ListDelete 同理：范围 1..length，elem 用 & 带出，从前往后挪；合法范围插入上界 length+1、删除上界 length"

  - type: content
    kicker: 参考答案 · 模仿题
    title: 模仿题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          // 思想：首尾对称交换，i 从头走到中间，每次和末尾对称位置交换
          void Reverse(SqList &L){
              for(int i = 0; i < L.length / 2; i++){
                  int t = L.data[i];
                  L.data[i] = L.data[L.length - 1 - i];
                  L.data[L.length - 1 - i] = t;
              }
          }
      - type: bullets
        items:
          - "复杂度：时间 O(n)，交换了 n/2 对；空间 O(1)，只用一个临时变量 t，没另开数组"
          - "就地逆置的关键是借原表空间，只用一个临时变量，不能新开一个数组"
