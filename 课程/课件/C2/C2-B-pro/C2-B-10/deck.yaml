  title: 10算12 插入建堆参考代码
  blocks:
  - &id012
    type: code
    text: |
      // H[1..len] 是大根堆，假设数组还有空位
      void InsertMaxHeap(int H[], int &len, int x){
          int i = ++len;
          while(i > 1 && H[i/2] < x){
              H[i] = H[i/2];
              i /= 2;
          }
          H[i] = x;
      }
    size: 14
  - &id013
    type: bullets
    items:
    - 新关键字先放到末尾，再沿父结点上移；父结点不小于新值时停止。
    - 单次插入 O(log n)；与自底向上建堆的 O(n) 不同，不能混为一种建堆过程。
