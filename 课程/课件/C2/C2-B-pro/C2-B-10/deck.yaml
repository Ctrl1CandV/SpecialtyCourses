- type: content
  kicker: 逆序对 · 模板10
  title: 逆序对：补全 merge 函数，统计跨段计数
  blocks:
  - &id010
    type: code
    text: |
      // A[left..mid] 与 A[mid+1..right] 已分别有序
      int merge(int A[], int temp[], int left, int mid, int right){
          for(int t = left; t <= right; t++) temp[t] = A[t];
          int i = left, j = mid + 1, k = left, count = 0;
          while(i <= mid && j <= right){
              if(temp[i] <= temp[j]) A[k++] = temp[i++];
              else{
                  count += mid - i + 1; // 左段剩余元素都大于 temp[j]
                  A[k++] = temp[j++];
              }
          }
          while(i <= mid) A[k++] = temp[i++];
          while(j <= right) A[k++] = temp[j++];
          return count;
      }
    size: 11
  - &id011
    type: bullets
    items:
    - 先复制当前区间；i、j 扫描左右有序段，k 指向写回位置。
    - 右段元素较小时，左段从 i 到 mid 都与它构成逆序对；merge 返回跨段数量，MergeSort 再加上左右子段的数量。
    size: 15
  layout: split
  leftWidth: 7.6
  columns:
  - - *id010
  - - *id011
