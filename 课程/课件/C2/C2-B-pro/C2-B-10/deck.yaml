- type: content
  kicker: 简单选择
  title: 简单选择：哨兵位存的是下标，不是值
  blocks:
  - &id001
    type: code
    text: "void SelectSort(SqList &L){                   // 数据存 L.data[1..length]\n    for(int i = 1; i < L.length; i++){\n        L.data[0]\
      \ = i;                        // 哨兵位存当前最小值的下标\n        for(int j = i+1; j <= L.length; j++)\n            if(L.data[j] < L.data[L.data[0]])\
      \ L.data[0] = j;\n        if(L.data[0] != i){ int tmp = L.data[i];\n            L.data[i] = L.data[L.data[0]];  L.data[L.data[0]]\
      \ = tmp; }\n    }\n}\n"
    size: 11
  - type: bullets
    items: &id002
    - A[0] 存当前最小值的下标 i；比较时用 L.data[L.data[0]] 取对应值。
    - 最后一趟只剩一个元素，不必再找最小值；找到最小值时仍须扫描到 length。
    size: 12.5
  - &id003
    type: note
    text: 时间 O(n²)、空间 O(1)；交换可能改变相同值的相对次序，因此不稳定。
    size: 11
