- type: content
  kicker: 堆排序 · HeapAdjust
  title: HeapAdjust 逐行：哨兵存待下沉结点，选较大的孩子
  blocks:
  - type: code
    text: "void HeapAdjust(int arr[], int k, int len){   // 把 arr[k] 往下沉到合适位置\n    arr[0] = arr[k];                          // 哨兵存待下沉的结点\n\
      \    for(int i = 2*k; i <= len; i *= 2){       // i 从 k 的左孩子起，每轮翻倍到下一层\n        if(i < len && arr[i+1] > arr[i]) i++; // 选较大的孩子（i<len\
      \ 防越界）\n        if(arr[0] >= arr[i]) break;           // 已不小于孩子，到位\n        arr[k] = arr[i];                      // 大孩子上移\n \
      \       k = i;                                // 继续往下比\n    }\n    arr[k] = arr[0];                          // 哨兵里的值落到最终位置\n\
      }\n"
    size: 12
  - type: bullets
    items:
    - 四个关键点：① i*=2 是往下一层不是逐个遍历；② i<len 防止只有左孩子时读 arr[i+1] 越界；③ arr[0]>=arr[i] 就 break（大根堆只要求父不小于子）；④ 循环结束哨兵值落位
  - type: note
    text: 时间 O(logn)（树高）；题集 10选22、10选30 可用于练习下标关系和结点下沉过程
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "void HeapAdjust(int arr[], int k, int len){   // 把 arr[k] 往下沉到合适位置\n    arr[0] = arr[k];                          // 哨兵存待下沉的结点\n\
        \    for(int i = 2*k; i <= len; i *= 2){       // i 从 k 的左孩子起，每轮翻倍到下一层\n        if(i < len && arr[i+1] > arr[i]) i++; // 选较大的孩子（i<len\
        \ 防越界）\n        if(arr[0] >= arr[i]) break;           // 已不小于孩子，到位\n        arr[k] = arr[i];                      // 大孩子上移\n\
        \        k = i;                                // 继续往下比\n    }\n    arr[k] = arr[0];                          // 哨兵里的值落到最终位置\n\
        }\n"
      size: 11
