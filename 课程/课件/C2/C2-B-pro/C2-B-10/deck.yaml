- type: content
  kicker: 堆排序 · 建堆与主循环
  title: 建堆为什么从 len/2 开始，排序主循环
  blocks:
  - &id007
    type: code
    text: "void HeapSort(int arr[], int len){\n    if(arr == NULL || len <= 1) return;\n    for(int i = len/2; i > 0; i--) HeapAdjust(arr,\
      \ i, len);  // 建堆\n    while(len > 1){\n        int tmp = arr[1]; arr[1] = arr[len]; arr[len] = tmp; // 堆顶与末尾交换\n        HeapAdjust(arr,\
      \ 1, --len);                           // 剩下 len-1 个重调\n    }\n}\n"
    size: 11
  - type: bullets
    items: &id008
    - len/2 是最后一个非叶结点；更大的下标都是叶子，不需调整。
    - 从 len/2 倒序下沉，处理父结点时两棵子树已是堆。
    - 排序每轮交换根与末尾，len 减1后重新调整根。
    size: 12.5
  - &id009
    type: note
    text: 时间 O(nlogn)、空间 O(1)、不稳定。
    size: 11
  layout: split
  leftWidth: 7.2
  columns:
  - - *id007
  - - type: bullets
      items: *id008
      size: 12.5
    - *id009
- type: content
  kicker: 二路归并 · Merge
  title: Merge：三个指针、两个收尾循环、取等号保稳定
  blocks:
  - type: code
    text: "void Merge(SqList &L, SqList &T, int low, int mid, int high){\n    int p = low, q = mid+1, k = low;\n    while(p <= mid &&\
      \ q <= high){\n        if(L.data[p] <= L.data[q]) T.data[k++] = L.data[p++];  // 取等号保稳定\n        else T.data[k++] = L.data[q++];\n\
      \    }\n    while(p <= mid) T.data[k++] = L.data[p++];    // 收尾两个循环\n    while(q <= high) T.data[k++] = L.data[q++];\n    for(int\
      \ i = low; i <= high; i++) L.data[i] = T.data[i];  // 拷回\n}\n"
    size: 12
  - type: bullets
    items:
    - 三个指针：p 扫左半段 [low,mid]、q 扫右半段 [mid+1,high]、k 写辅助表 T；谁小取谁，取完一段另一段整体收尾
    - <= 保证稳定性：相等时先取左半段的，相同值的相对次序不变——写成 < 就不稳定了
  - type: note
    text: 两个收尾循环不能只写一个：p 与 q 谁没走完就接谁；最后把 T 拷回 L 的 [low,high]
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "void Merge(SqList &L, SqList &T, int low, int mid, int high){\n    int p = low, q = mid+1, k = low;\n    while(p <= mid\
        \ && q <= high){\n        if(L.data[p] <= L.data[q]) T.data[k++] = L.data[p++];  // 取等号保稳定\n        else T.data[k++] = L.data[q++];\n\
        \    }\n    while(p <= mid) T.data[k++] = L.data[p++];    // 收尾两个循环\n    while(q <= high) T.data[k++] = L.data[q++];\n    for(int\
        \ i = low; i <= high; i++) L.data[i] = T.data[i];  // 拷回\n}\n"
      size: 11
  - - type: bullets
      items:
      - 三个指针：p 扫左半段 [low,mid]、q 扫右半段 [mid+1,high]、k 写辅助表 T；谁小取谁，取完一段另一段整体收尾
      - <= 保证稳定性：相等时先取左半段的，相同值的相对次序不变——写成 < 就不稳定了
      size: 13
    - type: note
      text: 两个收尾循环不能只写一个：p 与 q 谁没走完就接谁；最后把 T 拷回 L 的 [low,high]
      size: 12
- type: content
  kicker: 二路归并 · MergeSort
  title: MergeSort 递归式与复杂度推导
  blocks:
  - type: code
    text: "void MergeSort(SqList &L, SqList &T, int low, int high){\n    if(low < high){\n        int mid = (low + high) / 2;\n    \
      \    MergeSort(L, T, low, mid);        // 排左半\n        MergeSort(L, T, mid+1, high);     // 排右半\n        Merge(L, T, low, mid,\
      \ high);      // 合并\n    }\n}\n"
    size: 12
  - type: bullets
    items:
    - 递归式 T(n)=2T(n/2)+O(n)：用基础阶段第1节教的逐层累加——每层合并总代价 O(n)，共 logn 层，所以 O(nlogn)
    - 时间与初始序列无关（不管乱不乱都要合并 logn 层）；空间 O(n) 是辅助表 T；稳定
  - type: note
    text: 这个递归式与快排的平均情况同形，但归并的最坏也是 O(nlogn)，快排最坏会退化到 O(n²)
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "void MergeSort(SqList &L, SqList &T, int low, int high){\n    if(low < high){\n        int mid = (low + high) / 2;\n  \
        \      MergeSort(L, T, low, mid);        // 排左半\n        MergeSort(L, T, mid+1, high);     // 排右半\n        Merge(L, T, low,\
        \ mid, high);      // 合并\n    }\n}\n"
      size: 11
  - - type: bullets
      items:
      - 递归式 T(n)=2T(n/2)+O(n)：用基础阶段第1节教的逐层累加——每层合并总代价 O(n)，共 logn 层，所以 O(nlogn)
      - 时间与初始序列无关（不管乱不乱都要合并 logn 层）；空间 O(n) 是辅助表 T；稳定
      size: 13
