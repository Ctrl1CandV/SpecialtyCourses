<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:2218px;height:726px;background:transparent;position:relative;overflow:visible;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
.el{position:absolute}
.codepanel{background:F7F9FC;border-radius:2px}
.codebar{position:absolute;left:0;top:0;width:11px;height:100%;background:1F4E9C}
.coderows{position:absolute;left:26px;top:14px;right:10px;bottom:10px;font-family:Consolas,'Courier New',monospace;color:1F2329;white-space:pre}
.cl{min-height:1em}
.cfocus{background:FFF3CD;box-shadow:0 0 0 2px FFF3CD}
.lnode{display:flex;position:absolute;border-radius:3px;overflow:hidden}
.lnode-cell{display:flex;align-items:center;justify-content:center;height:100%;font-size:34px;font-family:'Microsoft YaHei','微软雅黑',sans-serif;border-right:2px solid #D8DBE0}
.lnode-cell:last-child{border-right:none}
.lhead-tag{position:absolute;font-size:20px;color:#8A9099;text-align:center}
.cellbox{position:absolute;border:3px solid #1F4E9C;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;color:1F2329}
.cellidx{position:absolute;text-align:center;font-size:22px;color:#8A9099}
.gridcell{position:absolute;border:3px solid #1F4E9C;background:#fff}
.gridlab{position:absolute;display:flex;align-items:center;justify-content:center;font-size:24px;color:#8A9099}
.tnode{position:absolute;border:3px solid #1F4E9C;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;color:1F2329;font-weight:600}
.panel{border-radius:6px}
.panel-title{position:absolute;left:18px;top:10px;font-size:24px;font-weight:700}
.chip{display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:700;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
.wlabel{position:absolute;text-align:center;font-size:30px;font-weight:700;color:#1F4E9C;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
.legend-item{position:relative;display:flex;align-items:center;gap:10px;color:1F2329}
.sw{display:inline-block;width:26px;height:26px;border:2px solid #1F4E9C}
.arrowsym{position:absolute;text-align:center;font-size:24px;font-weight:700;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
</style></head><body><div class="el" style="left:0;top:0;width:100%;height:100%"><div style="width:100%;height:100%;box-sizing:border-box;padding:23px 27px;background:#F7F9FC;border:1px solid #D8DEE8;border-radius:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden;font-family:Arial,'Microsoft YaHei',sans-serif;color:#1F2329">

cx="570" cy="260" r="27" fill="#E8EEF9" stroke="#1F4E9C" stroke-width="4"/><text x="570" y="270" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#173B77">6</text></svg></section><section style="background:#FFFFFF;border:1px solid #D8DEE8;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;min-height:150px;box-sizing:border-box"><div style="font-size:27px;color:#1F4E9C;font-weight:700;margin-bottom:15px">队列与边界</div><div style="font-size:28px;line-height:1.55">当前层队列：4，5，6<br>下一层：空<br>front 越过 last：本层完成</div><div style="font-size:25px;line-height:1.3;color:#515B68;margin-top:14px">4、5、6出队后无新孩子；最大宽度更新为3。</div></section></div>
<div style="padding:12px 16px;background:#E8EEF9;border-radius:10px;font-size:25px;line-height:1.2;font-weight:600;color:#243B5A">4、5、6出队后无新孩子；最大宽度更新为3。</div></div></div><script>
window.addEventListener('load',()=>{
  const out=[];

  if(document.body.scrollHeight>document.body.clientHeight+1) out.push('body-h:'+document.body.scrollHeight+'>'+document.body.clientHeight);
  document.title='AUDIT|'+(out.length?out.join(';'):'OK');
  const t=document.createElement('div');t.id='audit-result';t.textContent='AUDIT|'+(out.length?out.join(';'):'OK');t.style.display='none';
  document.body.appendChild(t);
