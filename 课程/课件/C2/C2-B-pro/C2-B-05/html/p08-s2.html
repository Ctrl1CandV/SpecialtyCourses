330" cy="305" r="27" fill="#E8EEF9" stroke="#1F4E9C" stroke-width="4"/><text x="330" y="315" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="28" font-weight="700" fill="#173B77">6</text></svg></section><section style="background:#FFFFFF;border:1px solid #D8DEE8;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;min-height:150px;box-sizing:border-box"><div style="font-size:27px;color:#1F4E9C;font-weight:700;margin-bottom:15px">数组状态</div><div style="font-size:29px;line-height:1.6">path：1 → 2 → 4 → 6<br>pathLen：4<br>maxPath：1 → 2 → 4 → 6<br>maxLen：4</div><div style="font-size:25px;line-height:1.3;color:#515B68;margin-top:14px">path=[1,2,4,6]，pathLen=4；超过maxLen，复制到maxPath。</div></section></div>
<div style="padding:12px 16px;background:#E8EEF9;border-radius:10px;font-size:25px;line-height:1.2;font-weight:600;color:#243B5A">path=[1,2,4,6]，pathLen=4；超过maxLen，复制到maxPath。</div></div></div><script>
window.addEventListener('load',()=>{
  const out=[];
  if(document.body.scrollWidth>document.body.clientWidth+1) out.push('body-w:'+document.body.scrollWidth+'>'+document.body.clientWidth);
  if(document.body.scrollHeight>document.body.clientHeight+1) out.push('body-h:'+document.body.scrollHeight+'>'+document.body.clientHeight);
  document.title='AUDIT|'+(out.length?out.join(';'):'OK');
  const t=document.createElement('div');t.id='audit-result';t.textContent='AUDIT|'+(out.length?out.join(';'):'OK');t.style.display='none';
  document.body.appendChild(t);
});
