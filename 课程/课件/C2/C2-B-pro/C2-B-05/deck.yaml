- type: content
  kicker: 参考答案 · 跟练题
  title: 跟练题参考答案：求宽度与判 BST（自行对照）
  blocks:
  - type: code
    text: "// 求树宽度：层序用 last 结算每一层\nint Width(BiTree T){\n if(!T) return 0;\n BiTree Q[N]; int f=0,r=0,last=0,c=0,best=0;\n Q[r++]=T;\n\
      \ while(f<r){\n  BiTree p=Q[f++]; ++c;\n  if(p->lchild) Q[r++]=p->lchild;\n  if(p->rchild) Q[r++]=p->rchild;\n  if(f>last){ best=max(best,c);\
      \ c=0; last=r-1; }\n }\n return best;\n}"
    size: 10.5
  - type: code
    text: "// 判 BST：中序必须严格递增\nbool checkBST(BiTNode *p, int &prev, bool &hasPrev){\n if(!p) return true;\n if(!checkBST(p->lchild,prev,hasPrev))\
      \ return false;\n if(hasPrev && p->data<=prev) return false;\n prev=p->data; hasPrev=true;\n return checkBST(p->rchild,prev,hasPrev);\n\
      }\nbool JudgeBST(BiTree T){ int prev; bool seen=false; return checkBST(T,prev,seen); }"
