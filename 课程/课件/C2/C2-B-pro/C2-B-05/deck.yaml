      text: "int prosperity(BiTree T){\n    if(T == NULL) return 0;\n    int front = 0, rear = -1, last = 0, height = 1, width = 0,\
        \ totalProsper = 0;\n    BiTree Q[MaxSize]; BiTree p;  Q[++rear] = T;\n    while(front <= last){                        // 外层统一用\
        \ last\n        p = Q[front++]; width++;\n        if(p->lchild != NULL) Q[++rear] = p->lchild;\n        if(p->rchild != NULL)\
        \ Q[++rear] = p->rchild;\n        if(front > last){ totalProsper += height * width;  // 层号乘本层结点数\n            last = rear; height++;\
        \ width = 0; } }\n    return totalProsper;\n}\n"
      size: 11
  - - type: bullets
