- type: content
  badge: 真题·2024
  kicker: 繁荣度 · 模板6
  title: 繁荣度：求宽度的代码改三处，层号从 1 起
  blocks:
  - type: code
    text: "int prosperity(BiTree T){\n    if(T == NULL) return 0;\n    int front = 0, rear = -1, last = 0, height = 1, width = 0, totalProsper\
      \ = 0;\n    BiTree Q[MaxSize]; BiTree p;  Q[++rear] = T;\n    while(front <= last){                        // 外层统一用 last\n   \
      \     p = Q[front++]; width++;\n        if(p->lchild != NULL) Q[++rear] = p->lchild;\n        if(p->rchild != NULL) Q[++rear]\
      \ = p->rchild;\n        if(front > last){ totalProsper += height * width;  // 层号乘本层结点数\n            last = rear; height++; width\
      \ = 0; } }\n    return totalProsper;\n}\n"
    size: 11
  - type: bullets
    items:
    - 繁荣度是各层“层号 × 结点数”的总和。
    - 沿用宽度算法，只需记录层号并在层结束时累加。
    - 层号从 1 开始，按题目给出的定义取值。
  layout: split
  leftWidth: 8.0
  columns:
