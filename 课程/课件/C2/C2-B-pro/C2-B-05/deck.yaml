- type: content
  badge: 真题·2024
  kicker: 判 BST · 思路
  title: 判 BST：中序加 prev，prev 必须引用
  blocks:
  - type: bullets
    items:
    - BST 的性质：中序遍历序列严格递增；判 BST 就是查中序序列是不是严格递增
    - 做法：中序遍历时用 prev 记住上一个访问的值，当前值不大于 prev 就不是 BST
    - 为什么用中序不用先序：只有中序序列对 BST 是有序的，先序无序
    - prev 必须引用：它跨递归层共享，上一层写完，下一层要读
    - 先想一步：prev 的初值写 -1 行不行？树里出现负数会怎样？
- type: content
  kicker: 判 BST · 代码
  title: 判 BST：中序递增；用标记避免初值边界漏洞
  blocks:
  - type: code
    text: "bool checkBST(BiTNode *p, int &prev, bool &hasPrev){\n    if(p == NULL) return true;\n    if(!checkBST(p->lchild, prev, hasPrev))\
      \ return false;\n    if(hasPrev && p->data <= prev) return false;\n    prev=p->data; hasPrev=true;\n    return checkBST(p->rchild,\
      \ prev, hasPrev);\n}\nbool JudgeBST(BiTree T){ int prev; bool hasPrev=false; return checkBST(T,prev,hasPrev); }"
    size: 10.5
  - type: bullets
    items: &id001
    - 先定义 checkBST，再由 JudgeBST 调用。
    - hasPrev=false 表示还没有前驱；首次访问只记录值，不与固定哨兵比较。
    - 后续结点必须大于 prev，重复值也判非 BST；完整覆盖 int 范围，包括 INT_MIN。
    size: 12
  layout: split
  leftWidth: 6.9
  columns:
  - - type: code
      text: "bool checkBST(BiTNode *p, int &prev, bool &hasPrev){\n    if(p == NULL) return true;\n    if(!checkBST(p->lchild, prev,\
        \ hasPrev)) return false;\n    if(hasPrev && p->data <= prev) return false;\n    prev=p->data; hasPrev=true;\n    return checkBST(p->rchild,\
        \ prev, hasPrev);\n}\nbool JudgeBST(BiTree T){ int prev; bool hasPrev=false; return checkBST(T,prev,hasPrev); }"
      size: 10.5
  - - type: bullets
      items: *id001
      size: 12
- type: content
  kicker: 递归建树 · 模板12
  title: 由先序与中序建树：归入模板 12，只给骨架与边界
  blocks:
  - type: code
    text: "BiTree Build(BiTree &T, int A[], int B[], int preL, int preR, int inL, int inR){\n    if(preL > preR) return NULL;\n    T\
      \ = (BiTNode*)malloc(sizeof(BiTNode));\n    T->data = A[preL];                     // 先序第一个元素是根\n    int k = inL;\n    while(B[k]\
      \ != A[preL]) k++;            // 在中序中定位根\n    int leftLen = k - inL;                 // 左子树结点个数\n    Build(T->lchild, A, B, preL+1,\
      \ preL+leftLen, inL, k-1);\n    Build(T->rchild, A, B, preL+leftLen+1, preR, k+1, inR);\n    return T;\n}\n"
    size: 11
  - type: bullets
    items:
    - 根的位置由先序首元素确定；在中序中找到根后，左子树长度决定两段区间。
    - 复习四个边界：先序左右子树起点、中序左右子树终点；完整递归已在 C2-A 第7节讲过。
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "BiTree Build(BiTree &T, int A[], int B[], int preL, int preR, int inL, int inR){\n    if(preL > preR) return NULL;\n  \
        \  T = (BiTNode*)malloc(sizeof(BiTNode));\n    T->data = A[preL];                     // 先序第一个元素是根\n    int k = inL;\n    while(B[k]\
        \ != A[preL]) k++;            // 在中序中定位根\n    int leftLen = k - inL;                 // 左子树结点个数\n    Build(T->lchild, A, B,\
        \ preL+1, preL+leftLen, inL, k-1);\n    Build(T->rchild, A, B, preL+leftLen+1, preR, k+1, inR);\n    return T;\n}\n"
      size: 11
  - - type: bullets
      items:
      - 根的位置由先序首元素确定；在中序中找到根后，左子树长度决定两段区间。
      - 复习四个边界：先序左右子树起点、中序左右子树终点；完整递归已在 C2-A 第7节讲过。
      size: 13
- type: content
  kicker: 哈夫曼构造
  title: Huffman 树：反复合并当前权值最小的两棵树
  blocks:
  - type: table
    head:
    - 轮次
    - 取出
    - 合并后权值
    rows:
    - - '1'
      - 2、3
      - '5'
    - - '2'
      - 4、5
      - '9'
    - - '3'
      - 7、9
      - '16'
    rowH: 0.48
  - type: bullets
    size: 15
    items:
    - 每次合并两个最小权值，直到只剩一棵树；本节只认构造过程，不展开优先队列代码。
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "typedef struct{\n    int weight;\n    int parent, lchild, rchild;          // 存下标，0 表示没有\n}HTNode;                    \
        \             // 数组共 2n-1 个结点\n\nfor(int i = n+1; i <= 2*n-1; i++){       // 合并 n-1 次\n    SelectTwoMin(HT, i-1, s1, s2);  \
        \     // 在 parent==0 中选两个最小\n    HT[s1].parent = HT[s2].parent = i;\n    HT[i].lchild = s1;  HT[i].rchild = s2;\n    HT[i].weight\
        \ = HT[s1].weight + HT[s2].weight;\n}\n"
      size: 11
  - - type: bullets
      items:
      - 思想：森林里每次取两棵权值最小的树合并，新树权值是两棵之和，重复 n 减 1 次
      - 为什么共 2n-1 个结点：n 个叶子，每次合并少一棵树，合并 n-1 次多出 n-1 个内部结点
      - parent 等于 0 表示还没被合并；每轮扫一遍选两个最小，构造是 O(n²)，优先队列可降到 O(n log n)
      - 802 以手算为主：考的是手算构造与编码，左右分支标 0 和 1；代码不要求写，这里只记思想与存储结构
      size: 13
