- type: content
  kicker: 引题
  title: 层序遍历能干什么，last 为什么需要
  blocks:
  - type: bullets
    items:
    - 层序遍历按层访问：队列一圈一圈往外扩，数据结构基础阶段第7节已经写过
    - 它直接能答的问题：树有几层、结点总数是多少
    - 它答不了的问题：每一层有多少个结点、哪一层最宽——队列本身不知道一层到哪里结束
    - 加一个变量 last：记下当前层最右结点在队列里的下标；出队越过 last，说明本层全部出完，此时队尾 rear 就是下一层最右
    - 记住这个机制：所有按层统计的题，都是它的变体
    - 先想一步：层序队列里，凭什么判断一层已经出完了？
- type: content
  kicker: 求宽度 · 模板6
  title: 求树的宽度：四个变量分工，last 在层结束那一刻换
  blocks:
  - type: code
    text: "int Width(BiTree T){\n    if(T == NULL) return 0;\n    int front = 0, rear = -1, last = 0, temp = 0, maxwidth = 0;\n    BiTree\
      \ Q[MaxSize]; BiTree p;  Q[++rear] = T;\n    while(front <= last){                 // 终止条件用 last\n        p = Q[front++]; temp++;\n\
      \        if(p->lchild != NULL) Q[++rear] = p->lchild;\n        if(p->rchild != NULL) Q[++rear] = p->rchild;\n        if(front\
      \ > last){ last = rear;    // 本层结束：last 换成队尾\n            if(temp > maxwidth) maxwidth = temp;\n            temp = 0; } }\n  \
      \  return maxwidth;\n}\n"
    size: 11
  - type: bullets
    items:
    - 层序遍历按层计数，last 标记当前层最后一个队列位置。
    - front、rear 管队列，temp 计当前层；front 越过 last 时结算并更新 last。
    - 每个结点入队、出队各一次，时间 O(n)，队列空间 O(n)。
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "int Width(BiTree T){\n    if(T == NULL) return 0;\n    int front = 0, rear = -1, last = 0, temp = 0, maxwidth = 0;\n  \
        \  BiTree Q[MaxSize]; BiTree p;  Q[++rear] = T;\n    while(front <= last){                 // 终止条件用 last\n        p = Q[front++];\
        \ temp++;\n        if(p->lchild != NULL) Q[++rear] = p->lchild;\n        if(p->rchild != NULL) Q[++rear] = p->rchild;\n    \
        \    if(front > last){ last = rear;    // 本层结束：last 换成队尾\n            if(temp > maxwidth) maxwidth = temp;\n            temp\
        \ = 0; } }\n    return maxwidth;\n}\n"
      size: 11
  - - type: bullets
      items:
      - 层序遍历按层计数，last 标记当前层最后一个队列位置。
      - front、rear 管队列，temp 计当前层；front 越过 last 时结算并更新 last。
      - 每个结点入队、出队各一次，时间 O(n)，队列空间 O(n)。
      size: 13
