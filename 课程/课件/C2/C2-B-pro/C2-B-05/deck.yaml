      text: "// 求树宽度：层序用 last 结算每一层\nint Width(BiTree T){\n if(!T) return 0;\n BiTree Q[N]; int f=0,r=0,last=0,c=0,best=0;\n Q[r++]=T;\n\
        \ while(f<r){\n  BiTree p=Q[f++]; ++c;\n  if(p->lchild) Q[r++]=p->lchild;\n  if(p->rchild) Q[r++]=p->rchild;\n  if(f>last){\
        \ best=max(best,c); c=0; last=r-1; }\n }\n return best;\n}"
