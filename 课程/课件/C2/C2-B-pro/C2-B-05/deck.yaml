- type: content
  kicker: 递归携带信息
  title: 递归中携带额外信息：从判平衡到最长路径
  blocks:
  - type: bullets
    items:
    - 上一节的判平衡：返回值不够用时，让返回值兼报状态——平衡报高度，不平衡报 -1
    - 再进一步：信息放不进返回值，就带一个跨层共享的变量进来
    - 本节两个例子：最长路径带 path、maxPath 两个数组和 maxLen；判 BST 带 prev
    - 区分方式：每层需要独立副本时用值传递；递归各层要共享并修改数据时用引用
    - 先想一步：pathLen 与 maxLen，哪个该用引用？
- type: content
  badge: 真题·2025
  kicker: 最长路径 · 双数组
  title: 最长路径：path 记当前，maxPath 记最长
  blocks:
  - type: code
    text: "void longestPath(BiTree node, int path[], int pathLen, int maxPath[], int &maxLen){\n    if(node == NULL) return;\n    path[pathLen++]\
      \ = node->data;                      // 当前结点入路径\n    if(node->lchild == NULL && node->rchild == NULL){  // 到叶子了\n        if(pathLen\
      \ > maxLen){\n            maxLen = pathLen;\n            for(int i = 0; i < maxLen; i++) maxPath[i] = path[i];  // 拷当前路径\n   \
      \     }\n    }else{\n        longestPath(node->lchild, path, pathLen, maxPath, maxLen);\n        longestPath(node->rchild, path,\
      \ pathLen, maxPath, maxLen); }\n}\n"
    size: 11
  - type: bullets
    items:
    - path 记录当前根到叶的路径，maxPath 保存目前最长路径。
    - pathLen 按值传递，递归返回后自然恢复；最长长度和答案数组需要跨层更新。
    - 在叶子处比较长度并复制路径；时间 O(n)，两个数组空间 O(n)。
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "void longestPath(BiTree node, int path[], int pathLen, int maxPath[], int &maxLen){\n    if(node == NULL) return;\n   \
        \ path[pathLen++] = node->data;                      // 当前结点入路径\n    if(node->lchild == NULL && node->rchild == NULL){  // 到叶子了\n\
        \        if(pathLen > maxLen){\n            maxLen = pathLen;\n            for(int i = 0; i < maxLen; i++) maxPath[i] = path[i];\
        \  // 拷当前路径\n        }\n    }else{\n        longestPath(node->lchild, path, pathLen, maxPath, maxLen);\n        longestPath(node->rchild,\
        \ path, pathLen, maxPath, maxLen); }\n}\n"
      size: 11
  - - type: bullets
      items:
      - path 记录当前根到叶的路径，maxPath 保存目前最长路径。
      - pathLen 按值传递，递归返回后自然恢复；最长长度和答案数组需要跨层更新。
      - 在叶子处比较长度并复制路径；时间 O(n)，两个数组空间 O(n)。
      size: 13
- type: content
  kicker: 最长路径 · 推演
  title: 最长路径的递归过程：两个数组的内容变化（拿纸跟着画）
  blocks:
  - type: image
    src: 课程/素材/diagrams/b5-longest-tree.png
    w: 7
