- type: content
  kicker: 引题
  title: 从基础 DFS/BFS 出发，处理六类图问题
  blocks:
  - type: bullets
    items:
    - 本节六个算法全部建在数据结构基础阶段第9节的 DFS 和 BFS 上，不引入新的遍历
    - 主要看两项：visited 如何处理，函数需要额外记录什么（深度、序列或入度表）
    - 图算法大题两大形态：路径类（两点间、经过 k、长度 k）和拓扑类（排序、验证、判唯一）
    - 数据结构基础阶段第9节留了一个问题：visited 什么时候要清掉？这一节用两个版本的代码给出答案
    - 读代码时先判断基础 DFS 是否满足题意，再看需要增加哪项状态或条件
- type: content
  kicker: 判连通 · 一次性标记
  title: 判两点连通：标记打了就不撤，只问能不能到
  blocks:
  - type: code
    text: "int visited[MaxVertexNum] = {0};\nint Pathitoj(ALGraph G, int i, int j){\n    if(i == j) return 1;\n    visited[i] = 1;\n\
      \    for(ArcNode *p = G.vertices[i].firstarc; p != NULL; p = p->nextarc){\n        int k = p->adjvex;\n        if(!visited[k]\
      \ && Pathitoj(G, k, j)) return 1;\n    }\n    return 0;                       // 注意：这里不复位 visited\n}\n"
    size: 12
  - type: bullets
    items:
    - 思想：从 i 出发做 DFS，撞到 j 返回 1；所有邻居都试完还没撞到，返回 0
    - visited 是全局数组、标记后从不复位：探过到不了 j 的顶点，留着当剪枝
    - 注意：再次调用前要清零 visited，避免上次搜索留下的标记影响结果
    - 先自己想：为什么这题可以不复位 visited？想好再往下看
  layout: split
