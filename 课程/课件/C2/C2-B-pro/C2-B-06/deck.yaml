- type: content
  badge: 真题·2024
  kicker: 长度k的路径 · 带深度
  title: 长度为 k 的路径：多带一个 depth 参数，k 最大是 vexnum-1
  blocks:
  - type: bullets
    items:
    - 思想：DFS 多带一个 depth，每往下一层加 1；depth 等于 k 说明正好走出 k 条边
    - k 范围 1 到 vexnum-1：简单路径不重复顶点，k 条边需 k+1 个不同顶点
    - 每个起点各试一遍，换起点前 visited 全部复位
  - type: code
    text: "bool DFS(ALGraph& G, int i, int depth, int k, int visited[]){\n    if(depth == k) return true;             // 走了 k 条边，成功\n\
      \    visited[i] = 1;\n    for(ArcNode* e = G.vertices[i].firstarc; e != NULL; e = e->nextarc){ int v = e->adjvex;\n        if(!visited[v]\
      \ && DFS(G, v, depth + 1, k, visited)){ visited[i] = 0; return true; } }\n    visited[i] = 0;                         // 回溯：失败返回前复位\n\
      \    return false;\n}\nbool existsKSimplePath(ALGraph& G, int k){\n    if(k < 1 || k > G.vexnum - 1) return false;   // 边界：k 条边需\
      \ k+1 个顶点\n    int visited[MaxVertexNum];\n    for(int i = 0; i < G.vexnum; i++){ for(int j = 0; j < G.vexnum; j++) visited[j]\
      \ = 0;\n        if(DFS(G, i, 0, k, visited)) return true; }\n    return false; }\n"
    size: 12
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "bool DFS(ALGraph& G, int i, int depth, int k, int visited[]){\n    if(depth == k) return true;             // 走了 k 条边，成功\n\
        \    visited[i] = 1;\n    for(ArcNode* e = G.vertices[i].firstarc; e != NULL; e = e->nextarc){ int v = e->adjvex;\n        if(!visited[v]\
        \ && DFS(G, v, depth + 1, k, visited)){ visited[i] = 0; return true; } }\n    visited[i] = 0;                         // 回溯：失败返回前复位\n\
        \    return false;\n}\nbool existsKSimplePath(ALGraph& G, int k){\n    if(k < 1 || k > G.vexnum - 1) return false;   // 边界：k\
        \ 条边需 k+1 个顶点\n    int visited[MaxVertexNum];\n    for(int i = 0; i < G.vexnum; i++){ for(int j = 0; j < G.vexnum; j++) visited[j]\
        \ = 0;\n        if(DFS(G, i, 0, k, visited)) return true; }\n    return false; }\n"
      size: 11
  - - type: bullets
