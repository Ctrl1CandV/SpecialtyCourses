- type: content
  kicker: 拓扑排序 · 入度表加栈
  title: 拓扑排序：入度 0 入栈，出栈输出并让后继入度减一
  blocks:
  - type: code
    text: "bool TopoLogicalSort(ALGraph G, int print[]){\n    if(G.kind != 1) return false;               // 只有有向图才有拓扑序\n    int indegree[MaxVertexNum]\
      \ = {0};\n    for(int i = 0; i < G.vexnum; i++) for(ArcNode *p = G.vertices[i].firstarc; p != NULL; p = p->nextarc) indegree[p->adjvex]++;\n\
      \    SqStack S; InitStack(S);\n    for(int i = 0; i < G.vexnum; i++) if(indegree[i] == 0) Push(S, i);\n    int count = 0;\n  \
      \  while(!IsEmpty(S)){ int u; Pop(S, u); print[count++] = u;\n        for(ArcNode *p = G.vertices[u].firstarc; p != NULL; p =\
      \ p->nextarc)\n            if(--indegree[p->adjvex] == 0) Push(S, p->adjvex); }\n    return count == G.vexnum;               \
      \    // 输出不足说明有环\n}\n"
    size: 12
  - type: bullets
    items:
    - 四步：求入度（数据结构基础阶段第9节的 Indegree）；入度 0 入栈；出栈输出；后继减一到 0 入栈
    - 栈换成队列也对：得到的拓扑序不同，但都合法（下一页推演会看见）
    - 先自己判断：为什么 count 小于 vexnum 就说明有环？想好再往下看
  layout: split
  leftWidth: 8.0
  columns:
