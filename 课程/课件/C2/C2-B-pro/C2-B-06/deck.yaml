      - 每个起点各试一遍，换起点前 visited 全部复位
      size: 13
- type: content
  kicker: 对比 · visited的两种处理
  title: visited 什么时候保留，什么时候随回溯清掉
  blocks:
  - type: table
    head:
    - 任务
    - 失败返回时
    - 为什么
    - 调用边界
    rows:
    - - 判两点可达
      - 保留 visited
      - 已探过的区域再走不会找到新路
      - 全局标记仅用于这一次搜索；再次调用前清零
    - - 枚举/寻找路径
      - 清掉当前结点
      - 另一条分支还可能经过它
      - 成功可提前返回；需要继续枚举时也要完整回溯
    - - 两段分别判可达
      - 两段之间清零
      - 第二段从 k 重新搜索整个图
      - 仅适用于题目允许两段独立可达的写法
    rowH: 0.48
  - type: note
    text: 若题目明确要求 u 到 v 的整条简单路径经过 k，不能把两段清零后独立拼接；应在同一次 DFS 中记录是否经过 k。
    size: 12
