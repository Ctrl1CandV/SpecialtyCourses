    - 入度 0 入栈、出栈输出、后继入度减一、减到 0 再入栈，四步顺序不能反
    - 时间 O(|V|+|E|)、空间 O(|V|)；count 不足顶点数说明有环
  layout: split
  leftWidth: 8.0
  columns:
  - - type: code
      text: "bool TopoLogicalSort(ALGraph G, int print[]){\n    if(G.kind != 1) return false;\n    int indegree[MaxVertexNum] = {0};\n\
        \    for(int i = 0; i < G.vexnum; i++)\n        for(ArcNode *p = G.vertices[i].firstarc; p != NULL; p = p->nextarc) indegree[p->adjvex]++;\n\
        \    SqStack S; InitStack(S);\n    for(int i = 0; i < G.vexnum; i++) if(indegree[i] == 0) Push(S, i);\n    int count = 0;\n\
        \    while(!IsEmpty(S)){ int u; Pop(S, u); print[count++] = u;\n        for(ArcNode *p = G.vertices[u].firstarc; p != NULL;\
        \ p = p->nextarc)\n            if(--indegree[p->adjvex] == 0) Push(S, p->adjvex); }\n    return count == G.vexnum;\n}\n"
      size: 11
  - - type: bullets
      items:
      - 入度 0 入栈、出栈输出、后继入度减一、减到 0 再入栈，四步顺序不能反
      - 时间 O(|V|+|E|)、空间 O(|V|)；count 不足顶点数说明有环
      size: 13
- type: content
  kicker: 参考答案 · 跟练二
  title: 跟练题参考答案：判给定序列是否拓扑序列（自行对照）
  blocks:
  - &id003
    type: code
    text: "bool IsTopoSeq(ALGraph G, int seq[], int n){\n    if(n != G.vexnum || G.vexnum == 0) return false;\n    int indegree[MaxVertexNum] = {0};\n    bool seen[MaxVertexNum] = {false};\n    for(int i=0;i<G.vexnum;i++)\n        for(ArcNode *p=G.vertices[i].firstarc;p!=NULL;p=p->nextarc) indegree[p->adjvex]++;\n    for(int i=0;i<n;i++){\n        int u=seq[i];\n        if(u<0 || u>=G.vexnum || seen[u] || indegree[u]!=0) return false;\n        seen[u]=true;\n        for(ArcNode *p=G.vertices[u].firstarc;p!=NULL;p=p->nextarc) indegree[p->adjvex]--;\n    } return true;\n}"
    size: 12
  - &id004
    type: bullets
    items:
    - 按给定序列顺序模拟：每步先查当前顶点入度是否为 0，再把它的后继入度减一
    - 不需要自己生成拓扑序再比较；入度表求法与拓扑排序共用同一段
  layout: split
  leftWidth: 8
  columns:
  - - *id003
  - - *id004
- type: content
  kicker: 参考答案 · 课堂回顾
  title: 课堂回顾参考要点：7算13、7算14、7算18
  blocks:
  - type: bullets
    items:
    - 7算13 DFS 判可达路径：即第 3 页 Pathitoj 思路，从 u 出发 DFS 撞见 v 返回 1；visited 一次性使用，调用前清零
    - 7算14 BFS 判可达路径：从 u 层序扩展，撞见 v 返回 1；visited 在入队时标记，DFS 换成队列，判断结构不变
    - 7算18 长度 k 的简单路径：与 P5 同一算法，DFS 带 depth 参数，每起点前 visited 复位，k 的范围 1 到 vexnum-1
