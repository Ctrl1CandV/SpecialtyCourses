- type: content
  badge: 真题·2025
  kicker: 经过k的路径 · DFS回溯
  title: 从 u 到 v 经过 k：分两段搜索，并在第二段前清零
  blocks:
  - type: bullets
    items:
    - 思路：u 到 v 经过 k，就是 u 能到 k、并且 k 能到 v，两段都是普通的判连通
    - 搜索失败时回溯复位；找到路径即可返回；两段搜索之间清零 visited
  - type: code
    text: "bool checkPath(ALGraph G, int u, int v, bool visited[]){\n    if(u == v) return true;\n    visited[u] = true;\n    for(ArcNode\
      \ *p = G.vertices[u].firstarc; p != NULL; p = p->nextarc)\n        if(!visited[p->adjvex] && checkPath(G, p->adjvex, v, visited))\
      \ return true;\n    visited[u] = false;             // 回溯：失败返回前复位\n    return false;\n}\nbool IsExistPathGoBy(ALGraph G, int u,\
      \ int k, int v){\n    if(G.vexnum == 0 || G.arcnum == 0) return false;\n    bool visited[MaxVertexNum] = {false};    // 固定长度数组（勘误A6写法）\n\
      \    if(!checkPath(G, u, k, visited)) return false;         // 第一段：u 到 k\n    for(int i = 0; i < G.vexnum; i++) visited[i] = false;\
      \  // 两段之间复位\n    return checkPath(G, k, v, visited); }              // 第二段：k 到 v\n"
    size: 12
  layout: split
  leftWidth: 8.0
  columns:
