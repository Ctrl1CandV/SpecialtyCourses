  blocks:
  - type: code
    text: "void AllPath(ALGraph G, int u, int v, bool visited[], int path[], int d){\n    visited[u] = true; path[d++] = u;        //\
      \ u 记入当前路径\n    if(u == v){ for(int i = 0; i < d; i++) printf(\"%d \", path[i]); printf(\"\\n\"); }\n    for(ArcNode *p = G.vertices[u].firstarc;\
      \ p != NULL; p = p->nextarc)\n        if(!visited[p->adjvex]) AllPath(G, p->adjvex, v, visited, path, d);\n    visited[u] = false;\
      \                      // 回溯：让别的路还能经过 u\n}\n"
