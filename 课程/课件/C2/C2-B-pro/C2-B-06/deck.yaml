- type: content
  badge: 真题·2026
  kicker: 判拓扑序列 · 入度表
  title: 判给定序列是不是拓扑序列：按给定顺序模拟，不用真排序
  blocks:
  - &id002
    type: bullets
    items:
    - 关键认识：不需要自己做一遍拓扑排序再比较，按给定序列的顺序模拟一遍即可
    - 每检查一个 u：入度不为 0 返回 false；为 0 则把它的后继入度减一
    - 时间 O(|V|+|E|)、空间 O(|V|)，比先排序再比较省事
  - &id001
    type: code
    text: "bool IsTopoSeq(ALGraph G, int seq[], int n){\n    if(n != G.vexnum || G.vexnum == 0) return false;\n    int indegree[MaxVertexNum] = {0};\n    bool seen[MaxVertexNum] = {false};\n    for(int i=0;i<G.vexnum;i++)\n        for(ArcNode *p=G.vertices[i].firstarc;p!=NULL;p=p->nextarc) indegree[p->adjvex]++;\n    for(int i=0;i<n;i++){\n        int u=seq[i];\n        if(u<0 || u>=G.vexnum || seen[u] || indegree[u]!=0) return false;\n        seen[u]=true;\n        for(ArcNode *p=G.vertices[u].firstarc;p!=NULL;p=p->nextarc) indegree[p->adjvex]--;\n    } return true;\n}"
    size: 12
  layout: split
  leftWidth: 8
  columns:
  - - *id001
  - - *id002
- type: content
  kicker: 判拓扑序列唯一 · 邻接表版
  title: 判拓扑序列是否唯一：任何一轮入度为 0 的只能有一个
  blocks:
  - type: code
    text: "bool uniquely(ALGraph G){\n int indegree[MaxVertexNum]={0}, processed=0;\n for(int i=0;i<G.vexnum;i++)\n  for(ArcNode *p=G.vertices[i].firstarc;p;p=p->nextarc) indegree[p->adjvex]++;\n SqQueue Q; InitQueue(Q); int available=0;\n for(int i=0;i<G.vexnum;i++) if(indegree[i]==0){ EnQueue(Q,i); available++; }\n if(available!=1) return false;\n while(!IsEmpty(Q)){ int u; DeQueue(Q,u); processed++; available=0;\n  for(ArcNode *p=G.vertices[u].firstarc;p;p=p->nextarc)\n   if(--indegree[p->adjvex]==0){ EnQueue(Q,p->adjvex); available++; }\n  if(available>1) return false;\n } return processed==G.vexnum;\n}"
    size: 11.5
  - type: bullets
    items:
    - 每轮可选的入度0顶点必须恰好一个；出现两个时，先后顺序可以互换。
    size: 12
  layout: split
  leftWidth: 7.4
  columns:
  - - type: code
      text: "bool uniquely(ALGraph G){\n int indegree[MaxVertexNum]={0}, processed=0;\n for(int i=0;i<G.vexnum;i++)\n  for(ArcNode *p=G.vertices[i].firstarc;p;p=p->nextarc) indegree[p->adjvex]++;\n SqQueue Q; InitQueue(Q); int available=0;\n for(int i=0;i<G.vexnum;i++) if(indegree[i]==0){ EnQueue(Q,i); available++; }\n if(available!=1) return false;\n while(!IsEmpty(Q)){ int u; DeQueue(Q,u); processed++; available=0;\n  for(ArcNode *p=G.vertices[u].firstarc;p;p=p->nextarc)\n   if(--indegree[p->adjvex]==0){ EnQueue(Q,p->adjvex); available++; }\n  if(available>1) return false;\n } return processed==G.vexnum;\n}"
