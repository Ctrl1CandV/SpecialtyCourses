<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:2218px;height:726px;background:transparent;position:relative;overflow:visible;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
.el{position:absolute}
.codepanel{background:F7F9FC;border-radius:2px}
.codebar{position:absolute;left:0;top:0;width:11px;height:100%;background:1F4E9C}
.coderows{position:absolute;left:26px;top:14px;right:10px;bottom:10px;font-family:Consolas,'Courier New',monospace;color:1F2329;white-space:pre}
.cl{min-height:1em}
.cfocus{background:FFF3CD;box-shadow:0 0 0 2px FFF3CD}
.lnode{display:flex;position:absolute;border-radius:3px;overflow:hidden}
.lnode-cell{display:flex;align-items:center;justify-content:center;height:100%;font-size:34px;font-family:'Microsoft YaHei','微软雅黑',sans-serif;border-right:2px solid #D8DBE0}
.lnode-cell:last-child{border-right:none}
.lhead-tag{position:absolute;font-size:20px;color:#8A9099;text-align:center}
.cellbox{position:absolute;border:3px solid #1F4E9C;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;color:1F2329}
.cellidx{position:absolute;text-align:center;font-size:22px;color:#8A9099}
.gridcell{position:absolute;border:3px solid #1F4E9C;background:#fff}
.gridlab{position:absolute;display:flex;align-items:center;justify-content:center;font-size:24px;color:#8A9099}
.tnode{position:absolute;border:3px solid #1F4E9C;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;color:1F2329;font-weight:600}
.panel{border-radius:6px}
.panel-title{position:absolute;left:18px;top:10px;font-size:24px;font-weight:700}
.chip{display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:700;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
.wlabel{position:absolute;text-align:center;font-size:30px;font-weight:700;color:#1F4E9C;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
.legend-item{position:relative;display:flex;align-items:center;gap:10px;color:1F2329}
.sw{display:inline-block;width:26px;height:26px;border:2px solid #1F4E9C}
.arrowsym{position:absolute;text-align:center;font-size:24px;font-weight:700;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
</style></head><body><div class="el" style="left:0;top:0;width:100%;height:100%"><div style="width:100%;height:100%;box-sizing:border-box;padding:23px 27px;background:#F7F9FC;border:1px solid #D8DEE8;border-radius:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden;font-family:Arial,'Microsoft YaHei',sans-serif;color:#1F2329">
<div style="font-size:37px;line-height:1.12;font-weight:700;color:#1F4E9C">拓扑排序：入度归零才入栈</div>
<div style="font-size:24px;line-height:1.25;color:#515B68">先弹出2</div>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;flex:1;min-height:0"><section style="background:#FFFFFF;border:1px solid #D8DEE8;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;min-height:150px;box-sizing:border-box"><div style="font-size:27px;color:#1F4E9C;font-weight:700;margin-bottom:15px">DAG：每条边从前驱指向后继</div><svg viewBox="0 0 850 350" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7E8996"/></marker></defs><line x1="139.0" y1="90.0" x2="251.0" y2="90.0" stroke="#7E8996" stroke-width="4" marker-end="url(#arr)"/><line x1="130.8" y1="110.2" x2="260.6" y2="236.3" stroke="#7E8996" stroke-width="4" marker-end="url(#arr)"/><line x1="312.2" y1="100.1" x2="483.1" y2="163.2" stroke="#7E8996" stroke-width="4" marker-end="url(#arr)"/><line x1="312.2" y1="249.9" x2="483.1" y2="186.8" stroke="#7E8996" stroke-width="4" marker-end="url(#arr)"/><line x1="544.0" y1="175.0" x2="696.0" y2="175.0" stroke="#7E8996" stroke-width="4" marker-end="url(#arr)"/><circle cx="110" cy="90" r="28" fill="#E8EEF9" stroke="#1F4E9C" stroke-width="4"/><text x="110" y="100" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#173B77">0</text><circle cx="285" cy="90" r="28" fill="#FFFFFF" stroke="#7E8996" stroke-width="4"/><text x="285" y="100" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#1F2329">1</text><circle cx="285" cy="260" r="28" fill="#E8EEF9" stroke="#1F4E9C" stroke-width="4"/><text x="285" y="270" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#173B77">2</text><circle cx="515" cy="175" r="28" fill="#FFFFFF" stroke="#7E8996" stroke-width="4"/><text x="515" y="185" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#1F2329">3</text><circle cx="730" cy="175" r="28" fill="#FFFFFF" stroke="#7E8996" stroke-width="4"/><text x="730" y="185" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#1F2329">4</text></svg></section><section style="background:#FFFFFF;border:1px solid #D8DEE8;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;min-height:150px;box-sizing:border-box"><div style="font-size:27px;color:#1F4E9C;font-weight:700;margin-bottom:15px">输出与栈</div><div style="font-size:28px;line-height:1.5">已输出：0 → 2<br>栈底 → 栈顶：1<br>剩余入度随出栈更新</div><div style="font-size:25px;line-height:1.3;color:#515B68;margin-top:14px">输出2；结点3的入度从2减到1，仍不能入栈。</div></section></div>
<div style="padding:12px 16px;background:#E8EEF9;border-radius:10px;font-size:25px;line-height:1.2;font-weight:600;color:#243B5A">输出2；结点3的入度从2减到1，仍不能入栈。</div></div></div><script>
window.addEventListener('load',()=>{
  const out=[];
  if(document.body.scrollWidth>document.body.clientWidth+1) out.push('body-w:'+document.body.scrollWidth+'>'+document.body.clientWidth);
  if(document.body.scrollHeight>document.body.clientHeight+1) out.push('body-h:'+document.body.scrollHeight+'>'+document.body.clientHeight);
  document.title='AUDIT|'+(out.length?out.join(';'):'OK');
  const t=document.createElement('div');t.id='audit-result';t.textContent='AUDIT|'+(out.length?out.join(';'):'OK');t.style.display='none';
  document.body.appendChild(t);
});
</script></body></html>
