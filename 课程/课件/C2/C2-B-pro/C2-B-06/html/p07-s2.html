<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:2218px;height:726px;background:transparent;position:relative;overflow:visible;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
.el{position:absolute}
.codepanel{background:F7F9FC;border-radius:2px}
.codebar{position:absolute;left:0;top:0;width:11px;height:100%;background:1F4E9C}
.coderows{position:absolute;left:26px;top:14px;right:10px;bottom:10px;font-family:Consolas,'Courier New',monospace;color:1F2329;white-space:pre}
.cl{min-height:1em}
.cfocus{background:FFF3CD;box-shadow:0 0 0 2px FFF3CD}
.lnode{display:flex;position:absolute;border-radius:3px;overflow:hidden}
.lnode-cell{display:flex;align-items:center;justify-content:center;height:100%;font-size:34px;font-family:'Microsoft YaHei','微软雅黑',sans-serif;border-right:2px solid #D8DBE0}
.lnode-cell:last-child{border-right:none}
.lhead-tag{position:absolute;font-size:20px;color:#8A9099;text-align:center}
.cellbox{position:absolute;border:3px solid #1F4E9C;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;color:1F2329}
.cellidx{position:absolute;text-align:center;font-size:22px;color:#8A9099}
.gridcell{position:absolute;border:3px solid #1F4E9C;background:#fff}
.gridlab{position:absolute;display:flex;align-items:center;justify-content:center;font-size:24px;color:#8A9099}
.tnode{position:absolute;border:3px solid #1F4E9C;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;color:1F2329;font-weight:600}
.panel{border-radius:6px}
.panel-title{position:absolute;left:18px;top:10px;font-size:24px;font-weight:700}
.chip{display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:700;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
.wlabel{position:absolute;text-align:center;font-size:30px;font-weight:700;color:#1F4E9C;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
.legend-item{position:relative;display:flex;align-items:center;gap:10px;color:1F2329}
.sw{display:inline-block;width:26px;height:26px;border:2px solid #1F4E9C}
.arrowsym{position:absolute;text-align:center;font-size:24px;font-weight:700;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
</style></head><body><div class="el" style="left:0;top:0;width:100%;height:100%"><div style="width:100%;height:100%;box-sizing:border-box;padding:23px 27px;background:#F7F9FC;border:1px solid #D8DEE8;border-radius:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden;font-family:Arial,'Microsoft YaHei',sans-serif;color:#1F2329">
<div style="font-size:37px;line-height:1.12;font-weight:700;color:#1F4E9C">visited 的复位：两次可达搜索不能共享旧标记</div>
<div style="font-size:24px;line-height:1.25;color:#515B68">不清零就从3再搜5</div>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;flex:1;min-height:0"><section style="background:#FFFFFF;border:1px solid #D8DEE8;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;min-height:150px;box-sizing:border-box"><div style="font-size:27px;color:#1F4E9C;font-weight:700;margin-bottom:15px">无向图：u=0，k=3，v=5</div><svg viewBox="0 0 850 350" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg"><line x1="130" y1="165" x2="300" y2="80" stroke="#7E8996" stroke-width="4"/><line x1="130" y1="165" x2="300" y2="250" stroke="#7E8996" stroke-width="4"/><line x1="300" y1="80" x2="490" y2="165" stroke="#7E8996" stroke-width="4"/><line x1="300" y1="250" x2="490" y2="165" stroke="#7E8996" stroke-width="4"/><line x1="300" y1="80" x2="650" y2="80" stroke="#7E8996" stroke-width="4"/><line x1="650" y1="80" x2="760" y2="80" stroke="#7E8996" stroke-width="4"/><circle cx="130" cy="165" r="28" fill="#FDEDEC" stroke="#D46A63" stroke-width="4"/><text x="130" y="175" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#8F3734">0</text><circle cx="300" cy="80" r="28" fill="#FDEDEC" stroke="#D46A63" stroke-width="4"/><text x="300" y="90" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#8F3734">1</text><circle cx="300" cy="250" r="28" fill="#E8EEF9" stroke="#1F4E9C" stroke-width="4"/><text x="300" y="260" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#173B77">2</text><circle cx="490" cy="165" r="28" fill="#FDEDEC" stroke="#D46A63" stroke-width="4"/><text x="490" y="175" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#8F3734">3</text><circle cx="650" cy="80" r="28" fill="#FFFFFF" stroke="#7E8996" stroke-width="4"/><text x="650" y="90" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#1F2329">4</text><circle cx="760" cy="80" r="28" fill="#FFFFFF" stroke="#7E8996" stroke-width="4"/><text x="760" y="90" text-anchor="middle" font-family="Arial,Microsoft YaHei,sans-serif" font-size="27" font-weight="700" fill="#1F2329">5</text></svg></section><section style="background:#FFFFFF;border:1px solid #D8DEE8;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;min-height:150px;box-sizing:border-box"><div style="font-size:27px;color:#1F4E9C;font-weight:700;margin-bottom:15px">visited 状态</div><div style="font-size:29px;line-height:1.55">第一段：0 能到 3<br>第二段：3 能到 5<br>两段之间是否清零？</div><div style="font-size:25px;line-height:1.3;color:#515B68;margin-top:14px">3的邻点1已标记；绕到2后又被0挡住，错误地返回false。</div></section></div>
<div style="padding:12px 16px;background:#E8EEF9;border-radius:10px;font-size:25px;line-height:1.2;font-weight:600;color:#243B5A">3的邻点1已标记；绕到2后又被0挡住，错误地返回false。</div></div></div><script>
window.addEventListener('load',()=>{
  const out=[];
  if(document.body.scrollWidth>document.body.clientWidth+1) out.push('body-w:'+document.body.scrollWidth+'>'+document.body.clientWidth);
  if(document.body.scrollHeight>document.body.clientHeight+1) out.push('body-h:'+document.body.scrollHeight+'>'+document.body.clientHeight);
  document.title='AUDIT|'+(out.length?out.join(';'):'OK');
  const t=document.createElement('div');t.id='audit-result';t.textContent='AUDIT|'+(out.length?out.join(';'):'OK');t.style.display='none';
  document.body.appendChild(t);
});
</script></body></html>
