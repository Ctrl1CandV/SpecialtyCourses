<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:2218px;height:726px;background:transparent;position:relative;overflow:visible;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
.el{position:absolute}
.codepanel{background:F7F9FC;border-radius:2px}
.codebar{position:absolute;left:0;top:0;width:11px;height:100%;background:1F4E9C}
.coderows{position:absolute;left:26px;top:14px;right:10px;bottom:10px;font-family:Consolas,'Courier New',monospace;color:1F2329;white-space:pre}
.cl{min-height:1em}
.cfocus{background:FFF3CD;box-shadow:0 0 0 2px FFF3CD}
.lnode{display:flex;position:absolute;border-radius:3px;overflow:hidden}
.lnode-cell{display:flex;align-items:center;justify-content:center;height:100%;font-size:34px;font-family:'Microsoft YaHei','微软雅黑',sans-serif;border-right:2px solid #D8DBE0}
.lnode-cell:last-child{border-right:none}
.lhead-tag{position:absolute;font-size:20px;color:#8A9099;text-align:center}
.cellbox{position:absolute;border:3px solid #1F4E9C;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;color:1F2329}
.cellidx{position:absolute;text-align:center;font-size:22px;color:#8A9099}
.gridcell{position:absolute;border:3px solid #1F4E9C;background:#fff}
.gridlab{position:absolute;display:flex;align-items:center;justify-content:center;font-size:24px;color:#8A9099}
.tnode{position:absolute;border:3px solid #1F4E9C;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;color:1F2329;font-weight:600}
.panel{border-radius:6px}
.panel-title{position:absolute;left:18px;top:10px;font-size:24px;font-weight:700}
.chip{display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:700;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
.wlabel{position:absolute;text-align:center;font-size:30px;font-weight:700;color:#1F4E9C;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
.legend-item{position:relative;display:flex;align-items:center;gap:10px;color:1F2329}
.sw{display:inline-block;width:26px;height:26px;border:2px solid #1F4E9C}
.arrowsym{position:absolute;text-align:center;font-size:24px;font-weight:700;font-family:'Microsoft YaHei','微软雅黑',sans-serif}
</style></head><body><div class="el" style="left:0;top:0;width:100%;height:100%"><div style="width:100%;height:100%;box-sizing:border-box;padding:18px 22px;background:#F7F9FC;border:1px solid #D8DEE8;border-radius:16px;display:grid;grid-template-columns:1.55fr 1fr;gap:24px;font-family:Arial,'Microsoft YaHei',sans-serif;color:#1F2329">
<section style="background:white;border:1px solid #D8DEE8;border-radius:14px;padding:14px;display:flex;flex-direction:column;min-height:0">
<div style="font-size:27px;font-weight:700;color:#1F4E9C;margin-bottom:8px">n=11：每次取当前区间的中点</div>
<svg viewBox="0 0 850 340" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
<g stroke="#7E8996" stroke-width="4"><line x1="425" y1="48" x2="215" y2="125"/><line x1="425" y1="48" x2="635" y2="125"/><line x1="215" y1="125" x2="110" y2="210"/><line x1="215" y1="125" x2="320" y2="210"/><line x1="635" y1="125" x2="530" y2="210"/><line x1="635" y1="125" x2="740" y2="210"/><line x1="110" y1="210" x2="165" y2="300"/><line x1="320" y1="210" x2="365" y2="300"/><line x1="530" y1="210" x2="575" y2="300"/><line x1="740" y1="210" x2="790" y2="300"/></g>
<g fill="#FFFFFF" stroke="#7E8996" stroke-width="4"><circle cx="425" cy="48" r="28"/><circle cx="215" cy="125" r="28"/><circle cx="635" cy="125" r="28"/><circle cx="110" cy="210" r="28"/><circle cx="320" cy="210" r="28"/><circle cx="530" cy="210" r="28"/><circle cx="740" cy="210" r="28"/><circle cx="165" cy="300" r="28"/><circle cx="365" cy="300" r="28"/><circle cx="575" cy="300" r="28"/><circle cx="790" cy="300" r="28"/></g>
<g fill="#1F2329" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle"><text x="425" y="57">6</text><text x="215" y="134">3</text><text x="635" y="134">9</text><text x="110" y="219">1</text><text x="320" y="219">4</text><text x="530" y="219">7</text><text x="740" y="219">10</text><text x="165" y="309">2</text><text x="365" y="309">5</text><text x="575" y="309">8</text><text x="790" y="309">11</text></g>
<g fill="#E8EEF9" stroke="#1F4E9C" stroke-width="5"><circle cx="425" cy="48" r="28"/><circle cx="215" cy="125" r="28"/><circle cx="110" cy="210" r="28"/><circle cx="165" cy="300" r="28"/></g>
<g fill="#173B77" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle"><text x="425" y="57">6</text><text x="215" y="134">3</text><text x="110" y="219">1</text><text x="165" y="309">2</text></g></svg>
</section>
<aside style="background:white;border:1px solid #D8DEE8;border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;justify-content:center;gap:16px">
<div style="font-size:28px;font-weight:700;color:#1F4E9C">读一条查找路径</div>
<div style="font-size:25px;line-height:1.55">查 6：比较 1 次<br>查 3：比较 2 次<br>查 2：6 → 3 → 1 → 2，共 4 次</div>
<div style="padding:14px 16px;background:#E8EEF9;border-radius:10px;font-size:22px;line-height:1.35">单次查找比较次数看路径长度。平均查找长度的完整计算留到专业课。</div>
</aside></div></div><script>
window.addEventListener('load',()=>{
  const out=[];
  if(document.body.scrollWidth>document.body.clientWidth+1) out.push('body-w:'+document.body.scrollWidth+'>'+document.body.clientWidth);
  if(document.body.scrollHeight>document.body.clientHeight+1) out.push('body-h:'+document.body.scrollHeight+'>'+document.body.clientHeight);
  document.title='AUDIT|'+(out.length?out.join(';'):'OK');
  const t=document.createElement('div');t.id='audit-result';t.textContent='AUDIT|'+(out.length?out.join(';'):'OK');t.style.display='none';
  document.body.appendChild(t);
});
</script></body></html>
