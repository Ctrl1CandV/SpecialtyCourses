    component: code2col
    box: [0.9, 2.62, 11.53, 3.30]
    props:
      fontSizePx: 26
      cols:
        - "void Prim(ALGraph &G){\n  bool include[MaxVertexNum];\n  int dist[MaxVertexNum], parent[MaxVertexNum];\n  for(int i = 0; i < G.vexnum; i++)\n    { include[i] = false; dist[i] = INF;\n      parent[i] = -1; }            // 不能写 dist[] = {INF}\n  dist[0] = 0;\n  for(int k = 0; k < G.vexnum; k++){\n    int u = -1, minDist = INF;"
        - "    for(int i = 0; i < G.vexnum; i++)      // ①选树外 dist 最小的 u\n      if(!include[i] && dist[i] < minDist)\n        { minDist = dist[i]; u = i; }\n      if(u == -1) break;               // 图不连通，停\n      include[u] = true;               // ②u 并入树\n      for(ArcNode *p = G.vertices[u].firstarc;\n          p != NULL; p = p->nextarc)\n        if(!include[p->adjvex] && p->weight < dist[p->adjvex])\n          { dist[p->adjvex] = p->weight; parent[p->adjvex] = u; }  // ③刷新\n  }\n}"
