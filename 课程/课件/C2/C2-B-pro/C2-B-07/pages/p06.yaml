# B-07 P6 Prim 对照图走一遍 —— 动画页：图上八次点击走完两拍主循环
# 固定层：5 顶点带权图（灰边+全权值+结点壳）+ 两拍代码摘录；原生：树边蓝线、并入光环、dist/parent 状态行
page: 6
fixed:
  - id: graph
    component: graph
    box: [0.9, 2.62, 5.3, 3.6]
    props:
      nodeR: 42
      nodes: [[150, 260, "0"], [440, 80, "1"], [760, 260, "2"], [290, 540, "3"], [640, 540, "4"]]
      edges: [[0, 1, 2], [0, 3, 6], [1, 2, 3], [1, 3, 8], [1, 4, 5], [2, 4, 7], [3, 4, 9]]
  - id: beats-code
    component: code
    box: [6.45, 2.62, 5.98, 1.30]
    props:
      fontSizePx: 26
      text: |
        int u = 选树外 dist 最小的顶点;
        include[u] = true;                    // ①选最小并入
        for(每条 u 的边(u,v,w)) if(w < dist[v]) dist[v] = w, parent[v] = u;   // ②刷新
native:
  # —— 树边（蓝线，出现即表示该边进入候选/树） ——
  - { id: e01, kind: line, box: [1.880, 3.851, 2.994, 3.160], props: { color: "1F4E9C", width: 4 } }
  - { id: e03, kind: line, box: [1.786, 4.183, 2.315, 5.292], props: { color: "1F4E9C", width: 4 } }
  - { id: e12, kind: line, box: [3.396, 3.152, 4.624, 3.859], props: { color: "1F4E9C", width: 4 } }
  - { id: e14, kind: line, box: [3.285, 3.251, 4.140, 5.216], props: { color: "1F4E9C", width: 4 } }
  # —— 并入光环 ——
  - { id: ring0, kind: oval, box: [1.441, 3.734, 0.48, 0.48], props: { lineColor: "1F4E9C", lineW: 3.5 } }
  - { id: ring1, kind: oval, box: [2.952, 2.797, 0.48, 0.48], props: { lineColor: "1F4E9C", lineW: 3.5 } }
  - { id: ring2, kind: oval, box: [4.618, 3.734, 0.48, 0.48], props: { lineColor: "1F4E9C", lineW: 3.5 } }
  - { id: ring3, kind: oval, box: [2.170, 5.192, 0.48, 0.48], props: { lineColor: "1F4E9C", lineW: 3.5 } }
  - { id: ring4, kind: oval, box: [3.993, 5.192, 0.48, 0.48], props: { lineColor: "1F4E9C", lineW: 3.5 } }
  # —— 状态行（每步一条，隐藏上一条） ——
  - { id: d1, kind: text, box: [6.45, 4.05, 5.98, 1.05], props: { fontSize: 15, text: "初始化：dist=[0, INF, INF, INF, INF]，parent 全 -1\ninclude 全 false；只有 0 有候选项" } }
  - { id: d2, kind: text, box: [6.45, 4.05, 5.98, 1.05], props: { fontSize: 15, text: "第1轮①：选 u=0 并入（dist=0 是唯一候选）" } }
  - { id: d3, kind: text, box: [6.45, 4.05, 5.98, 1.05], props: { fontSize: 15, text: "第1轮②：0 的边刷新邻居 dist[1]=2、dist[3]=6\ndist=[0, 2, INF, 6, INF]，parent[1]=parent[3]=0" } }
  - { id: d4, kind: text, box: [6.45, 4.05, 5.98, 1.05], props: { fontSize: 15, text: "第2轮①：选 u=1 并入（树外 dist 最小 = 2）" } }
  - { id: d5, kind: text, box: [6.45, 4.05, 5.98, 1.05], props: { fontSize: 15, text: "第2轮②：dist[2]=3、dist[4]=5；1-3 权 8 > dist[3]=6 不变\ndist=[0, 2, 3, 6, 5]" } }
  - { id: d6, kind: text, box: [6.45, 4.05, 5.98, 1.05], props: { fontSize: 15, text: "第3轮：选 u=2 并入；2-4 权 7 > dist[4]=5，dist 不变" } }
  - { id: d7, kind: text, box: [6.45, 4.05, 5.98, 1.05], props: { fontSize: 15, text: "第4轮：选 u=4 并入；3-4 权 9 > dist[3]=6，dist 不变" } }
  - { id: d8, kind: text, box: [6.45, 4.05, 5.98, 1.05], props: { fontSize: 15, bold: true, text: "第5轮：选 u=3 并入，全部并入，循环停\n树边 0-1、1-2、1-4、0-3，权值和 2+3+5+6 = 16" } }
steps:
  - { appear: [d1], caption: "初始化 dist" }
  - { appear: [ring0, d2], hide: [d1], caption: "第1轮并入0" }
  - { appear: [e01, e03, d3], hide: [d2], caption: "刷新 dist[1]/dist[3]" }
  - { appear: [ring1, d4], hide: [d3], caption: "第2轮并入1" }
  - { appear: [e12, e14, d5], hide: [d4], caption: "刷新 dist[2]/dist[4]" }
  - { appear: [ring2, d6], hide: [d5], caption: "第3轮并入2" }
  - { appear: [ring4, d7], hide: [d6], caption: "第4轮并入4" }
  - { appear: [ring3, d8], hide: [d7], caption: "第5轮并入3，完成" }
