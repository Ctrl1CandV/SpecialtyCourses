meta:
  id: C2-A-03
  title: 单链表
  stage: A基础
  instructor: 牙膏学长
  duration: 40min

slides:
  - type: cover
    kicker: 重邮802 数据结构代码课程
    title: 数据结构基础阶段
    subtitle: 第3节 单链表
    meta: 阶段：基础 ｜ 主讲：牙膏学长 ｜ 预计40分钟 ｜ 资料答疑：伴梦研途QQ群

  - type: content
    kicker: 引题
    title: 数组有两个硬约束，链表怎么绕开
    blocks:
      - type: bullets
        items:
          - "顺序表用数组，数组有两个硬约束：元素必须存在一段连续内存里，大小一开始就定死"
          - "数据多了装不下要重开搬家；中间删一个留空洞，插一个要把后面全挪一遍"
          - "链表换个思路：结点各申请各的内存、散着放，用指针把前一个和后一个串起来"
      - type: note
        text: "用指针把散着的内存串起来，这个动作在C语言强化阶段练过；这一节把它变成一个正式的数据结构"

  - type: content
    kicker: 单链表的定义
    title: LNode 是一个结点，LinkList 是一条链
    blocks:
      - type: code
        text: |
          typedef struct LNode{
              int data;              // 数据域，存元素
              struct LNode *next;    // 指针域，存下一个结点的地址
          }LNode, *LinkList;
      - type: bullets
        items:
          - "一个结构体起了两个名字：LNode 指一个结点，LinkList 指指向结点的指针，也就是整条链"
          - "next 的类型是 struct LNode 的指针，指向自己的同类，这叫自引用；隔一层指针才合法"
          - "data 存数据、next 存下一个结点的地址，一个接一个就串成了链"

  - type: content
    kicker: 头结点 · 约定2
    title: 头结点让两种特殊情况不再特殊
    blocks:
      - type: code
        text: |
          bool InitList(LinkList &L){
              L = (LNode *)malloc(sizeof(LNode));   // 建头结点
              if(L == NULL) return false;           // 申请失败判空
              L->next = NULL;                        // 空表：头结点后无结点
              return true;
          }
      - type: bullets
        items:
          - "头结点在最前面、不存数据，头指针 L 指它，第一个数据结点是 L->next"
          - "好处一：第一个数据结点的插入删除和中间位置一样，不用单独写一套"
          - "好处二：空表判定统一，空表就是 L->next == NULL；本课程链表默认带头结点"

  - type: content
    kicker: 建表 · 头插法
    title: 头插法建表：新结点总接在最前面
    blocks:
      - type: code
        text: |
          void CreateByHead(LinkList &L, int n){
              L = (LNode *)malloc(sizeof(LNode));
              L->next = NULL;                        // 先成空表
              for(int i = 0; i < n; i++){
                  LNode *s = (LNode *)malloc(sizeof(LNode));
                  scanf("%d", &s->data);
                  s->next = L->next;                 // 新结点先接住原来的第一个
                  L->next = s;                        // 再让头结点指向新结点
              }
          }
      - type: bullets
        items:
          - "两句次序不能换：先 s->next = L->next，再 L->next = s；反过来原来的第一个结点就找不到了"
          - "每次都插在头部，所以建出来的表是输入次序的逆序"

  - type: content
    kicker: 建表过程推演
    title: 头插法建 10、20、30：看逆序怎么来（拿纸跟着画）
    blocks:
      - type: diagram
        diagram: linkedlist
        nodes: [30, 20, 10]
        head: true
        headLabel: "L"
        w: 8
        h: 1.3
        align: center
      - type: bullets
        items:
          - "① 先画头结点 L，L->next = NULL，是个空表"
          - "② 读入10：新结点 s 装10，s->next 指向 L->next（NULL），L->next 指向 s，链是 L→10"
          - "③ 读入20：s 装20，s->next 指向当前的第一个（10），L->next 指向 s，链是 L→20→10"
          - "④ 读入30：同样插在头部，链变成 L→30→20→10"
      - type: note
        text: "输入是 10、20、30，建出来是 30、20、10，逆序就是这么来的：每次都插在头结点后面"

  - type: content
    kicker: 建表 · 尾插法
    title: 尾插法建表：留一个 rear 指着尾巴
    blocks:
      - type: code
        text: |
          void CreateByTail(LinkList &L, int n){
              L = (LNode *)malloc(sizeof(LNode));
              LNode *r = L;                          // r 始终指向当前尾结点
              for(int i = 0; i < n; i++){
                  LNode *s = (LNode *)malloc(sizeof(LNode));
                  scanf("%d", &s->data);
                  r->next = s;  r = s;               // 接在尾部，r 后移
              }
              r->next = NULL;                         // 尾结点 next 必须置空
          }
      - type: bullets
        items:
          - "不留 r，每插一个都要从头走到尾找尾巴，n 个结点是 O(n²)；留着 r 每次 O(1)，整体 O(n)"
          - "循环结束 r->next = NULL 不能忘，否则尾结点的 next 是 malloc 留下的垃圾值，遍历会跑飞"

  - type: content
    kicker: 查找
    title: GetElem 与 LocateElem：起点不一样
    blocks:
      - type: code
        text: |
          LNode *GetElem(LinkList L, int i){          // 按位序找
              if(i < 0) return NULL;
              LNode *p = L; int j = 0;                // p 从头结点起
              while(j < i && p != NULL){ p = p->next; j++; }
              return p;
          }
          LNode *LocateElem(LinkList L, int elem){    // 按值找
              LNode *p = L->next;                     // 从第一个数据结点起
              while(p != NULL && p->data != elem) p = p->next;
              return p;
          }
      - type: note
        text: "两个查找起点不同：GetElem 从头结点 L 起、走 i 步（GetElem(L,0) 是头结点）；LocateElem 从 L->next 起、逐个比 data"

  - type: content
    kicker: 插入
    title: ListInsert：先找前驱，再两步接指针
    blocks:
      - type: code
        text: |
          bool ListInsert(LinkList &L, int i, int elem){
              LNode *p = GetElem(L, i - 1);          // 找第 i-1 个结点（前驱）
              if(p == NULL) return false;
              LNode *s = (LNode *)malloc(sizeof(LNode));
              if(s == NULL) return false;
              s->data = elem;
              s->next = p->next;                     // 第一步：s 接住原后继
              p->next = s;                           // 第二步：p 转向 s
              return true;
          }
      - type: note
        text: "链表插入找的是前驱（第 i-1 个），不像顺序表直接按下标访问；这是两种存储最大的思路差别"

  - type: content
    kicker: 插入 · 检查页
    title: 在 *p 之后插 *s，哪组语句对？（先自己选）
    blocks:
      - type: text
        text: "题集勾画 2选18 同类题：要在结点 *p 之后插入 *s，下面两组哪组对？先自己选，再看答案。"
      - type: code
        text: |
          A. s->next = p->next;  p->next = s;     // 先接后，再改前
          B. p->next = s;  s->next = p->next;     // 先改前，再接后
      - type: bullets
        items:
          - "答案是 A。先让 s 接住 p 原来的后继，再让 p 转向 s，链子不断"
          - "B 错在：p->next = s 之后，p 原来的后继已经找不到了，s->next 只能指回 s 自己，后半条链全丢"

  - type: content
    kicker: 删除
    title: ListDelete：两次判空，free 前先取值
    blocks:
      - type: code
        text: |
          bool ListDelete(LinkList &L, int i, int &elem){
              LNode *p = GetElem(L, i - 1);          // 找前驱
              if(p == NULL) return false;            // 前驱不存在
              if(p->next == NULL) return false;      // 第 i 个结点不存在
              LNode *s = p->next;                    // s 指向要删的结点
              elem = s->data;                        // 先取值带出
              p->next = s->next;                     // 前驱跨过 s 接住后继
              free(s);                               // 再释放 s
              return true;
          }
      - type: note
        text: "顺序是取值、改指针、再 free；要是先 free 再取 s->data，读的就是已回收的内存"

  - type: content
    kicker: 表长与销毁
    title: 求表长与销毁链表
    blocks:
      - type: code
        text: |
          int ListLength(LinkList L){
              int n = 0; LNode *p = L->next;         // 从第一个数据结点数
              while(p != NULL){ n++; p = p->next; }
              return n;
          }
          void DestroyList(LinkList &L){
              LNode *p = L, *q;
              while(p != NULL){ q = p->next; free(p); p = q; }  // 先存后继再 free
              L = NULL;
          }
      - type: bullets
        items:
          - "求表长不数头结点，从 L->next 开始走，走一个加一"
          - "销毁必须先存后继 q 再 free(p)，否则 free 之后 p->next 读的是已回收内存；只 free 头结点是内存泄漏"

  - type: content
    kicker: 本节小结
    title: 单链表基本操作一张表
    blocks:
      - type: table
        head: [操作, 关键动作, 要注意]
        colW: [2.3, 5.7, 3.5]
        rows:
          - [头插建表, s->next=L->next; L->next=s, 结果是逆序]
          - [尾插建表, r->next=s; r=s，末尾置 NULL, 不留 r 变 O(n²)]
          - [ListInsert, 找前驱，先接后再接前, 次序不能换]
          - [ListDelete, 两次判空，取值改指针再 free, 先 free 会读废内存]
          - [销毁, 先存后继再逐个 free, 只 free 头结点是泄漏]
      - type: note
        text: "链表按下标访问是 O(i)、没有随机访问，这是它和顺序表最大的不同；插删不挪元素，但要先走到前驱"

  - type: content
    kicker: 课后任务
    title: 1道跟练 ＋ 1道模仿
    blocks:
      - type: bullets
        items:
          - "**跟练题**：默写单链表定义、头插建表、尾插建表、ListInsert、ListDelete、DestroyList"
          - "**模仿题**：题集勾画 2算17——单链表就地逆置，用头插法把每个结点摘下重新插回头结点后"
      - type: note
        text: "默写要求：合上资料能写出定义和这几个函数；参考答案在本PPT最后两页，课后自行对照"

  - type: content
    kicker: 参考答案 · 跟练题
    title: 跟练题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          typedef struct LNode{ int data; struct LNode *next; }LNode, *LinkList;
          void CreateByHead(LinkList &L, int n){
              L=(LNode*)malloc(sizeof(LNode)); L->next=NULL;
              for(int i=0;i<n;i++){ LNode *s=(LNode*)malloc(sizeof(LNode));
                  scanf("%d",&s->data); s->next=L->next; L->next=s; }
          }
          bool ListInsert(LinkList &L, int i, int elem){
              LNode *p=GetElem(L,i-1); if(p==NULL) return false;
              LNode *s=(LNode*)malloc(sizeof(LNode)); s->data=elem;
              s->next=p->next; p->next=s; return true;
          }
      - type: note
        text: "尾插建表、ListDelete、DestroyList 见本节代码合集；删除两次判空、销毁先存后继再 free 是关键"

  - type: content
    kicker: 参考答案 · 模仿题
    title: 模仿题参考答案（自行对照）
    blocks:
      - type: code
        text: |
          // 思想：把头结点后的每个结点依次摘下，用头插法重新接回，走一遍即逆置
          void Reverse(LinkList &L){
              LNode *p = L->next, *r;
              L->next = NULL;
              while(p != NULL){
                  r = p->next;            // 先存后继
                  p->next = L->next;      // 头插到 L 之后
                  L->next = p;
                  p = r;
              }
          }
      - type: bullets
        items:
          - "复杂度：时间 O(n) 每个结点摘下重接一次；空间 O(1) 只用 p、r 两个指针"
          - "对比上一节的顺序表逆置：顺序表要挪元素，链表只改指针、不挪数据，这就是链表的长处"
