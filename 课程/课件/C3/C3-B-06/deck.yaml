  - type: content
    kicker: 解题过程
    title: 课堂检查：三类容易混淆的错误
    blocks:
      - type: bullets
        items:
          - 图的弧为0到2、1到2、1到3、2到4、3到4。
          - 候选序列[2,1,0,3,4]若只检查顶点编号u<v，会漏掉什么？
          - 原图0到2、1到2、2到3，原序[0,1,2,3]：新增1到0为何不能直接判环？
          - 新增3到0时，应搜索哪两个顶点、哪个方向？
  - type: content
    kicker: 检查答案
    title: 课堂检查参考
