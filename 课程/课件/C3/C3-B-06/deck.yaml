  - type: content
    kicker: 解题过程
    title: 新增弧成环的充要条件
    blocks:
      - type: bullets
        items:
          - u=v：新弧本身就是自环。
          - u 位于 v 之前：新弧与原序一致，原序仍合法。
          - u 位于 v 之后：原序失效，需要检查原图是否存在 v 到 u 的路径。
          - 存在 v→…→u：与新弧 u→v 合成环；否则仍是 DAG。
  - type: content
