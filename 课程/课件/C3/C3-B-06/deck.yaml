  - type: content
    kicker: 答案代码
    title: 验证拓扑序的实现（1/2）
    blocks:
      - type: code
        text: |-
          bool isTopo(const Graph *G,const int order[]) {
              int *pos=(int*)malloc(G->V*sizeof(int));
              if (pos==NULL) abort();
              for (int i=0;i<G->V;++i) pos[i]=-1;
              for (int i=0;i<G->V;++i) {
                  int x=order[i];
                  if (x<0 || x>=G->V || pos[x]!=-1) {
                      free(pos); return false;
                  }
                  pos[x]=i;
  - type: content
    kicker: 答案代码
    title: 验证拓扑序的实现（2/2）
    blocks:
      - type: code
        text: |-
          }
              for (int u=0;u<G->V;++u)
                  for (const Arc *e=G->head[u];e!=NULL;e=e->next)
                      if (pos[u]>=pos[e->to]) {
                          free(pos); return false;
                      }
              free(pos); return true;
          }
  - type: content
    kicker: 解题过程
    title: 验证题的完整答案应交代充分性
    blocks:
      - type: bullets
        items:
          - 必要性：拓扑序必须让每条弧的起点先于终点。
          - 充分性：若序列是全部顶点的排列且每条弧都向后，它就是拓扑序。
          - 时间 O(V+E)：构造位置表后，每条弧只检查一次。
          - 辅助空间 O(V)：位置数组；不修改原图。
  - type: content
    kicker: 解题过程
    title: 验证拓扑序的思想段与代码对应
    blocks:
      - type: bullets
        items:
          - 建立顶点位置表，并检查候选序列的编号范围与重复情况。
          - 遍历邻接表中的每条弧u到v，若pos[u]≥pos[v]则返回假。
          - 若排列合法且所有弧均符合先后关系，返回真。
          - 构造位置表O(V)，检查全部弧O(E)，辅助位置表O(V)。
  - type: content
    kicker: 解题过程
    title: 模拟卷六：新增一条弧后三种状态
    blocks:
      - type: bullets
        items:
          - 原图为 DAG，sigma 已验证为合法完整拓扑序。
          - 计划增加原图不存在的弧 u→v，允许 u=v；检查时不修改 G。
          - 返回：原序仍可用、需要重排但仍无环、已经成环。
          - 不要求输出新拓扑序；时间和空间按当前实现分析。
