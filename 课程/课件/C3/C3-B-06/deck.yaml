        items:
          - 序列中pos[0]=2、pos[2]=0，违反0到2；仅比较编号0<2会漏判。
          - 新增1到0后可用[1,0,2,3]，旧序失效但无环。
          - 新增3到0应查原图0到3；路径0、2、3存在，所以成环。
