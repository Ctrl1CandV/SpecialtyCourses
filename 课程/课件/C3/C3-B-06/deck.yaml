  - type: content
    kicker: 解题过程
    title: 顺序一致的新增弧无需再搜索
    blocks:
      - type: bullets
        items:
          - 原序合法意味着每条原图路径上的位置严格递增。
          - 若pos[u]<pos[v]，原图不可能存在从v回到u的路径。
          - 新增u到v与原序方向一致，直接返回原序仍可用。
          - 只有逆序且非自环的分支需要查询v到u。
  - type: content
    kicker: 答案代码
    title: 只检查反向可达性（1/3）
    blocks:
      - type: code
        text: |-
          bool reachable(const Graph *G,int x,int target,unsigned char seen[]) {
              if (x==target) return true;
              seen[x]=1;
              for (const Arc *e=G->head[x];e!=NULL;e=e->next)
                  if (!seen[e->to] && reachable(G,e->to,target,seen)) return true;
              return false;
          }
  - type: content
    kicker: 答案代码
    title: 只检查反向可达性（2/3）
    blocks:
      - type: code
        text: |-
          State classifyArc(const Graph *G,const int sigma[],int u,int v) {
              if (u==v) return CYCLE;
              int pu=-1,pv=-1;
              for (int i=0;i<G->V;++i) {
                  if (sigma[i]==u) pu=i;
                  if (sigma[i]==v) pv=i;
              }
              if (pu<pv) return ORDER_OK;
  - type: content
    kicker: 答案代码
    title: 只检查反向可达性（3/3）
    blocks:
      - type: code
        text: |-
          unsigned char *seen=(unsigned char*)calloc(G->V,1);
              if (seen==NULL) abort();
              bool back=reachable(G,v,u,seen);
              free(seen);
              return back ? CYCLE : REORDER;
          }
  - type: content
    kicker: 解题过程
    title: 加弧分类题的思想段按判定顺序写
    blocks:
      - type: bullets
        items:
          - 若u=v，新增自环，返回成环。
          - 在合法原序中找到两个端点的位置，顺序一致则原序仍可用。
          - 顺序相反时，在未修改的原图中搜索v是否可达u。
          - 可达则成环，不可达则图仍无环但需要重排。
  - type: content
    kicker: 解题过程
    title: 按分支写出时间与空间
    blocks:
      - type: bullets
        items:
          - 自环分支 O(1)；只比较原序位置的分支 O(V)。
          - 必要时搜索原图 v 到 u，最坏 O(V+E)。
          - 总最坏时间 O(V+E)。
          - seen 数组与递归栈各至多 O(V)，辅助空间 O(V)。
