  - type: content
    kicker: 解题过程
    title: 在同一次回溯中维护经过状态
    blocks:
      - type: bullets
        items:
          - hasW 表示当前路径是否已经经过 w。
          - 进入 u 后更新 hasW = hasW || u==w。
          - 到达 t 时，仅当 hasW 为真才成功；否则该分支失败。
          - hasW 按值传递，返回时自动恢复；used 仍须显式撤销。
