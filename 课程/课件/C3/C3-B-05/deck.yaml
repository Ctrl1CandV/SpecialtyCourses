  - type: content
    kicker: 解题过程
    title: 函数参数对应当前搜索状态
    blocks:
      - type: bullets
        items:
          - dfs(u,d)：当前在u，已经走过d条边。
          - path[d]=u；used仅标记当前候选路径上的顶点。
          - d==k时只检查u==t，边数用尽后不再扩展。
          - 所有邻点分支均失败后撤销used[u]；子调用负责恢复它自己的标记。
  - type: content
    kicker: 解题过程
    title: 回溯时恢复的是刚刚结束的调用
    blocks:
      - type: table
        head:
          - 时刻
          - 仍在当前路径的顶点
          - 动作
        rows:
          - - 进入s、a、x、t
            - s、a、x、t
            - 当前边数3，继续尝试但无可用邻点
          - - t返回失败
            - s、a、x
            - t撤销used[t]
          - - x返回失败
            - s、a
            - x撤销used[x]
          - - a返回失败
            - s
            - a撤销used[a]
          - - s转入b
            - s、b
            - s保持已标记
  - type: content
    kicker: 答案代码
    title: 定长简单路径的实现（1/2）
    blocks:
      - type: code
        text: |-
          bool exactDFS(const Graph *G,int u,int t,int k,int d,
                        unsigned char used[],int path[]) {
              path[d]=u;
              if (d==k) return u==t;
              used[u]=1;
              for (const Arc *e=G->head[u];e!=NULL;e=e->next)
                  if (!used[e->to] &&
                      exactDFS(G,e->to,t,k,d+1,used,path)) return true;
              used[u]=0; return false;
          }
  - type: content
    kicker: 答案代码
    title: 定长简单路径的实现（2/2）
    blocks:
      - type: code
        text: |-
          bool exactPath(const Graph *G,int s,int t,int k,int path[]) {
              if (k<0 || k>=G->V) return false;
              unsigned char *used=(unsigned char*)calloc(G->V,1);
              if (used==NULL) abort();
              bool ok=exactDFS(G,s,t,k,0,used,path);
              free(used);
              return ok;
          }
  - type: content
    kicker: 解题过程
    title: 定长路径题的答案思想与边界
    blocks:
      - type: bullets
        items:
          - 从s开始深度优先搜索，记录当前路径与已经经过的边数d。
          - 仅向当前路径未使用的邻点扩展，防止重复顶点。
          - d达到k时检查当前结点是否为t，成功保留路径，失败逐层回溯。
          - k=0时仅s=t成立；k≥V时不存在简单路径。
  - type: content
    kicker: 解题过程
    title: 2025 题意整理：一条路径经过 w
    blocks:
      - type: bullets
        items:
          - 图为有向或无向简单图，以邻接表存储；输出 s 到 t 且经过 w 的简单路径。
          - 课堂约定 s、t、w 两两不同；不存在则输出 −1。
          - 路径上每个顶点最多出现一次，边方向必须遵守图的定义。
          - 不能仅证明 s 能到 w、w 能到 t，就认定存在所需简单路径。
