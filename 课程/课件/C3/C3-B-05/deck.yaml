          - 成功到t时len=d+1=5，输出path前5个顶点。
  - type: content
    kicker: 答案代码
    title: 经过指定点的实现（1/3）
    blocks:
      - type: code
        text: |-
          bool throughDFS(const Graph *G,int u,int t,int w,int d,
                          bool hasW,unsigned char used[],int path[],int &len) {
              used[u]=1; path[d]=u; hasW=hasW || u==w;
              if (u==t) {
                  if (hasW) { len=d+1; return true; }
                  used[u]=0; return false;
              }
  - type: content
    kicker: 答案代码
    title: 经过指定点的实现（2/3）
    blocks:
      - type: code
        text: |-
          for (const Arc *e=G->head[u];e!=NULL;e=e->next)
                  if (!used[e->to] &&
                      throughDFS(G,e->to,t,w,d+1,hasW,used,path,len)) return true;
              used[u]=0; return false;
          }
  - type: content
    kicker: 答案代码
    title: 经过指定点的实现（3/3）
    blocks:
      - type: code
        text: |-
          bool pathThrough(const Graph *G,int s,int t,int w,int path[],int &len) {
              len=0;
              unsigned char *used=(unsigned char*)calloc(G->V,1);
              if (used==NULL) abort();
              bool ok=throughDFS(G,s,t,w,0,false,used,path,len);
              free(used); return ok;
          }
  - type: content
    kicker: 解题过程
    title: 经过指定点题的答案如何写完整
    blocks:
      - type: bullets
        items:
          - 在同一次DFS中保存路径内标记及是否经过w，始终禁止重复顶点。
          - 到达t时根据hasW判定成功，失败时恢复本层标记。
          - 成功保留path和len并输出，不存在时输出−1。
          - 主函数初始化len与used，每次查询重新建立状态。
  - type: content
    kicker: 解题过程
    title: 回溯搜索不能套用普通遍历复杂度
    blocks:
      - type: bullets
        items:
          - 同一顶点可在不同候选路径中被多次访问。
          - 设搜索状态数为 S：每状态扫描至多 V−1 条邻边，时间 O(SV)。
          - S 随简单路径前缀数量增长，最坏可能达到阶乘规模。
          - 辅助 visited 和递归路径均为 O(V)。
          - 仅避开 w 的可达性题可用永久标记，时间 O(V+E)。
  - type: content
    kicker: 解题过程
    title: 永久标记与回溯标记依据的状态不同
    blocks:
      - type: table
        head:
          - 问题
          - 两次到达x能否共用已搜索结果
        rows:
          - - 只问x能否到达t
            - 后续目标和允许通行的图相同，可以共用
          - - 要求恰有k条边
            - 剩余边数可能不同，不能仅按x合并
          - - 要求简单路径经过w
            - 已使用顶点集合与经过状态可能不同
          - - 当前实现的计时
            - 统计展开的路径状态数S，再统计各状态扫描的邻边
  - type: content
    kicker: 解题过程
    title: 课堂检查：回放一个成功分支
    blocks:
      - type: bullets
        items:
          - 无向边：s–a、a–w、w–b、b–t、a–t。
          - 找一条经过 w 的 s 到 t 简单路径。
          - 如果先试 s→a→t，应在何处撤销哪些状态？
          - 写最终路径，并指出 hasW 为什么不需要手工改回 false。
  - type: content
    kicker: 检查答案
    title: 课堂检查参考
    blocks:
      - type: bullets
        items:
          - 成功路径：s→a→w→b→t。
          - 失败到达 t 时撤销 used[t]；a 仍在当前路径中。
          - hasW 为每层局部副本，used 为共享数组，恢复方式不同。
