          - 占用范围
          - 元素数
        rows:
          - - 栈0
            - 0…top[0]
            - top[0]+1
          - - 空位
            - top[0]+1…top[1]−1
            - top[1]−top[0]−1
          - - 栈1
            - top[1]…m−1
            - m−top[1]
          - - 判满
            - 空位数为0
            - top[0]+1==top[1]
