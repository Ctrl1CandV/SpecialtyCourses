  - type: content
    kicker: 解题过程
    title: 入栈与出栈的五个空
    blocks:
      - type: code
        text: |-
          // Push：满时 return false
          if (①) return false;
          if (i == 0) S.data[②] = x;
          else S.data[③] = x;
          // Pop：空时 return false
          if (S.top[i] == S.bot[i]) return false;
          if (i == 0) x = S.data[④];
          else x = S.data[⑤];
  - type: content
    title: 前置与后置运算由一次操作推导
    blocks:
      - type: table
        head:
          - 操作
          - 先做什么
          - 再做什么
          - 表达式
        rows:
          - - 左入栈
            - top0加1
            - 在新top0写x
            - data[++top0]=x
          - - 右入栈
            - top1减1
            - 在新top1写x
            - data[--top1]=x
          - - 左出栈
            - 读旧top0给x
            - top0减1
            - x=data[top0--]
          - - 右出栈
            - 读旧top1给x
            - top1加1
            - x=data[top1++]
      - type: note
        text: 前提：入栈已通过判满，出栈已通过本栈判空。
