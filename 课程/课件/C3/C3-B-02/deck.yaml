          - rear改到d后，rear->next仍指队首a。
          - 每一步只改固定个指针，不扫描整个队列。
  - type: content
    kicker: 解题过程
    title: 出队时区分一结点和多结点
    blocks:
      - type: code
        text: |-
          LinkNode *DeQueue(LinkQueue *Q) {
              if (Q->rear == NULL) return NULL;
              LinkNode *p = Q->rear->next;
              if (Q->rear == p) {
                  ②;
              } else {
                  Q->rear->next = p->next;
              }
              return p;
          }
  - type: content
    title: 最后一个结点出队后，rear必须为空
    blocks:
      - type: table
        head:
          - 出队前状态
          - 正确更新
          - 继续按多结点处理的后果
        rows:
          - - rear和p指同一结点e
            - rear=NULL
            - rear仍指向已出队的e
          - - e->next=e
            - 返回e，由调用者使用和释放
            - 再次出队会重复返回e
          - - 重新入队新结点f
            - f->next=f，rear=f
            - 若旧e已释放，还会访问悬空地址
      - type: bullets
        items:
          - 用rear==p判断唯一结点，空队列只由rear=NULL表示。
  - type: content
    kicker: 解题过程
    title: 沿操作序列检查状态
    blocks:
      - type: table
        head:
          - 操作
          - 队列逻辑次序
          - rear
        rows:
          - - 入 a、入 b、入 c
            - a → b → c
            - c
          - - 出队
            - b → c，返回 a
            - c
          - - 入 d
            - b → c → d
            - d
          - - 连续出 b、c、d
            - 空
            - 'NULL'
          - - 再次入 e
            - 只有 e，e->next=e
            - e
  - type: content
    kicker: 解题过程
    title: 队列题的完整作答
    blocks:
      - type: bullets
        items:
          - ① p->next = Q->rear->next
          - ② Q->rear = NULL
          - 每次入队、出队均为 O(1) 时间、O(1) 辅助空间。
          - 入队前结点必须独立；出队后由调用者管理其生命周期。
  - type: content
    title: 循环队列题的作答依据
    blocks:
      - type: bullets
        items:
          - 非空入队先让新结点连原队首，再让原尾连新结点，最后更新rear。
          - 出队先保存rear->next。若它就是rear，删除后将rear置空。
          - 否则使尾结点越过旧队首，返回保存的结点。
          - 操作只修改固定条连接，入队和出队各为O(1)。
  - type: content
    kicker: 解题过程
    title: 2026 阅读题：两个栈共用一个数组
    blocks:
      - type: bullets
        items:
          - 数组有效下标 0…m−1，栈0向右增长，栈1向左增长。
          - top[0] 初值 −1，top[1] 初值 m；top 指已入栈的栈顶。
          - 入栈失败返回 false；出栈成功通过引用 x 返回元素。
          - 补全判满、两侧入栈和两侧出栈的五处表达式。
  - type: content
