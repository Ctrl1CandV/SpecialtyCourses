  - type: content
    kicker: 解题过程
    title: 共享栈的结构和初始化
    blocks:
      - type: code
        text: |-
          const int CAP = 100;
          struct TwStack { int data[CAP], top[2], bot[2], m; };
          void InitStack(TwStack &S, int m) {
              S.m = m;
              S.bot[0] = S.top[0] = -1;
              S.bot[1] = S.top[1] = m;
          }
  - type: content
    kicker: 答案代码
    title: 共享栈操作答案（1/2）
    blocks:
      - type: code
        text: |-
          bool Push(TwStack &S, int i, int x) {
              if (S.top[0] + 1 == S.top[1]) return false;
              if (i == 0) S.data[++S.top[0]] = x;
              else S.data[--S.top[1]] = x;
              return true;
          }
  - type: content
    kicker: 答案代码
    title: 共享栈操作答案（2/2）
    blocks:
      - type: code
        text: |-
          bool Pop(TwStack &S, int i, int &x) {
              if (S.top[i] == S.bot[i]) return false;
              if (i == 0) x = S.data[S.top[0]--];
              else x = S.data[S.top[1]++];
              return true;
          }
  - type: content
    title: 单次操作与整段操作序列的复杂度
    blocks:
      - type: bullets
        items:
          - Push和Pop各只做固定次判断与读写，单次时间O(1)。
          - 连续执行r次操作，总时间O(r)，失败操作也有常数开销。
          - data是栈的存储结构。单次操作只用固定临时变量，辅助空间O(1)。
          - 出栈成功才使用x。失败调用不会产生一个新的输出元素。
  - type: content
    kicker: 解题过程
    title: 课堂检查：输出和操作次数
    blocks:
      - type: bullets
        items:
          - m=4，初始化后执行：Push0(1)、Push1(9)、Push0(2)、Pop1。
          - 接着执行：Push1(8)、Push1(7)、Push0(3)、Pop0、Pop1。
          - 按顺序写出三次成功出栈的 x 值。
          - 统计成功入栈次数和失败入栈次数。
  - type: content
    kicker: 检查答案
    title: 课堂检查参考
    blocks:
      - type: bullets
        items:
          - 三次出栈值依次为 9、2、7。
          - 成功入栈5次，失败入栈1次；失败的是 Push0(3)。
          - 最后左栈为 [1]，右栈从底到顶为 [8]。
