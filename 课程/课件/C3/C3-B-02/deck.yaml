  - type: content
    kicker: 解题过程
    title: 入队时保存原队首
    blocks:
      - type: code
        text: |-
          void EnQueue(LinkQueue *Q, LinkNode *p) {
              if (Q->rear == NULL) {
                  Q->rear = p;
                  p->next = p;
              } else {
                  ①;
                  Q->rear->next = p;
                  Q->rear = p;
              }
          }
  - type: content
    title: 入队完成后，回边从新尾d指向a
    blocks:
