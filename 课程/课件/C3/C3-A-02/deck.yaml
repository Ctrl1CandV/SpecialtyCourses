  - type: content
    kicker: 算法补缺
    title: 稳定删除区间值的代码
    blocks:
      - type: code
        text: |
          int RemoveRange(int a[], int n, int lo, int hi){
              int write=0;
              for(int read=0; read<n; ++read)
                  if(a[read]<lo || a[read]>hi)
                      a[write++]=a[read];
              return write;
          }
      - type: bullets
        items:
          - 前提lo≤hi；时间O(n)，额外空间O(1)，保留次序不变。
  - type: content
    title: 稳定压缩的思想与工作量
    blocks:
      - type: bullets
        items:
          - 用read扫描输入，write表示已保留元素数。
          - 若当前值在删除区间外，将其写入a[write]并增加write。
          - 扫描结束返回write，a[0…write−1]就是保持原次序的结果。
          - read走n次，每次至多一次写入，时间O(n)、空间O(1)。
  - type: content
    kicker: 算法补缺
    title: 有序去重也可以维护一个有效前缀
    blocks:
      - type: code
        text: |
          int UniqueSorted(int a[], int n){
              if(n==0) return 0;
              int write=1;
              for(int read=1; read<n; ++read)
                  if(a[read]!=a[write-1])
                      a[write++]=a[read];
              return write;
          }
      - type: bullets
        items:
          - '[1,1,2,2,2,4] → 有效前缀[1,2,4]，返回3。'
  - type: content
    kicker: 算法补缺
    title: 无序有界去重需要两类状态
    blocks:
      - type: bullets
        items:
          - 输入无序，且保证0≤a[i]≤M；保留每个值第一次出现的次序。
          - seen[x]：x以前是否出现；write：已经保留的元素数。
          - 若seen[x]为假：a[write++]=x，并把seen[x]置真。
          - 时间O(n+M)，额外空间O(M)；原数组允许原地修改。
  - type: content
    title: 先排序再去重会改变首次出现的顺序
    blocks:
