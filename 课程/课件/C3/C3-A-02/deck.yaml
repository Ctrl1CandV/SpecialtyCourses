            - 题目要求
          - - 排序后再去重
            - '[1,2,3]'
            - 顺序改变
          - - 只与前一个保留值比较
            - '[3,1,3,2,1]'
            - 漏掉非相邻重复值
      - type: bullets
        items:
          - 有界标记记录全体已见值，读写指针维护原次序。
  - type: content
    kicker: 算法补缺
    title: 两端指针依靠有序条件排除候选
    blocks:
      - type: bullets
        items:
          - 输入非递减数组，找i<j，使a[i]+a[j]=target。
          - left=0，right=n−1；只在left<right时比较。
          - 和太小：固定left已不可能成功，left前进。
          - 和太大：固定right已不可能成功，right后退。
  - type: content
    kicker: 过程推演
    title: 从两端开始，逐次排除不可能的位置
    blocks:
      - type: bullets
        items:
          - 数组[1,2,4,7,9,11]；下标从0开始。
      - type: table
        head:
          - 目标
          - left值
          - right值
          - 和
          - 动作
        rows:
          - - '13'
            - '1'
            - '11'
            - '12'
            - left前进
          - - '13'
            - '2'
            - '11'
            - '13'
            - 返回下标(1,5)
          - - '10'
            - '1'
            - '11'
            - '12'
            - right后退
          - - '10'
            - '1'
            - '9'
            - '10'
            - 返回下标(0,4)
  - type: content
    kicker: 算法补缺
    title: 移动一端的理由要能说完整
    blocks:
      - type: bullets
        items:
          - 和太小：对任意j≤right，有a[left]+a[j]≤当前和<target。
          - 和太大：对任意i≥left，有a[i]+a[right]≥当前和>target。
          - 没有有序条件时，上述排除理由不成立。
          - 若先排序，时间和原下标的维护都要重新分析。
  - type: content
    title: 无序数组会使两端排除漏掉正确答案
    blocks:
