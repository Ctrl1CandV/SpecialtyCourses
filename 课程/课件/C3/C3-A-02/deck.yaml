            x: 80
            'y': 50
            shape: rect
            highlight: true
        edges: []
        labels:
          - text: left=0
            x: 20
            'y': 18
          - text: right=2
            x: 80
            'y': 18
          - text: 目标和6
            x: 50
            'y': 84
        caption: 真实解为下标(1,2)，即2+4=6。
      - type: bullets
        items:
          - 首轮3+4=7，照搬有序规则会错误排除右端4。
          - 余下3和2不能凑6，最终漏掉已有答案。
  - type: content
    kicker: 算法补缺
    title: 两端指针的代码
    blocks:
      - type: code
        text: |
          bool TwoSumSorted(const int a[], int n, long long target,
                            int &i, int &j){
              int left=0, right=n-1;
              while(left<right){
                  long long sum=(long long)a[left]+a[right];
                  if(sum==target){ i=left; j=right; return true; }
                  if(sum<target) ++left; else --right;
              }
              return false;
          }
  - type: content
    title: 两端求和题的完整思想与复杂度
    blocks:
      - type: bullets
        items:
          - 在非递减数组中，从left=0、right=n−1开始。
          - 和小于目标时排除left，大于目标时排除right，相等即返回下标。
          - 排除依据：固定被舍弃端点，与其余候选组合都不能达到目标。
          - 每次失败比较使right−left减1，最多n−1轮，辅助空间O(1)。
  - type: content
    kicker: 算法补缺
    title: 读题时怎样决定用哪一种方法
    blocks:
      - type: table
        head:
          - 题目条件
          - 优先考虑
          - 额外核对
        rows:
          - - 值域可控，需记录出现
            - 标记表
            - 范围、初始化代价
          - - 原地保留，相对次序不变
            - 读写指针
            - 写入不越过读取
          - - 已有序，比较可排除一端
            - 两端指针
            - 移动理由、位置是否不同
  - type: content
    kicker: 算法补缺
    title: 课后练习：无序有界去重
    blocks:
      - type: bullets
        items:
          - a[0…n−1]的值都在0…M中，原地去重，保留首次出现次序。
          - 函数返回新长度；辅助数组允许使用。
          - 例：[3,1,3,0,2,1,0] → [3,1,0,2]。
          - 写思想、代码及时间和空间复杂度。
  - type: content
    kicker: 算法补缺
    title: 参考答案：初始化与原地保留
    blocks:
      - type: code
        text: |
          int UniqueBounded(int a[], int n, int M){
              bool *seen=(bool*)malloc((M+1)*sizeof(bool));
              if(seen==NULL) return -1;
              for(int x=0; x<=M; ++x) seen[x]=false;
              int write=0;
              for(int read=0; read<n; ++read){
                  int x=a[read];
                  if(!seen[x]){ a[write++]=x; seen[x]=true; }
              }
  - type: content
    kicker: 算法补缺
    title: 参考答案：返回与复杂度
    blocks:
      - type: code
        text: |2
              free(seen);
              return write;
          }
      - type: bullets
        items:
          - 返回有效前缀长度；保留第一次出现的顺序。
          - 时间O(n+M)，额外空间O(M)。
          - 前提n≥0、M≥0且0≤a[i]≤M；空数组返回0。
