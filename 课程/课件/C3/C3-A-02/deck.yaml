  - type: content
    kicker: 算法补缺
    title: 标记数组先由取值范围确定大小
    blocks:
      - type: bullets
        items:
          - 若合法值为0…M，可令seen[x]表示x是否出现。
          - 初始化M+1个标记，扫描n个元素：O(n+M)时间。
          - 辅助空间O(M)；值域很大时不宜直接开表。
          - 先判值域，再访问下标；n是元素个数，M是值域上界。
  - type: content
    kicker: 算法补缺
    title: 求最小缺失正整数，先缩小答案范围
    blocks:
      - type: bullets
        items:
          - 输入a[0…n−1]，可含负数、0、重复值和大于n的数。
          - 若1…n全出现，答案是n+1；否则答案在1…n中。
          - 只标记1…n；其他值直接跳过。
          - 示例：[3,−1,1,3,7,2]，最小缺失正整数是多少？
  - type: content
