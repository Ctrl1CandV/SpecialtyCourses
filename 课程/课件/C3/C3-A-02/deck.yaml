  - type: content
    kicker: 算法补缺
    title: 最小缺失值代码：建立并填写标记
    blocks:
      - type: code
        text: |
          int MissingPositive(const int a[], int n){
              bool *seen=(bool*)malloc((n+1)*sizeof(bool));
              if(seen==NULL) return -1;
              for(int x=0; x<=n; ++x) seen[x]=false;
              for(int i=0; i<n; ++i)
                  if(a[i]>=1 && a[i]<=n) seen[a[i]]=true;
      - type: bullets
        items:
          - 前提：n≥0，数组至少含n个元素；接下一页完成返回。
  - type: content
    kicker: 算法补缺
    title: 最小缺失值代码：找到答案并释放
    blocks:
      - type: code
        text: |2
              int answer=1;
              while(answer<=n && seen[answer]) ++answer;
              free(seen);
              return answer;
          }
      - type: bullets
        items:
          - 时间O(n)，额外空间O(n)；空数组答案为1。
          - a=[1,2,3]时答案为4，不访问seen[4]。
  - type: content
    title: 最小缺失正整数的完整思想段
    blocks:
      - type: bullets
        items:
          - n个元素不可能包含1至n+1的全部n+1个不同正整数。
          - 建立seen[1…n]，只记录输入中处于该范围的值。
          - 从1到n找到首个未标记值，全部已标记则返回n+1。
          - 初始化、输入扫描、答案查找各至多线性，总时间O(n)。
  - type: content
    kicker: 算法补缺
    title: 批量删除不必每删一次就搬移
    blocks:
      - type: bullets
        items:
          - 任务：删除闭区间[lo,hi]内的值，保留其他元素的原有次序。
          - read读取原数组；write指向下一个保留位置。
          - 读到应保留的值才写入，最后返回write作为新长度。
          - 有效结果是a[0…write−1]；尾部旧值无需清零。
  - type: content
    kicker: 过程推演
    title: 读写指针不会覆盖尚未读取的值
