    title: 题一：删除所有落在闭区间内的元素
    blocks:
      - type: bullets
        items:
          - A[0…n−1]为非递减整数顺序表，允许重复值和空表。
          - 删除所有满足x≤A[i]≤y的元素，保留其余元素的相对顺序。
          - 原地更新n并返回删除个数；x>y时不作修改、返回0。
          - 请设计算法，写出思想、代码及时间、辅助空间复杂度。
      - type: note
        text: 据机构模拟卷二算法第1题题解整理；本讲以两次二分定位为重点。
