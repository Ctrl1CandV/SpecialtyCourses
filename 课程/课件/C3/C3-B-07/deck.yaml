            - 两者均为0
            - 删除0个
          - - 删除值域位于全部元素右侧
            - 两者均为n
            - 删除0个
          - - 全部元素命中
            - first=0，after=n
            - 新n=0
          - - x=y且该值重复
            - 包住全部重复值
            - 一次删除整组
  - type: content
