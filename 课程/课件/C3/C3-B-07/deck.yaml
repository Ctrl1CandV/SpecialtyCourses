  - type: content
    kicker: 答案代码
    title: 表达式输出：空树与叶结点
    blocks:
      - type: code
        text: |-
          void printExpr(const BTree *t, int isRoot) {
              if (t == NULL) return;
              if (t->left == NULL && t->right == NULL) {
                  printf("%s", t->data);
                  return;
              }
              if (!isRoot) printf("(");
  - type: content
    kicker: 答案代码
    title: 表达式输出：按孩子数量选择顺序
    blocks:
      - type: code
        text: |2-
              if (t->left == NULL || t->right == NULL) {
                  printf("%s", t->data);
                  printExpr(t->left ? t->left : t->right, 0);
              } else {
                  printExpr(t->left, 0);
                  printf("%s", t->data);
                  printExpr(t->right, 0);
              }
  - type: content
    kicker: 答案代码
    title: 表达式输出：配对括号与调用入口
    blocks:
      - type: code
        text: |2-
              if (!isRoot) printf(")");
          }
          void Infix(const BTree *root) {
              printExpr(root, 1);
          }
      - type: bullets
        items:
          - 示例完整输出：(a*b)+(−(c−d))
  - type: content
    kicker: 解题过程
    title: 题二的完整答案与复杂度
    blocks:
      - type: bullets
        items:
          - 思想：按叶、单目、二元分类递归输出，非根运算子树加括号。
          - 每个结点访问一次；字符串长度有常数上界，时间O(n)。
          - 递归栈随树高增长，辅助空间O(h)，最坏O(n)。
          - 若字符串长度无固定上界，应另计实际输出字符总量L。
  - type: content
    kicker: 解题过程
    title: 表达式题的思想段交代输出规则
    blocks:
      - type: bullets
        items:
          - 递归处理当前子树，空树不输出，叶结点输出完整操作数字符串。
          - 单目结点先输出运算符，再递归唯一孩子，兼容孩子在左或右。
          - 二元结点依次输出左子表达式、运算符和右子表达式。
          - 除整式根外，每个运算子树在进入和退出时配一对括号。
  - type: content
    kicker: 解题过程
    title: 课堂检查：把题目条件落实到答案
    blocks:
      - type: bullets
        items:
          - A=[1,2,2,5]，删除[2,2]：first、after、新n分别是多少？
          - A=[1,3,5]，删除[6,8]：会不会读取A[n]或搬移元素？
          - 表达式树根为单目负号，唯一左孩子为叶x：输出什么？
          - 若取消操作数字符串长度上界，复杂度应如何写？
  - type: content
    kicker: 参考答案
    title: 课堂检查参考
    blocks:
      - type: bullets
        items:
          - 第一问：first=1，after=3，新n=2，删除2个。
          - 第二问：first=after=3；不读A[3]，不搬移，返回0。
          - 第三问：输出−x；整式根不额外加外括号。
          - 第四问：时间O(n+L)，辅助栈O(h)。
