          - 已排除的左侧
          - 已确定的右侧
        rows:
          - - first：首个A[i]≥x
            - 下标小于lo处均小于x
            - 下标不小于hi处均不小于x
          - - after：首个A[i]>y
            - 下标小于lo处均不大于y
            - 下标不小于hi处均大于y
          - - lo==hi
            - 待搜索区间为空
            - 交界位置即答案
      - type: bullets
        items:
          - mid只在lo<hi时计算，因此始终有mid<n。
  - type: content
    kicker: 答案代码
    title: 删除函数：定位左边界
    blocks:
      - type: code
        text: |-
          int DeleteRange(int A[], int *n, int x, int y) {
              if (*n == 0 || x > y) return 0;
              int lo = 0, hi = *n;
              while (lo < hi) {
                  int mid = lo + (hi - lo) / 2;
                  if (A[mid] < x) lo = mid + 1;
                  else hi = mid;
              }
              int first = lo;
  - type: content
    kicker: 答案代码
    title: 删除函数：定位右边界
    blocks:
      - type: code
        text: |2-
              hi = *n;
              while (lo < hi) {
                  int mid = lo + (hi - lo) / 2;
                  if (A[mid] <= y) lo = mid + 1;
                  else hi = mid;
              }
              int after = lo;
              int removed = after - first;
              if (removed == 0) return 0;
  - type: content
    kicker: 答案代码
    title: 删除函数：一次搬移并更新长度
    blocks:
      - type: code
        text: |2-
              for (int k = after; k < *n; ++k)
                  A[k - removed] = A[k];
              *n -= removed;
              return removed;
          }
      - type: bullets
        items:
          - 例中removed=6，只把A[8]写到A[2]。
          - 新长度为3，有效数组是−3，−1，9。
