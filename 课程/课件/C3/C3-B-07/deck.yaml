  - type: content
    kicker: 解题过程
    title: 题一的思想段与复杂度
    blocks:
      - type: bullets
        items:
          - 思想：利用有序性二分定位两个边界，再将保留后缀一次性前移。
          - 两次边界查找合计O(log n)。
          - 命中区间时搬移n−after个元素；最坏时间O(n)。
          - 辅助空间O(1)；没有命中时不搬移。
  - type: content
