    kicker: 答案代码
    title: 差集的完整实现（1/2）
    blocks:
      - type: code
        text: |-
          void listDifference(DiffNode *A, const DiffNode *B) {
              DiffNode *prev = A, *pa = A->next;
              const DiffNode *pb = B->next;
              while (pa != NULL && pb != NULL) {
                  if (pa->data < pb->data) {
                      prev = pa; pa = pa->next;
                  } else if (pa->data > pb->data) {
                      pb = pb->next;
                  } else {
  - type: content
    kicker: 答案代码
    title: 差集的完整实现（2/2）
    blocks:
      - type: code
        text: |-
          DiffNode *old = pa;
                      pa = pa->next;
                      prev->next = pa;
                      free(old);
                      pb = pb->next;
                  }
              }
          }
  - type: content
    title: 释放结点之前必须取得仍要使用的地址
    blocks:
      - type: table
        head:
          - 步骤
          - 语句
          - 需要保证的事实
        rows:
          - - 保存待删地址
            - old=pa
            - 最后仍能释放原结点
          - - 先取后继
            - pa=pa->next
            - 当前pa尚未释放
          - - 恢复保留链
            - prev->next=pa
            - 前驱越过待删结点
          - - 释放原结点
            - free(old)
            - 此后不再读old的字段
      - type: bullets
        items:
          - 相等分支中prev不动，pb只向后移动一次。
  - type: content
    kicker: 解题过程
    title: 把答案中的理由写具体
    blocks:
      - type: bullets
        items:
          - 基本思想：双游标比较；保留较小的 A，跳过较小的 B，相等时删除 A。
          - 正确性：有序性保证被跳过的值不再与另一表余段匹配。
          - 时间 O(m+n)：每个游标只单向扫描一次。
          - 辅助空间 O(1)：只用固定数量指针，不复制原结点。
  - type: content
    title: 差集算法的完整思想段
    blocks:
      - type: bullets
        items:
          - pa、pb指两表首元，prev初始指A头结点，始终是pa的保留前驱。
          - A值较小则保留并推进A，B值较小只推进B。
          - 相等时从A重连删除并释放当前结点，prev不动，两游标后移。
          - 任一表结束即停止。B用尽时A余段保留，全程不改B。
  - type: content
