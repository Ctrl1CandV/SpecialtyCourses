    title: 括号匹配的实现（1/2）
    blocks:
      - type: code
        text: |-
          bool matchPair(char a, char b) {
              return (a=='(' && b==')') || (a=='[' && b==']') ||
                     (a=='{' && b=='}');
          }
          bool bracketsMatch(const CharNode *L) {
              char st[BCAP]; int top = -1;
              for (const CharNode *p=L->next; p!=L; p=p->next) {
                  char c = p->ch;
  - type: content
    kicker: 答案代码
    title: 括号匹配的实现（2/2）
    blocks:
      - type: code
        text: |-
          if (c=='(' || c=='[' || c=='{') st[++top]=c;
                  else if (c==')' || c==']' || c=='}') {
                      if (top==-1 || !matchPair(st[top],c)) return false;
                      --top;
                  }
              }
              return top==-1;
          }
  - type: content
    kicker: 解题过程
    title: 综合题的复杂度与边界
    blocks:
      - type: bullets
        items:
          - 字符逐个扫描，匹配检查为 O(1)，总时间 O(n)。
          - 栈的逻辑使用量最坏 O(n)；当前定容实现分配 O(BCAP)。
          - 空表：L->next=L，返回 true；不访问头结点的字符域。
          - 链表和栈不能共用停止条件；返回 false 时也没有修改输入。
  - type: content
    title: 括号匹配题的完整思想段
    blocks:
      - type: bullets
        items:
          - 从L->next扫描至再次到L，用栈记录尚未匹配的左括号。
          - 左括号入栈，普通字符忽略，右括号必须与非空栈顶同类。
          - 匹配后出栈，失配立即失败，扫描结束且栈空才成功。
          - 时间O(n)。逻辑栈深最坏n，当前定容数组分配BCAP格。
  - type: content
    kicker: 解题过程
    title: 课堂检查：修改后的程序错在哪里
    blocks:
      - type: bullets
        items:
          - 删除差集结点后执行 prev=pa，会影响哪一种输入？
          - 括号匹配把 p!=L 改为 p!=NULL，能否结束？
          - 括号匹配遇到右括号只执行 --top，不检查类型。
          - 各给一个反例，并写出修复语句。
  - type: content
