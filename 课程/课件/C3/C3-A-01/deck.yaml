  - type: content
    title: 分点题的思想与复杂度可以这样写
    blocks:
      - type: bullets
        items:
          - 将n个数据结点按每组至多k个处理，共有⌈n/k⌉组。
          - fast消耗每组，slow从第1个结点起，只在仍有下一组时前进。
          - 结束时slow位序等于组数，返回所需的向上取整分点。
          - fast总共走n步，slow走⌈n/k⌉−1步，时间O(n)、空间O(1)。
