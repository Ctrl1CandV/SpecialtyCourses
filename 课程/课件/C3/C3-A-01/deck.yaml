          - - 复位后找入口
            - a次同速移动
          - - 合计
            - O(a+c)，即不同数据结点数的线性量级
          - - 额外存储
            - 固定个指针，O(1)
      - type: note
        text: 无环长度为n时，快指针到尾部结束，时间O(n)。
