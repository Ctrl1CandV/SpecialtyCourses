  - type: content
    kicker: 算法补缺
    title: 找环入口的完整调用
    blocks:
      - type: code
        text: |
          LNode *FindEntry(LinkList L){
              LNode *first=(L==NULL ? NULL : L->next);
              LNode *meet=Meet(first), *p=first;
              if(meet==NULL) return NULL;
              while(p!=meet){
                  p=p->next;
                  meet=meet->next;
              }
              return p;
          }
  - type: content
    title: 环入口题的完整思想段
    blocks:
      - type: bullets
        items:
          - 从首元设置快、慢指针，每轮分别前进2步和1步。
          - 快指针到空则无环。相遇后，将一个指针复位到首元。
          - 两指针改为每轮各走1步，再次相遇的结点即入口。
          - 依据相遇路程差为整圈，有a+b为环长的整数倍。
  - type: content
