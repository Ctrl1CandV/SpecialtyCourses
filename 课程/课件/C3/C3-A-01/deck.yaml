  - type: content
    kicker: 算法补缺
    title: 分点代码按组推进并返回
    blocks:
      - type: code
        text: |2
              while(fast!=NULL){
                  for(int step=0; step<k && fast!=NULL; ++step)
                      fast=fast->next;
                  if(fast!=NULL) slow=slow->next;
              }
              return slow;
          }
      - type: bullets
