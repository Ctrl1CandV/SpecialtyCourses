  - type: content
    kicker: 算法补缺
    title: 检测环时，两指针先移动再比较
    blocks:
      - type: code
        text: |
          LNode *Meet(LNode *first){
              LNode *slow=first, *fast=first;
              while(fast!=NULL && fast->next!=NULL){
                  slow=slow->next;
                  fast=fast->next->next;
                  if(slow==fast) return slow;
              }
              return NULL;
          }
