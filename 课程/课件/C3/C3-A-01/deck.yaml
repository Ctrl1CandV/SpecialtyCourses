  - type: content
    kicker: 算法补缺
    title: 为什么有环就一定能相遇
    blocks:
      - type: bullets
        items:
          - 两指针都进入环后，每轮的相对位移增加1。
          - 环长为c，至多再经过c轮便会相遇。
          - 入口前a条边：检测时间O(a+c)，额外空间O(1)。
          - 比较的是指针地址，不是结点的data。
  - type: content
    kicker: 算法补缺
    title: 相遇后，入口由路程关系确定
    blocks:
      - type: bullets
        items:
          - a：first到入口的距离；b：入口到相遇点的环上距离；c：环长。
          - 设慢指针共走T步：T=a+b+q·c；快指针走2T步。
          - 相遇时两者相差整圈：2T−T=m·c，因此a+b是c的整数倍。
          - 一个指针回first，另一个留在相遇点；二者都每次走1步。
          - 从first走a步到入口；从相遇点走a步也到入口。
