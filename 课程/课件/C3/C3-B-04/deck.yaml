  - type: content
    kicker: 答案代码
    title: 直接生成后序的实现（1/2）
    blocks:
      - type: code
        text: |-
          void fillPost(const int pre[], const int in[], int n,
                        int post[], int &out) {
              if (n==0) return;
              int left=0;
              while (in[left]!=pre[0]) ++left;
              fillPost(pre+1,in,left,post,out);
              fillPost(pre+left+1,in+left+1,n-left-1,post,out);
              post[out++]=pre[0];
          }
  - type: content
    kicker: 答案代码
    title: 直接生成后序的实现（2/2）
    blocks:
      - type: code
        text: |-
          void toPost(const int pre[], const int in[], int n, int post[]) {
              int out=0;
              fillPost(pre,in,n,post,out);
          }
  - type: content
    kicker: 解题过程
    title: 扫描根位置使最坏时间达到平方
    blocks:
      - type: bullets
        items:
          - 在每个中序段中线性寻找根。
          - 最坏左链：扫描 n、n−1、…、1 个元素。
          - 最坏时间 O(n²)，递归栈 O(h)，最坏 O(n)。
          - post 为题目给定输出数组，不计新增辅助空间。
          - 若另建值到下标的查找结构，需说明额外空间和实现条件。
  - type: content
    kicker: 解题过程
    title: 直接后序题的思想与复杂度怎样落笔
    blocks:
      - type: bullets
        items:
          - 以先序首项为根，在当前中序段找到根，得到左子树长度left。
          - 按left划分两组遍历区间，递归写左后序、右后序，最后写根。
          - 用共享输出下标out连续填充post，空区间直接返回。
          - 当前代码逐段扫描根位置，最坏时间O(n²)，辅助栈O(h)。
  - type: content
    kicker: 解题过程
    title: 课堂检查：两个输出错误
    blocks:
      - type: bullets
        items:
          - 最长路径代码只返回 treeHeight(root)，遗漏什么？
          - 直接后序代码把 out 改成值传递，会发生什么？
          - 对 pre=[1,2,3]、in=[2,1,3] 手写正确后序。
  - type: content
    kicker: 检查答案
    title: 课堂检查参考
    blocks:
      - type: bullets
        items:
          - 须补输出完整根叶结点序列，树高只是其中一个结果。
          - out 必须在子树之间共享推进；值传递会让输出位置回退。
          - 正确后序为 [2,3,1]。
