  - type: content
    kicker: 答案代码
    title: 最长根叶路径的实现（1/3）
    blocks:
      - type: code
        text: |-
          int treeHeight(const TreeNode *t) {
              if (t == NULL) return 0;
              int a=treeHeight(t->left), b=treeHeight(t->right);
              return (a>b ? a:b)+1;
          }
  - type: content
    kicker: 答案代码
    title: 最长根叶路径的实现（2/3）
    blocks:
      - type: code
        text: |-
          bool deepest(const TreeNode *t, int d, int h, int path[]) {
              if (t == NULL) return false;
              path[d] = t->data;
              if (t->left==NULL && t->right==NULL) return d+1==h;
              return deepest(t->left,d+1,h,path) ||
                     deepest(t->right,d+1,h,path);
          }
  - type: content
    kicker: 答案代码
    title: 最长根叶路径的实现（3/3）
    blocks:
      - type: code
        text: |-
          int longestPath(const TreeNode *root, int path[]) {
              int h=treeHeight(root);
              if (h!=0) deepest(root,0,h,path);
              return h;
          }
          void printLongest(const TreeNode *root, int path[]) {
              int len=longestPath(root,path);
              for (int i=0;i<len;++i) printf("%d ",path[i]);
              printf("length=%d\n",len);
          }
  - type: content
    kicker: 解题过程
    title: 最长路径的答案思想段怎样组织
    blocks:
      - type: bullets
        items:
          - 先递归计算树高h，空树高度为0。
          - 再从根开始深度优先搜索，将深度d的结点写入path[d]。
          - 遇到满足d+1=h的叶结点时成功返回，保留这条根叶路径。
          - 最后输出path的前h项及长度h。
  - type: content
    kicker: 解题过程
    title: 复制路径会改变时间分析
    blocks:
      - type: bullets
        items:
          - 本实现：求高 O(n)，再找最深叶至多 O(n)，打印 O(h)。
          - 总时间 O(n)，辅助递归栈 O(h)。
          - path 是输出数组，容量 O(h) 即可；若一并计存储，总量仍 O(h)。
          - 每遇新最优就复制整条路径的另一写法，必须额外统计复制量。
