  - type: content
    kicker: 解题过程
    title: 读代码时先确定四件事
    blocks:
      - type: table
        head:
          - 先读哪里
          - 得到什么
        rows:
          - - 函数与参数
            - 输入结构、头结点约定
          - - 循环和指针推进
            - 每轮消耗哪些结点
          - - 结果构造与返回
            - 输出方向、复用还是复制
          - - 循环后收尾
            - 还剩哪些情况必须处理
  - type: content
    kicker: 解题过程
    title: 2024 阅读题：归并成非递增链表
    blocks:
      - type: bullets
        items:
          - 两条不带头结点的链表 La、Lb 各按值非递减排列。
          - 复用原结点，合并为一条非递增链表，返回首结点。
          - 主循环选出较小结点 p，再接入结果；补全四处。
          - 读完程序后分析长度分别为 m、n 时的时间复杂度。
  - type: content
    kicker: 解题过程
    title: 先读已给出的收尾循环
    blocks:
      - type: code
        text: |-
          while (La != NULL) {
              Node *p = La;
              La = La->next;
              p->next = Lc;
              Lc = p;
          }
          // Lb 的收尾循环具有相同结构
          return Lc;
