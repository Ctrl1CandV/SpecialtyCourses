        caption: 当前余段4、2、3。已比较4与2，下一次检查3。
      - type: bullets
        items:
          - min指向已经扫描部分的最小值结点。
          - q继续向后，p保持本趟要填的位置。
  - type: content
    kicker: 解题过程
    title: 交换与推进分别填什么
    blocks:
      - type: code
        text: |-
          if (②) {
              int temp = p->data;
              p->data = min->data;
              min->data = temp;
          }
          ③;
  - type: content
    title: p=min不能代替交换数据
    blocks:
      - type: table
        head:
          - 操作
          - 输入余段4、2、3的变化
        rows:
          - - 交换p与min的data
            - 当前位置变2，余段变2、4、3
          - - 仅执行p=min
            - 结点数据仍是4、2、3，只移动了游标
          - - 再执行p=p->next
            - 游标到3，前面的4仍未排好
      - type: bullets
        items:
          - “记录最小值结点”与“把最小值放到当前位置”是两个动作。
  - type: content
    kicker: 解题过程
    title: 同键记录的次序可能改变
    blocks:
      - type: table
        head:
          - 状态
          - 数据记录序列
          - 说明
        rows:
          - - 初始
            - 2a，2b，1
            - a、b 区分同键记录
          - - 第1趟
            - 1，2b，2a
            - 1 与首位置的 2a 交换
          - - 第2趟
            - 1，2b，2a
            - 比较相等不更新 min
          - - 结论
            - 2a 与 2b 次序颠倒
            - 简单选择排序不稳定
  - type: content
    kicker: 答案代码
    title: 选择排序的答案（1/2）
    blocks:
      - type: code
        text: |-
          void SelectionSort(SortNode *L) {
              SortNode *p = L->next;
              while (p != NULL) {
                  SortNode *min = p, *q = p->next;
                  while (q != NULL) {
                      if (q->data < min->data) min = q;
                      q = q->next;
                  }
  - type: content
    kicker: 答案代码
    title: 选择排序的答案（2/2）
    blocks:
      - type: code
        text: |-
          if (min != p) {
                      int temp = p->data;
                      p->data = min->data;
                      min->data = temp;
                  }
                  p = p->next;
              }
          }
  - type: content
    kicker: 解题过程
    title: 工作量由每趟的扫描范围决定
    blocks:
      - type: bullets
        items:
          - n 个数据结点：关键字比较总数为 (n−1)+(n−2)+…+1。
          - 无论原序列已排序、逆序还是含重复值，比较总数不变。
          - 时间 O(n²)，辅助空间 O(1)。
          - 交换次数与输入有关，最多 n−1 次；比较次数与交换次数分开统计。
  - type: content
    title: 选择排序题的完整解释答案
    blocks:
      - type: bullets
        items:
          - 功能：依次选出未排序余段的最小数据，与当前结点数据交换。
          - n个数据结点共比较n(n−1)/2次，已升序时仍需扫描各余段。
          - 时间O(n²)，辅助空间O(1)，交换次数至多n−1。
          - 结点连接不变。若把数据看作带身份的记录，此排序不稳定。
  - type: content
    kicker: 解题过程
    title: 课堂检查：哪些修改会破坏答案
    blocks:
      - type: bullets
        items:
          - 归并题将 Lc=p 放到 p->next=Lc 之前。
          - 选择排序把 p=L->next 改为 p=L。
          - 选择排序删除最后的 p=p->next。
          - 分别写出一个最小反例，不只回答“错误”。
  - type: content
    kicker: 检查答案
    title: 课堂检查参考
    blocks:
      - type: bullets
        items:
          - 归并：p->next 指回 p，原结果链丢失。
          - 头结点参与排序：数据结点内容和哨兵数据可能互换。
          - p 不推进：在同一个位置反复选择，非空表不能终止。
