  - type: content
    kicker: 解题过程
    title: 主循环的四处填空
    blocks:
      - type: code
        text: |-
          while (①) {
              Node *p;
              if (②) { p = La; La = La->next; }
              else { p = Lb; Lb = Lb->next; }
              ③;
              ④;
          }
  - type: content
    title: 四个空分别受哪条已知条件约束
    blocks:
      - type: table
        head:
          - 空
          - 必须满足的状态
          - 依据
        rows:
          - - ①
            - La和Lb都能取data
            - 比较分支访问两表当前结点
          - - ②
            - 取较小的当前结点
            - 头插使取出顺序反转
          - - ③
            - p先连到原Lc
            - 旧结果链不能丢失
          - - ④
            - Lc再改为p
            - p成为新首结点
      - type: note
        text: 相等时取任一侧均可，只改变同值结点的身份次序。
  - type: content
    kicker: 解题过程
    title: 用重复值区分结点和关键字
    blocks:
      - type: table
        head:
          - 轮次
          - 取出的结点
          - 结果链 Lc
        rows:
          - - '1'
            - A 的 1
            - '1'
          - - '2'
            - B 的 2
            - 2 → 1
          - - '3'
            - A 的 3a
            - 3a → 2 → 1
          - - '4'
            - B 的 3b
            - 3b → 3a → 2 → 1
          - - 第5轮与收尾
            - 主循环取 A 的 5；收尾取 B 的 7
            - 7 → 5 → 3b → 3a → 2 → 1
  - type: content
    kicker: 答案代码
    title: 归并逆序的答案（1/2）
    blocks:
      - type: code
        text: |-
          Node *mergeAndReverse(Node *La, Node *Lb) {
              Node *Lc = NULL;
              while (La != NULL && Lb != NULL) {
                  Node *p;
                  if (La->data <= Lb->data) {
                      p = La; La = La->next;
                  } else { p = Lb; Lb = Lb->next; }
                  p->next = Lc; Lc = p;
              }
  - type: content
    kicker: 答案代码
    title: 归并逆序的答案（2/2）
    blocks:
      - type: code
        text: |-
          while (La != NULL) {
                  Node *p = La; La = La->next;
                  p->next = Lc; Lc = p;
              }
              while (Lb != NULL) {
                  Node *p = Lb; Lb = Lb->next;
                  p->next = Lc; Lc = p;
              }
              return Lc;
          }
  - type: content
    title: 三个循环共同消耗m+n个结点
    blocks:
      - type: table
        head:
          - 部分
          - 消耗的结点
          - 每结点工作
        rows:
          - - 主循环
            - 两表仍同时非空时取出的结点
            - 比较一次，摘取和头插
          - - A收尾
            - 主循环未取出的A余段
            - 摘取和头插
          - - B收尾
            - 主循环未取出的B余段
            - 摘取和头插
          - - 合计
            - 每个输入结点恰好一次
            - 固定次指针操作
      - type: bullets
        items:
          - 对非空输入，总摘取次数m+n，时间O(m+n)。
  - type: content
    kicker: 解题过程
    title: 把功能与复杂度写完整
    blocks:
      - type: bullets
        items:
          - 功能：复用两条非递减链表的全部结点，生成一条非递增链表。
          - 时间 O(m+n)：每个输入结点只被取出一次。
          - 辅助空间 O(1)：结果使用原结点，只有固定数量指针。
          - 空表、单结点、重复值均可；输入不能共享结点。
  - type: content
    kicker: 解题过程
    title: 2025 阅读题：链表简单选择排序
    blocks:
      - type: bullets
        items:
          - 带头结点单链表 L；按 data 升序排序。
          - p 指向本趟待确定的位置；q 扫描余段；min 记录最小值结点。
          - 交换两个结点的数据，不重新连接结点。
          - 补全起点、交换条件和下一趟的位置。
  - type: content
    kicker: 解题过程
    title: 先读寻找最小值的一段
    blocks:
      - type: code
        text: |-
          p = ①;
          while (p != NULL) {
              Node *min = p, *q = p->next;
              while (q != NULL) {
                  if (q->data < min->data) min = q;
                  q = q->next;
              }
              // 随后交换 data，并推进 p
          }
  - type: content
    title: 第二趟扫描时，p之前的前缀已经确定
