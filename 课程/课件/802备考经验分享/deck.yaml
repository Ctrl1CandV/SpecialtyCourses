meta:
  id: LIVE-802-EXPERIENCE
  title: 802专业课备考经验分享
  stage: 直播分享
  instructor: 牙膏学长
  duration: 55min

slides:
  # ===== 机构前置部分 P1-P11 =====

  - type: cover
    kicker: 重邮802 数据结构备考经验分享
    title: 把时间花在真正得分的地方
    subtitle: 专业课复习路径、代码题训练与备考工具
    meta: 直播时间：2026年8月20日（周四）下午16:00 ｜ 主讲：牙膏学长

  - type: content
    badge: 直播地图
    kicker: 开场
    title: 今天的四块内容
    blocks:
      - type: bullets
        items:
          - 一、目前的计算机、人工智能、网络安全热度排行统计
          - 二、专业课复习路径（基础、强化、冲刺）
          - 三、代码如何复习（代码题训练与备考工具）
          - 四、自由问答环节

  - type: transition
    kicker: 一
    title: 目前的计算机、人工智能、网络安全热度排行统计
    subtitle: 26、27群内报考数据统计

  - type: content
    badge: 群内报考数据统计
    kicker: 生源结构
    title: 生源渠道稳定，不用担心双非出身
    blocks:
      - type: bullets
        items:
          - 重邮招生生源渠道一直比较稳定
          - 报考重邮的一半左右，来自以二本为主的高校
          - 双非、本科一般，**不用担心复试被歧视**
          - 网上“人数下降、复试线变高就是提纯”的说法，不要轻信
      - type: note
        text: 数据来源：重邮考研答疑群内学弟学妹填写，可作为参考，不能作为真实数据依赖

  - type: content
    badge: 群内报考数据统计
    kicker: 生源结构
    title: 本校占比约一成，对手都在各大高校
    blocks:
      - type: bullets
        items:
          - 报考重邮研究生的**本校占比只有10%左右**
          - 90%来自各大高校
          - 不用担心竞争不过本校学生，竞争对手是全国各校的同学
      - type: note
        text: 数据来源：重邮考研答疑群内学弟学妹填写，可作为参考，不能作为真实数据依赖

  - type: content
    badge: 群内报考数据统计
    kicker: 跨考情况
    title: 27跨考的同学少了很多
    blocks:
      - type: bullets
        items:
          - 报考802数据结构相关方向的同学可以看到，**27跨考的同学明显减少**
          - 跨考的同学注意了：竞争压力变小，更要好好复习
      - type: note
        text: 数据来源：重邮考研答疑群内学弟学妹填写，可作为参考，不能作为真实数据依赖

  - type: content
    badge: 群内报考数据统计
    kicker: 二战情况
    title: 二战的同学变多
    blocks:
      - type: bullets
        items:
          - 群内统计显示，**二战同学的比例在上升**
          - 对一战同学意味着：初试分数要尽量考高
      - type: note
        text: 数据来源：重邮考研答疑群内学弟学妹填写，可作为参考，不能作为真实数据依赖

  - type: content
    badge: 群内报考数据统计
    kicker: 报考人数变化
    title: 计专软专统一招生后的热度变化
    blocks:
      - type: bullets
        items:
          - 27计算机专硕与软件专硕**统一招生**
          - 26总体数据＝计专＋软专，即**58.47%**；27同比下降约13%
          - 人工智能学院学硕、专硕报考都在增加，同比增长约7%
          - 学硕除人工智能相关外，其他依旧维持“冷”的状态
      - type: note
        text: 数据来源：重邮考研答疑群内学弟学妹填写，可作为参考，不能作为真实数据依赖

  - type: content
    badge: 群内报考数据统计
    kicker: 四六级
    title: 一半同学没过四级，成绩最重要
    blocks:
      - type: bullets
        items:
          - 四六级基本比例保持不变
          - 基本一半的同学**没过四级**
          - 四六级不是决定性因素，**成绩才是最重要的**
      - type: note
        text: 数据来源：重邮考研答疑群内学弟学妹填写，可作为参考，不能作为真实数据依赖

  - type: content
    badge: 群内报考数据统计
    kicker: 竞赛与项目
    title: 一半同学和你一样“什么都没有”
    blocks:
      - type: bullets
        items:
          - 基本数据保持不变，**约一半同学没有竞赛、项目**
          - 不要担心自己什么都没有，大家起点差不多
          - 重邮是很公平的学校，一切以实力与成绩说话
      - type: note
        text: 数据来源：重邮考研答疑群内学弟学妹填写，可作为参考，不能作为真实数据依赖

  - type: transition
    kicker: 二
    title: 专业课复习路径
    subtitle: 基础、强化、冲刺

  # ===== 我们的部分 P12-P40 =====

  - type: content
    badge: 直播地图
    kicker: 时间安排
    title: 专业课是主线，政治与AI按现场时间展开
    blocks:
      - type: table
        head: [时长, 必讲内容, 可选内容]
        rows:
          - [50分钟, 完整专业课主线＋短问答, 简讲政治与AI]
          - [60分钟, 完整主线＋案例, 政治＋AI＋互动问答]

  - type: content
    kicker: 先看一个反差
    title: 最难的章节，不一定最值得投入最多时间
    blocks:
      - type: table
        head: [内容, 学习体感, 802复习重点]
        rows:
          - [KMP, 原理抽象、理解费劲, next与nextval手算]
          - [顺序表与链表, 概念直观、操作基础, 程序阅读与算法题的重要载体]
      - type: bullets
        items:
          - 复习不能按“哪里最难”平均分配时间
          - 更有效的判断是：**考什么、怎么考、分值在哪里**
          - 这也是整场分享的主线

  - type: content
    kicker: 我的备考背景
    title: 备考时间不长，更需要减少无效消耗
    blocks:
      - type: bullets
        items:
          - 我的备考周期偏紧，数学、英语和专业课同时占用时间
          - 身体不适短暂停下后，重新进入状态的成本比想象中高
          - 我没有依赖临考前爆发，而是尽量保持每天都向前推进
          - 以下内容是个人复盘，不是要求所有人照搬的唯一方案

  - type: content
    kicker: 备考节奏
    title: 稳定学习比偶尔爆发更可靠
    blocks:
      - type: table
        head: [方式, 短期感受, 长期结果]
        rows:
          - [连续稳定, 每天进度不一定惊人, 知识不断线、启动成本低]
          - [爆发后停摆, 单日完成很多, 遗忘与重新进入状态消耗更大]
      - type: bullets
        items:
          - 目标不是每天刷新学习时长，而是维持可持续的有效学习
          - 状态差时也保留最低动作：复盘错题、背单词、做数学题

  - type: content
    kicker: 关于学习时长
    title: 八小时是我的参考值，不是所有人的硬指标
    blocks:
      - type: bullets
        items:
          - 我的经验是尽量保证每天约八小时学习时间
          - 有课、实习或基础不同的人，需要按自己的条件调整
          - 判断标准应是：任务是否完成、知识是否吸收、第二天能否继续
          - 长时间坐着不等于有效学习，复盘结果比计时软件更重要

  - type: transition
    kicker: 专业课主线
    title: 自命题复习，先研究试卷再研究教材
    subtitle: 先确定得分任务，再决定章节投入

  - type: content
    kicker: 802是自命题
    title: 开始复习前，先回答四个问题
    blocks:
      - type: table
        head: [问题, 要查的材料]
        rows:
          - [考哪些章节, 最新考纲与学校通知]
          - [题型和分值如何分布, 近年真题]
          - [常用什么方式考, 真题答案与评分要求]
          - [哪些内容变化过, 不同年份考纲与试卷对照]
      - type: note
        text: 学校、考纲、科目代码与分值等事实，以官方文件和原始试卷为准

  - type: content
    kicker: 近年试卷结构
    title: 项目现有2024-2026资料显示四类稳定任务
    blocks:
      - type: table
        head: [题型, 近年分值, 复习任务]
        rows:
          - [程序阅读题, 约20分, 看懂代码、补空、分析功能与复杂度]
          - [填空题, 约30分, KMP、数组地址、堆调整、后缀表达式等手算]
          - [综合应用题, 约70分, 图树查找排序等过程分析]
          - [算法分析题, 3题共30分, 思想＋代码或伪代码＋复杂度]
      - type: note
        text: 依据项目内2024-2026真题材料；2026回忆版为阅读20分、填空10空每空3分、综合70分、算法题8＋10＋12分，以最新官方信息为准

  - type: content
    kicker: 时间分配目标
    title: 用更少的专业课时间，完成更明确的得分任务
    blocks:
      - type: bullets
        items:
          - 数学、英语同样需要大量时间，专业课不能无限扩张
          - 不追求每个章节研究到同样深度
          - 高频题型练到可复现，低频内容达到识别和基础作答
          - 用真题暴露缺口，再回教材补对应知识

  - type: content
    kicker: 章节投入
    title: 按考查方式分配精力，而不是平均用力
    blocks:
      - type: table
        head: [章节或能力, 建议投入, 训练重点]
        rows:
          - [线性表, 高, 定义、插删、逆置、快慢指针、条件删除]
          - [树与图, 高, 递归、层序、DFS、BFS、拓扑]
          - [查找与排序, 中高, 折半、BST、散列表、哈夫曼、快排、堆排]
          - [栈与队列, 中, 基本操作＋作为算法工具]
          - [串与KMP, 按题型, next与nextval手算、基础概念]

  - type: content
    kicker: KMP怎么学
    title: 理解到能手算，不必把全部时间耗在匹配代码上
    blocks:
      - type: bullets
        items:
          - KMP原理抽象，第一次学觉得难很正常
          - 现有课程与近年真题资料把重点放在**next、nextval数组手算**
          - 先做到给定模式串能稳定算对，再补原理解释
          - 若最新考纲或新真题改变考法，再调整代码训练深度
      - type: note
        text: 2024、2025真题均出现next数组手算填空（2026回忆版未见）；“不重点训练匹配代码”是基于现有资料的备考取舍

  - type: content
    kicker: 线性表怎么学
    title: 基础操作看似简单，却常承载代码分数
    blocks:
      - type: bullets
        items:
          - 顺序表与链表的定义、插入、删除必须能独立写出
          - 链表题常把经典操作换一个条件：逆置、合并、找倒数第k个、条件删除
          - 近三年程序阅读年年考链表：2024前插与合并、2025双向链表与排序、2026交集
          - 代码题难点往往不在新算法，而在指针次序和边界
          - 空表、头结点、尾结点、k是否合法要形成检查习惯

  - type: content
    kicker: 栈与队列怎么学
    title: 操作本身不复杂，价值在于支撑其他算法
    blocks:
      - type: table
        head: [工具, 直接操作, 典型用途]
        rows:
          - [栈, 入栈、出栈、判空判满, 递归理解、括号匹配、深度优先]
          - [队列, 入队、出队、判空判满, 层序遍历、广度优先、分层处理]
      - type: bullets
        items:
          - 学完操作后要追问：它在树、图和递归中解决什么问题
      - type: note
        text: 近三年真题里它们是程序阅读常客：2024拓扑排序、2025循环队列、2026共享栈

  - type: content
    kicker: 第一轮复习
    title: 可以借用408体系建立完整知识框架
    blocks:
      - type: bullets
        items:
          - 数据结构的大部分核心知识与408重合，成熟课程便于搭建框架
          - 第一轮跟课时，把概念、结构和经典算法学完整
          - 每学完一章，用802考纲划掉超范围或低优先级内容
          - 不直接照搬408的题量与难度分配

  - type: content
    kicker: 408材料怎么筛
    title: 内容重合，不代表复习要求完全相同
    blocks:
      - type: table
        head: [可直接借用, 需要按802调整]
        rows:
          - [线性表、树、图、查找、排序的基础体系, 题型、分值和书写方式]
          - [高质量真题与课后题, 超出802考纲的知识]
          - [经典算法的图解与推导, 某些约定、代码风格与手算侧重]
      - type: note
        text: 筛题依据是最新802考纲与近年真题，不是“408考过所以802一定考”

  - type: content
    kicker: 范围变化
    title: 外部排序纳入范围，不等于可以预测具体题型
    blocks:
      - type: bullets
        items:
          - 最新考纲已列入外部排序，就应完成基本概念和典型过程复习
          - 过去若干年是否出现，不能替代对最新考纲的核对
          - “可能只占一道基础题”只能作为个人风险判断
          - 复习策略是先保住高频主干，再给新增范围留出基础覆盖时间

  - type: content
    kicker: 题源选择
    title: 题目价值有层级，不需要见题就做
    blocks:
      - type: table
        head: [优先级, 题源, 用法]
        rows:
          - [最高, 近年802真题, 判断题型、难度、书写要求]
          - [较高, 802范围内的408真题, 补充高质量变式]
          - [中等, 高质量教材课后题, 巩固章节基础]
          - [谨慎, 早年真题、校内卷、普通模拟题, 先判断范围与命题风格是否仍匹配]

  - type: content
    kicker: 用题方法
    title: 做408题不是追数量，而是提取可迁移的思路
    blocks:
      - type: bullets
        items:
          - 只选802考纲覆盖的章节和题型
          - 做完标记“用了什么结构、什么模板、改了什么条件”
          - 把优秀解法压缩成可复现的步骤，不收藏整页答案
          - 再回到802真题，检查这些方法能否直接迁移

  # ===== 机构产品页 P30 =====

  - type: content
    badge: 课程介绍
    kicker: 基础与强化
    title: 基础班与强化班
    blocks:
      - type: bullets
        items:
          - "**基础班**：适合正在一轮基础，或看了王道但基础不够扎实的同学，快速过一遍基础"
          - "**强化班**：适合二轮强化，重要知识点回顾＋强化刷题思路、方法、举一反三"
          - 现报名**强化班送基础班**，价格359（包含资料书4本）
          - 均含初试专业课全程答疑服务

  - type: transition
    kicker: 三
    title: 代码如何复习
    subtitle: 代码题训练与备考工具

  - type: content
    kicker: 代码题训练
    title: 为802初试大量刷LeetCode，投入产出通常不高
    blocks:
      - type: table
        head: [训练目标, 更合适的练习]
        rows:
          - [802初试得分, 真题、经典模板、纸笔伪代码、复杂度分析]
          - [复试与编程能力, LeetCode、在线判题、可运行代码]
      - type: bullets
        items:
          - LeetCode有价值，但不能替代针对802题型的训练
          - 时间紧时，先保证真题原型能在纸上完整写出

  - type: content
    kicker: 代码题本质
    title: 近年题目常见“经典模板＋条件改写”
    blocks:
      - type: table
        head: [题目表面, 可复用模板]
        rows:
          - [链表原地逆置与重组, 头插法、断链拼接]
          - [倒数第k个结点, 快慢指针]
          - [树的路径、结点统计与判定, 递归三件套]
          - [图中满足条件的路径, DFS回溯]
          - [无权距离与分层, BFS分层]
          - [拓扑序列验证, 入度表法]

  - type: content
    kicker: 真题原型
    title: 2024-2026材料能看到模板连续出现
    blocks:
      - type: table
        head: [年份, 题目示例, 对应能力]
        rows:
          - [2024, 判二叉排序树、长度为k的路径、繁荣度, 递归、DFS、层序分层]
          - [2025, 倒数第k元素、根到叶最长路径、经过指定点路径, 快慢指针、递归、DFS]
          - [2026, 约瑟夫环、遍历序列建树、拓扑序列验证, 循环链表、递归建树、入度表]
      - type: note
        text: 示例来自项目内真题资料，2026三题分值为8、10、12分；训练重点是识别骨架并补边界

  - type: content
    kicker: 考场书写
    title: 算法题按三件套组织答案
    blocks:
      - type: table
        head: [部分, 要写什么]
        rows:
          - [算法思想, 使用的数据结构、主要步骤、关键条件]
          - [代码或伪代码, 函数签名、核心逻辑、必要边界]
          - [复杂度, 时间复杂度与空间复杂度及其依据]
      - type: bullets
        items:
          - 练习时就按答题格式写，不要只在脑中“会做”

  - type: content
    kicker: 三轮复习
    title: 每一轮解决不同问题
    blocks:
      - type: table
        head: [阶段, 目标, 主要动作]
        rows:
          - [第一轮, 建立知识框架, 跟课＋教材＋章节基础题]
          - [第二轮, 建立题型与模板, 真题分类＋模板默写＋错题回补]
          - [第三轮, 提升限时输出, 整套训练＋纸笔作答＋查缺补漏]
      - type: note
        text: 轮次不按日历机械切换，以“能否完成本轮目标”作为进入下一轮的条件

  # ===== 机构产品页 P37 =====

  - type: content
    badge: 课程介绍
    kicker: 代码与真题
    title: 代码专项班与真题班
    blocks:
      - type: bullets
        items:
